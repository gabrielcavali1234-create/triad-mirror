// LOGIN
// ════════════════════════════════════════════════════════════════════════
function telaLogin() {
  document.title = 'Entrar — TRIAD Mirror';
  $('#app').innerHTML = `<div class="login">${botaoTema()}
    <div class="esq">
      <div class="logo"><img src="/img/logo-dees-destaque.png" alt="Dees" class="logo-img grande logo-tema-claro"><img src="/img/logo-dees-claro.png" alt="Dees" class="logo-img grande logo-tema-escuro"></div>
      <div><h1>Pra onde vai o dinheiro do seu cliente, em minutos.</h1>
      <p>Extratos e faturas de cartão lidos por IA, conferidos com os totais do banco e prontos para a sua análise.</p></div>
      <div style="display:flex;gap:18px;font-size:13px;color:var(--fraco);flex-wrap:wrap"><span><i class="ti ti-lock"></i> Dados no Brasil</span><span><i class="ti ti-shield-check"></i> Acesso por analista</span></div>
    </div>
    <div class="dir">
      <form id="fLogin" novalidate>
        <div><h2 style="margin:0 0 4px;font-size:32px">Entrar</h2><p class="suave" style="margin:0">Use o acesso enviado pela sua empresa</p></div>
        <div><label class="rot" for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" placeholder="analista@consultoria.com.br" required></div>
        <div><label class="rot" for="lSenha">Senha</label>
          <div style="position:relative"><input id="lSenha" type="password" autocomplete="current-password" required style="padding-right:42px">
          <button type="button" id="lVer" aria-label="Mostrar senha" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--suave);font-size:18px"><i class="ti ti-eye"></i></button></div></div>
        <button class="btn primario" type="submit" id="lBtn" style="justify-content:center;padding:11px">Entrar</button>
        <div class="erro-txt" id="lErro" role="alert"></div>
        <p class="suave" style="font-size:12px;margin:0;text-align:center">Esqueceu a senha? Fale com o administrador da sua empresa.</p>
      </form>
    </div></div>`;
  $('#lVer').onclick = () => { const i = $('#lSenha'); i.type = i.type === 'password' ? 'text' : 'password'; };
  $('#lEmail').focus();
  $('#fLogin').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('#lEmail').value.trim(), senha = $('#lSenha').value;
    if (!email || !senha) { $('#lErro').textContent = 'Preencha e-mail e senha.'; return; }
    $('#lBtn').disabled = true; $('#lBtn').textContent = 'Entrando…'; $('#lErro').textContent = '';
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, senha }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Não foi possível entrar.');
      salvarSessao(d);
      location.hash = '#/clientes';
    } catch (e) {
      $('#lErro').textContent = e.message;
      $('#lBtn').disabled = false; $('#lBtn').textContent = 'Entrar';
    }
  };
}

// ════════════════════════════════════════════════════════════════════════
// CLIENTES
// ════════════════════════════════════════════════════════════════════════
async function telaClientes() {
  document.title = 'Painel — TRIAD Mirror';
  $('#app').innerHTML = topo() + `<main><div class="carregando">Carregando sua carteira…</div></main>`;
  try { E.painel = await api('GET', '/api/app/painel'); }
  catch (e) { return telaErro(e.message); }
  desenharClientes();
}

const USD_BRL = 5.5;   // só para mostrar o custo de IA em reais (aproximado)
const FILTROS_CARTEIRA = [
  ['todos', 'Todos'], ['em_revisao', 'Em revisão'], ['concluida', 'Concluídas'], ['alerta', 'Com alerta'], ['classificar', 'A classificar'], ['novo', 'Sem documentos']
];

function pillStatus(l) {
  if (l.status === 'novo') return '<span class="pill cinza">Sem documentos</span>';
  return l.status === 'concluida' ? '<span class="pill verde">Concluída</span>' : '<span class="pill amarelo">Em revisão</span>';
}

function desenharClientes() {
  const P = E.painel || { linhas: [], produtividade: null };
  const todas = P.linhas || [];
  const q = (E.buscaClientes || '').toLowerCase();
  const f = E.filtroCarteira || 'todos';
  const passaFiltro = l => f === 'todos' || (f === 'alerta' ? l.alertas.length > 0 : f === 'classificar' ? l.aClassificar > 0 : l.status === f);
  const lista = todas.filter(l => passaFiltro(l) && (!q || [l.nome, l.cpf, l.email].some(v => String(v || '').toLowerCase().includes(q))));
  const conta = k => todas.filter(l => k === 'todos' || (k === 'alerta' ? l.alertas.length : k === 'classificar' ? l.aClassificar : l.status === k)).length;
  const pr = P.produtividade;
  const comAlerta = todas.filter(l => l.alertas.length).length;
  const rotativo = todas.filter(l => l.emRotativo).length;

  const linhas = lista.map(l => {
    const docsTxt = l.status === 'novo' ? 'Sem documentos' : [l.extratos ? `${l.extratos} extrato${l.extratos > 1 ? 's' : ''}` : '', l.faturas ? `${l.faturas} fatura${l.faturas > 1 ? 's' : ''}` : '', l.meses.length ? `${nomeMesCurto(l.meses[0])}${l.meses.length > 1 ? ' a ' + nomeMesCurto(l.meses[l.meses.length - 1]) : ''}` : ''].filter(Boolean).join(' · ');
    const pct = l.pctRendaEmParcelas;
    const corPct = pct == null ? '' : pct >= 30 ? 'color:var(--vermelho)' : pct >= 15 ? 'color:var(--marrom)' : 'color:var(--verde)';
    return `<tr class="linha" tabindex="0" data-acao="abrir-cliente" data-id="${l.clienteId}">
      <td><div style="display:flex;align-items:center;gap:10px"><span class="ini">${esc(iniciais(l.nome))}</span><div><b>${esc(l.nome)}</b><div class="fraco" style="font-size:12px">${esc(docsTxt)}</div></div></div></td>
      <td>${pillStatus(l)}</td>
      <td class="num">${l.renda ? brl(l.renda) + `<div class="fraco" style="font-size:11px">${l.rendaFonte === 'declarada' ? 'declarada' : 'média das entradas'}</div>` : '<span class="fraco">—</span>'}</td>
      <td class="num">${l.parcelasProximaFatura ? brl(l.parcelasProximaFatura) + (pct != null ? `<div style="font-size:12px;font-weight:600;${corPct}">${Math.round(pct)}% da renda</div>` : '') : '<span class="fraco">—</span>'}</td>
      <td style="font-size:13px">${l.alertas.length ? l.alertas.map(a => `<div style="color:${/Rotativo|renda|ilegível/.test(a) ? 'var(--vermelho)' : 'var(--marrom)'}"><i class="ti ti-alert-triangle"></i> ${esc(a)}</div>`).join('') : '<span class="fraco">Nenhum</span>'}</td>
      <td class="num">${l.aClassificar ? `<span class="pill amarelo">${l.aClassificar}</span>` : l.status === 'novo' ? '<span class="fraco">—</span>' : '<span class="pill verde"><i class="ti ti-check"></i></span>'}</td>
      <td class="suave" style="font-size:13px">${l.atualizadoEm ? dataLonga(l.atualizadoEm) : '—'}</td>
    </tr>`;
  }).join('');

  const maxBar = pr ? Math.max(1, ...pr.porMes.map(m => m.concluidas)) : 1;
  const prod = pr ? `<div class="card prod">
      <div class="prod-cab"><b>Produtividade</b><span class="fraco">${nomeMes(pr.mes)}</span></div>
      <div class="prod-grade">
        <div><small>Análises concluídas</small><b>${pr.analisesConcluidas}</b></div>
        <div><small>Clientes novos</small><b>${pr.clientesNovos}</b></div>
        <div><small>Documentos lidos pela IA</small><b>${pr.documentosLidos}</b></div>
        <div><small>Custo de IA no mês</small><b>${brl(pr.custoIAMes * USD_BRL)}</b><span class="fraco">US$ ${pr.custoIAMes.toFixed(2)}</span></div>
        <div><small>Custo médio por cliente</small><b>${pr.custoMedioPorCliente != null ? brl(pr.custoMedioPorCliente * USD_BRL) : '—'}</b></div>
        <div><small>Leitura da IA por cliente</small><b>${pr.tempoMedioLeituraSeg != null ? (pr.tempoMedioLeituraSeg >= 60 ? Math.round(pr.tempoMedioLeituraSeg / 60) + ' min' : pr.tempoMedioLeituraSeg + ' s') : '—'}</b></div>
        <div><small>Do cadastro à conclusão</small><b>${pr.diasMedioAteConcluir != null ? String(pr.diasMedioAteConcluir).replace('.', ',') + ' dia(s)' : '—'}</b></div>
        <div><small>Em andamento agora</small><b>${pr.emAndamento}</b></div>
      </div>
      <div class="prod-barras" aria-label="Análises concluídas nos últimos 6 meses">${pr.porMes.map(m => `<div title="${nomeMes(m.mes)}: ${m.concluidas} concluída(s), ${m.documentos} documento(s), US$ ${m.custoIA.toFixed(2)}"><span class="v">${m.concluidas || ''}</span><span class="b" style="height:${Math.round(m.concluidas / maxBar * 52) + 2}px"></span><span class="m">${nomeMesCurto(m.mes)}</span></div>`).join('')}</div>
      <div class="fraco" style="font-size:12px">Análises concluídas por mês · custo em reais com dólar a R$ ${USD_BRL.toFixed(2).replace('.', ',')}</div>
    </div>` : '';

  $('#app').innerHTML = topo() + `<main>
    <div class="cab-pagina">
      <div><h1>Sua carteira</h1><div class="suave" style="margin-top:4px">${todas.length} cliente(s) · ${conta('em_revisao')} em revisão · ${conta('concluida')} concluída(s)</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="search" id="bCli" aria-label="Buscar clientes" placeholder="Buscar por nome, CPF ou e-mail…" value="${esc(E.buscaClientes || '')}" style="width:260px">
        <button class="btn primario" data-acao="novo-cliente"><i class="ti ti-plus"></i> Novo cliente</button>
      </div>
    </div>
    ${todas.length ? `<div class="kpis">
      <div class="kpi"><small>Clientes na carteira</small><b>${todas.length}</b></div>
      <div class="kpi"><small>Análises em revisão</small><b>${conta('em_revisao')}</b></div>
      <div class="kpi"><small>Com alerta</small><b style="color:${comAlerta ? 'var(--vermelho)' : 'inherit'}">${comAlerta}</b></div>
      <div class="kpi"><small>No rotativo do cartão</small><b style="color:${rotativo ? 'var(--vermelho)' : 'inherit'}">${rotativo}</b></div>
      <div class="kpi"><small>Lançamentos a classificar</small><b>${todas.reduce((a, l) => a + l.aClassificar, 0)}</b></div>
    </div>` : ''}
    <div class="painel-grade">
      <div class="card" style="overflow-x:auto;min-width:0">
        ${todas.length ? `<div class="filtros" style="padding:14px 16px 0">${FILTROS_CARTEIRA.map(([k, t]) => `<button class="fc ${f === k ? 'on' : ''}" data-acao="filtro-carteira" data-f="${k}">${t} <span class="fraco">${conta(k)}</span></button>`).join('')}</div>
        <table class="tabela-clientes carteira"><thead><tr><th>Cliente</th><th>Situação</th><th>Renda</th><th>Parcelas na próx. fatura</th><th>Alertas</th><th>A classificar</th><th>Atualizado</th></tr></thead><tbody>${linhas || '<tr><td colspan="7" class="suave" style="padding:24px">Nenhum cliente encontrado.</td></tr>'}</tbody></table>`
        : `<div class="vazio"><h2>Cadastre seu primeiro cliente</h2><p class="suave">Cada cliente tem um perfil próprio, com os extratos, as faturas e a sua análise.</p><button class="btn primario" data-acao="novo-cliente"><i class="ti ti-plus"></i> Novo cliente</button></div>`}
      </div>
      ${todas.length ? prod : ''}
    </div></main>`;
  const b = $('#bCli');
  if (b) { b.oninput = () => { E.buscaClientes = b.value; const p = b.selectionStart; desenharClientes(); const n = $('#bCli'); n.focus(); n.setSelectionRange(p, p); }; }
}


// ════════════════════════════════════════════════════════════════════════
// CLIENTE — apuração
// ════════════════════════════════════════════════════════════════════════
async function telaCliente(id, silencioso) {
  if (!silencioso) { E.catCartao = null; E.calMes = null; }
  if (!silencioso) $('#app').innerHTML = topo() + `<main><div class="carregando">Abrindo análise…</div></main>`;
  try { E.cli = await api('GET', '/api/app/clientes/' + id); }
  catch (e) { return telaErro(e.message); }
  document.title = E.cli.cliente.nome + ' — TRIAD Mirror';
  desenharCliente();
}

const lancs = () => E.cli?.apuracao?.lancamentos || [];
/** Mostra o ano só quando ele é diferente do ano mais recente da análise (ex: parcelas antigas). */
const anoDiferente = iso => { const anos = lancs().map(l => (l.data || '').slice(0, 4)).filter(Boolean); const max = anos.sort().pop(); return iso && max && iso.slice(0, 4) !== max; };
const docsDe = tipo => (E.cli?.documentos || []).filter(d => d.tipo === tipo);

function salvoTxt() {
  if (E.salvando) return '<span class="salvo"><i class="ti ti-loader-2"></i> Salvando…</span>';
  if (E.salvoEm) return `<span class="salvo"><i class="ti ti-check" style="color:#7fd19c"></i> Salvo ${new Date(E.salvoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>`;
  return '';
}

function desenharCliente() {
  const { cliente, analise, documentos } = E.cli;
  const ext = docsDe('extrato'), fat = docsDe('fatura');
  const bancosConta = [...new Set(ext.map(d => d.banco).filter(Boolean))];
  const cartoes = fat.map(d => d.produto || ('Cartão ' + (d.banco || ''))).filter((v, i, a) => a.indexOf(v) === i);
  if (!ext.length && fat.length && E.aba === 'conta') E.aba = 'cartao';
  const concluida = analise.status === 'concluida';
  const fi = cliente.ficha || {}, idade = idadeDe(fi.nascimento);
  const objs = (fi.objetivos || []).map(o => o.descricao).filter(Boolean);
  const info = [cliente.cpf ? 'CPF ' + esc(cliente.cpf) : '', idade != null ? idade + ' anos' : '', fi.profissao ? esc(fi.profissao) : '', cliente.telefone ? esc(cliente.telefone) : '', cliente.renda_declarada ? 'Renda declarada ' + brl(cliente.renda_declarada) : '',
    objs.length ? (objs.length > 1 ? 'Objetivos: ' : 'Objetivo: ') + esc(objs.join(', ')) : cliente.objetivo ? 'Objetivo: ' + esc(cliente.objetivo) : ''].filter(Boolean).join(' · ');

  const chipsDocs = documentos.map(d => {
    const conta = d.tipo === 'extrato';
    const extra = conta ? '' : (d.conferencia?.bateu === true ? ' <span class="pill verde" title="Todos os totais impressos conferem">conferida</span>' : d.conferencia?.bateu === false ? ' <span class="pill vermelho">divergente</span>' : '');
    const ruim = d.qualidade_ruim ? ' <span class="pill vermelho" title="' + esc(d.motivo_qualidade_ruim || '') + '">ilegível</span>' : '';
    return `<span class="doc"><span class="ic ${conta ? 'conta' : 'cartao'}" style="width:24px;height:24px;font-size:14px;border-radius:6px"><i class="ti ${conta ? 'ti-building-bank' : 'ti-credit-card'}"></i></span>
      <span><b>${conta ? 'Conta' : 'Cartão'} ${esc(d.banco || '')}</b>${!conta && d.vencimento ? ' · venc. ' + dataBR(d.vencimento) + '/' + d.vencimento.slice(2, 4) : ''} <span class="fraco">· ${d.lancamentos} lanç.</span>${extra}${ruim}</span>
      <button data-acao="excluir-doc" data-id="${d.id}" title="Excluir documento" aria-label="Excluir documento"><i class="ti ti-x"></i></button></span>`;
  }).join('');

  $('#app').innerHTML = topo(salvoTxt()) + `<main>
    <div style="margin-bottom:10px"><a href="#/clientes" class="suave" style="text-decoration:none;font-size:13px"><i class="ti ti-arrow-left"></i> Clientes</a></div>
    <div class="card">
      <div class="perfil">
        <div style="display:flex;gap:14px;align-items:center;min-width:0"><span class="ini">${esc(iniciais(cliente.nome))}</span>
          <div style="min-width:0"><h1>${esc(cliente.nome)}</h1><div class="suave" style="font-size:13px;margin-top:3px">${info || 'Perfil sem dados complementares'}</div></div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${concluida ? '<span class="pill verde"><i class="ti ti-check"></i> Análise concluída</span>' : documentos.length ? '<span class="pill amarelo">Em revisão</span>' : '<span class="pill cinza">Sem documentos</span>'}
          <button class="btn" data-acao="editar-perfil"><i class="ti ti-user-edit"></i> Ficha</button>
        </div>
      </div>
      ${documentos.length ? `<div class="docs">${chipsDocs}<button class="btn" data-acao="novo-doc" style="padding:6px 11px;font-size:13px"><i class="ti ti-plus"></i> Documento</button></div>` : ''}
    </div>
    ${documentos.length ? `
    <div class="abas" role="tablist">
      <button class="aba ${E.aba === 'tudo' ? 'on' : ''}" data-acao="aba" data-aba="tudo" role="tab"><span class="ic tudo"><i class="ti ti-layout-list"></i></span><span><b>Tudo junto</b><small>Conta + cartão</small></span></button>
      <button class="aba ${E.aba === 'conta' ? 'on' : ''}" data-acao="aba" data-aba="conta" role="tab"><span class="ic conta"><i class="ti ti-building-bank"></i></span><span><b>Conta bancária</b><small>${bancosConta.length ? esc(bancosConta.join(', ')) : 'Nenhum extrato ainda'}</small></span></button>
      <button class="aba ${E.aba === 'cartao' ? 'on' : ''}" data-acao="aba" data-aba="cartao" role="tab"><span class="ic cartao"><i class="ti ti-credit-card"></i></span><span><b>Cartão de crédito</b><small>${cartoes.length ? esc(cartoes.join(', ')) : 'Nenhuma fatura ainda'}</small></span></button>
      <button class="aba ${E.aba === 'plano' ? 'on' : ''}" data-acao="aba" data-aba="plano" role="tab"><span class="ic tudo"><i class="ti ti-target-arrow"></i></span><span><b>Plano do cliente</b><small>Atitudes e simulação</small></span></button>
    </div>
    <div id="conteudo"></div>` : `
    <div class="card vazio" style="margin-top:16px"><h2>Envie o primeiro documento</h2><p class="suave">Extrato bancário (conta) ou fatura do cartão de crédito, em PDF ou foto.</p><button class="btn primario" data-acao="novo-doc"><i class="ti ti-upload"></i> Enviar documento</button></div>`}
  </main>
  ${documentos.length ? `<div class="barra-acoes">
    <button data-acao="novo-doc"><i class="ti ti-file-plus"></i> Documento</button>
    <button data-acao="excel"><i class="ti ti-table-export"></i> Excel</button>
    <button data-acao="editar-perfil"><i class="ti ti-user"></i> Ficha</button>
    ${concluida ? '<button data-acao="status" data-status="aberta"><i class="ti ti-arrow-back-up"></i> Reabrir análise</button>' : '<button class="destaque" data-acao="status" data-status="concluida"><i class="ti ti-check"></i> Concluir análise</button>'}
  </div>` : ''}`;
  if (documentos.length) desenharConteudo();
}

function desenharConteudo() {
  const el = $('#conteudo'); if (!el) return;
  if (E.aba === 'conta') el.innerHTML = abaConta();
  else if (E.aba === 'cartao') el.innerHTML = abaCartao();
  else if (E.aba === 'plano') { el.innerHTML = abaPlano(); ligarPlano(); }
  else el.innerHTML = abaTudo();
  const topoDir = document.querySelector('.topo .dir');
  if (topoDir) { const s = topoDir.querySelector('.salvo'); const novo = salvoTxt(); if (s) s.outerHTML = novo || ''; else if (novo) topoDir.insertAdjacentHTML('afterbegin', novo); }
}

// ─── Linha de lançamento (comum às três abas) ───────────────────────────
function linha(l) {
  const sel = E.sel.has(l.id);
  const mudouCat = l.categoria !== l.categoriaIA || (l.subcategoria || '') !== (l.subcategoriaIA || '');
  let aviso = '';
  if (l.alerta && l.situacao === 'incluido') {
    const btn = l.alerta.tipo === 'possivel_entre_contas' ? `<button data-acao="sit-rapida" data-id="${l.id}" data-sit="entre_contas">Marcar entre contas</button>`
      : l.alerta.tipo === 'possivel_duplicidade_fatura' ? `<button data-acao="sit-rapida" data-id="${l.id}" data-sit="excluido">Ignorar</button>` : '';
    aviso = `<div class="aviso"><i class="ti ti-info-circle"></i><span>${esc(l.alerta.mensagem)}</span>${btn}</div>`;
  } else if (l.alerta && l.alerta.tipo === 'pagamento_na_fatura') {
    aviso = `<div class="aviso" style="color:var(--fraco)"><i class="ti ti-info-circle"></i><span>Pagamento da fatura anterior: fica fora do resumo.</span></div>`;
  }
  const origem = l.origem === 'extrato' ? `<i class="ti ti-building-bank"></i> Conta ${esc(l.banco || '')}`
    : `<i class="ti ti-credit-card"></i> ${esc(l.documento)}${l.parcela ? ` · compra feita em ${dataCompleta(l.data)}` : ''}${l.parcelaInicio ? ` · <b style="color:var(--texto);font-weight:600">1ª parcela ${nomeMesCurto(l.parcelaInicio)} → última ${nomeMesCurto(l.parcelaFim)}</b>${l.parcelasRestantes ? ` (faltam ${l.parcelasRestantes})` : ' (última!)'}` : ''}`;
  return `<div class="r ${sel ? 'sel' : ''} ${l.situacao !== 'incluido' ? 'off' : ''}" data-id="${l.id}">
    <span class="ck"><input type="checkbox" data-acao="sel" data-id="${l.id}" ${sel ? 'checked' : ''} aria-label="Selecionar lançamento"></span>
    <span class="data suave num" title="${esc(l.data)}">${dataBR(l.data)}${anoDiferente(l.data) ? '<br><span style="font-size:11px">' + l.data.slice(0, 4) + '</span>' : ''}</span>
    <div class="desc"><b>${esc(l.descricao)}</b>${l.parcela ? ` <span class="pill cinza" style="font-size:11px">parcela ${esc(l.parcela)}</span>` : ''}
      <div class="meta">${origem}</div>
      ${l.observacao ? `<div class="nota"><i class="ti ti-note"></i> ${esc(l.observacao)}</div>` : ''}${aviso}</div>
    <div class="cat-col"><button class="cat ${mudouCat ? 'mudou' : ''}" data-acao="editar" data-id="${l.id}" title="${mudouCat ? 'Alterado pelo analista. A IA tinha sugerido: ' + esc(l.categoriaIA + (l.subcategoriaIA ? ' › ' + l.subcategoriaIA : '')) : 'Clique para mudar'}">
      <span class="ponto" style="background:${corDe(l.categoria)}"></span><b>${esc(l.categoria)}</b> <i class="ti ti-chevron-down"></i><br><span class="sub">${esc(l.subcategoria || 'Sem subcategoria')}</span></button>
      ${classificavel(l) ? `<button class="cls ${l.classe || ''}" data-acao="menu-cls" data-id="${l.id}" title="${l.parcelaCartao ? 'Parcela do cartão: diga se é custo fixo ou variável' : 'Onde este lançamento entra na planilha da consultoria'}"><span><i class="ti ti-table"></i> ${l.classe ? NOME_CLASSE[l.classe] : l.parcelaCartao ? 'Parcela: fixo ou variável?' : 'A classificar'}</span><i class="ti ti-chevron-down"></i></button>` : ''}</div>
    <span class="valor num ${l.direcao === 'entrada' ? 'entrada' : 'saida'}">${l.direcao === 'entrada' ? '+ ' : '− '}${brl(l.valor)}</span>
    <div class="acoes-linha"><button class="sit ${l.situacao}" data-acao="menu-sit" data-id="${l.id}">${NOME_SIT[l.situacao]} <i class="ti ti-chevron-down"></i></button>
      <button class="icone-btn ${l.observacao ? 'tem' : ''}" data-acao="editar" data-id="${l.id}" data-foco="obs" title="Observação" aria-label="Observação"><i class="ti ti-message-2"></i></button></div>
  </div>`;
}
const cabLinhas = () => `<div class="r r-cab"><span></span><span>Data</span><span>Descrição</span><span>Categoria › subcategoria</span><span style="text-align:right">Valor</span><span style="text-align:right">Situação</span></div>`;

function barraLote() {
  if (!E.sel.size) return '';
  return `<div class="lote"><span><b style="color:var(--marca)">${E.sel.size}</b> selecionado(s)</span><span style="display:flex;gap:6px;flex-wrap:wrap">
    <button data-acao="lote-cat"><i class="ti ti-tag"></i> Mudar categoria</button>
    <button data-acao="menu-cls-lote"><i class="ti ti-table"></i> Classificar</button>
    <button data-acao="lote-sit" data-sit="excluido"><i class="ti ti-eye-off"></i> Ignorar</button>
    <button data-acao="lote-sit" data-sit="entre_contas"><i class="ti ti-arrows-exchange"></i> Entre contas</button>
    <button data-acao="lote-sit" data-sit="incluido"><i class="ti ti-check"></i> Voltar ao resumo</button>
    <button data-acao="lote-limpar"><i class="ti ti-x"></i> Limpar</button></span></div>`;
}

// ─── Cálculos por mês ────────────────────────────────────────────────────
/** Mês em que o dinheiro sai: conta = data do lançamento; cartão = mês do vencimento da fatura. */
const mesDe = l => l.mesReferencia || (l.data || '').slice(0, 7);
const dataCompleta = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : esc(iso || '');

function porMes(lista) {
  const m = {};
  for (const l of lista) {
    const k = mesDe(l); if (!/^\d{4}-\d{2}$/.test(k)) continue;
    (m[k] = m[k] || { k, itens: [], e: 0, s: 0 }).itens.push(l);
    if (l.situacao !== 'incluido') continue;
    if (l.direcao === 'entrada') { if (l.origem === 'extrato') m[k].e += l.valor; else m[k].s -= l.valor; }
    else m[k].s += l.valor;
  }
  return Object.values(m).sort((a, b) => b.k.localeCompare(a.k));
}

function mixGastos(lista, modo) {
  const t = {}; let tot = 0;
  for (const l of lista) {
    if (l.situacao !== 'incluido' || (l.direcao === 'entrada' && l.origem === 'extrato')) continue;
    const k = modo === 'sub' ? (l.subcategoria || 'Sem subcategoria') : l.categoria;
    const v = l.direcao === 'saida' ? l.valor : -l.valor;
    t[k] = (t[k] || 0) + v; tot += v;
  }
  return { itens: Object.entries(t).filter(([, v]) => Math.abs(v) >= 0.01).sort((a, b) => b[1] - a[1]), tot };
}

function grupoMes(g, conteudoBlocos, filtrados) {
  const busca = (E.busca[g.k] || '').toLowerCase();
  const visiveis = g.itens.filter(l => !busca || (l.descricao + ' ' + l.categoria + ' ' + (l.subcategoria || '') + ' ' + (l.observacao || '')).toLowerCase().includes(busca));
  const todosSel = visiveis.length && visiveis.every(l => E.sel.has(l.id));
  return `<section class="mes" id="mes-${g.k}">
    <div class="mes-cab"><span style="display:flex;align-items:center;gap:10px"><input type="checkbox" data-acao="sel-mes" data-mes="${g.k}" ${todosSel ? 'checked' : ''} aria-label="Selecionar todos do mês"><b>${nomeMes(g.k)}</b><span class="qtd">${g.itens.length} lançamento(s)</span></span>
      <span class="tot" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--suave)"><input type="search" data-acao="busca-mes" data-mes="${g.k}" aria-label="Buscar lançamentos no mês" placeholder="Buscar no mês…" value="${esc(E.busca[g.k] || '')}">
        ${g.e ? `<span>Entrou <b class="num" style="color:var(--verde)">${brl(g.e)}</b></span>` : ''}<span>Saiu <b class="num" style="color:var(--texto)">${brl(g.s)}</b></span></span></div>
    ${conteudoBlocos(visiveis)}
    ${filtrados ? `<div class="fraco" style="padding:8px 14px;font-size:12px;border-top:1px solid var(--borda2)">Filtro de categoria ativo: mostrando só parte dos lançamentos. Os totais do mês continuam completos.</div>` : ''}
  </section>`;
}

// ─── ABA CONTA BANCÁRIA (estilo TRIAD) ──────────────────────────────────
function progressoCls(feitos, total, pendentes, extra) {
  return `<div class="progresso-cls"><span><i class="ti ti-table"></i> <b>Planilha da consultoria:</b> ${feitos} de ${total} classificados${extra || ''}</span>
    <span class="trilho"><span style="width:${total ? Math.round(feitos / total * 100) : 0}%"></span></span>
    ${pendentes ? `<button class="fc ${E.soPendentes ? 'on' : ''}" data-acao="so-pendentes">${E.soPendentes ? 'Mostrando só os' : 'Mostrar só os'} ${pendentes} a classificar</button>` : '<span class="pill verde"><i class="ti ti-check"></i> Tudo classificado</span>'}</div>`;
}
function abaConta() {
  const docs = docsDe('extrato');
  if (!docs.length) return `<div class="card vazio"><h2>Nenhum extrato bancário</h2><p class="suave">Envie o extrato da conta para ver entradas, saídas e médias por mês.</p><button class="btn primario" data-acao="novo-doc" data-tipo="extrato"><i class="ti ti-upload"></i> Enviar extrato</button></div>`;
  const todos = lancs().filter(l => l.origem === 'extrato');
  const meses = porMes(todos);
  const bancos = [...new Set(docs.map(d => d.banco).filter(Boolean))];
  const n = meses.length || 1;
  const medE = meses.reduce((a, m) => a + m.e, 0) / n, medS = meses.reduce((a, m) => a + m.s, 0) / n;
  const cats = [...new Set(todos.map(l => l.categoria))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const filtroAtivo = Object.keys(E.filtroCat).filter(k => E.filtroCat[k]);
  const passa = l => (!filtroAtivo.length || filtroAtivo.includes(l.categoria)) && (!E.soPendentes || (classificavel(l) && !l.classe));
  const mix = mixGastos(todos, E.modoMix);
  let acc = 0;
  const grad = mix.tot > 0 ? mix.itens.map(([k, v]) => { const p = Math.max(0, v) / mix.tot * 100; const s = `${corDe(k)} ${acc}% ${acc + p}%`; acc += p; return s; }).join(',') : 'var(--borda2) 0 100%';
  const sugestoes = todos.filter(l => l.alerta?.tipo === 'possivel_entre_contas' && l.situacao === 'incluido').length;
  const pagFatura = todos.filter(l => l.alerta?.tipo === 'possivel_duplicidade_fatura' && l.situacao === 'incluido').length;
  const relatorio = docs.map(d => d.relatorio ? `<p><b>${esc(d.banco || 'Conta')}:</b> ${esc(d.relatorio)}</p>` : '').join('') || '<p class="fraco">Sem relatório.</p>';
  const mesesVis = E.mesSel ? meses.filter(m => m.k === E.mesSel) : meses;
  const classificaveis = todos.filter(classificavel);
  const feitos = classificaveis.filter(l => l.classe).length;
  const pendentes = classificaveis.length - feitos;

  return `
  <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
    <div class="stats"><span><i class="ti ti-file"></i> ${docs.length} extrato(s)</span><span><i class="ti ti-list"></i> ${todos.length} transações</span><span><i class="ti ti-building-bank"></i> ${bancos.length} banco(s)</span><span><i class="ti ti-calendar"></i> ${meses.length} mês(es)</span></div>
    ${E.mesSel ? `<button class="btn" data-acao="mes" data-mes="" style="padding:6px 11px;font-size:13px"><i class="ti ti-x"></i> Ver todos os meses</button>` : ''}
  </div>
  <div class="meses">${meses.slice().reverse().map(m => `<button class="mc ${E.mesSel === m.k ? 'on' : ''}" data-acao="mes" data-mes="${m.k}"><b>${nomeMes(m.k)}</b>
    <div><span class="suave">Entradas</span><span class="num" style="color:var(--verde)">+ ${brl(m.e)}</span></div>
    <div><span class="suave">Saídas</span><span class="num">− ${brl(m.s)}</span></div>
    <div style="margin-top:4px;padding-top:4px;border-top:1px solid var(--borda2)"><span class="suave">Saldo</span><b class="num" style="margin:0;color:${m.e - m.s >= 0 ? 'var(--texto)' : 'var(--vermelho)'}">${brl(m.e - m.s)}</b></div></button>`).join('')}</div>
  <div class="medias">
    <div><span class="tit">Médias por mês</span><small>${meses.length} mês(es) consolidado(s) · ${esc(bancos.join(', '))}</small></div>
    <div><small>Entrada média</small><b class="num" style="color:var(--verde)">${brl(medE)}</b></div>
    <div><small>Saída média</small><b class="num">${brl(medS)}</b></div>
    <div><small>Saldo médio</small><b class="num" style="color:var(--primaria-texto)">${brl(medE - medS)}</b></div>
  </div>
  ${sugestoes ? `<div class="alerta azul"><i class="ti ti-arrows-exchange"></i><span>${sugestoes} lançamento(s) parece(m) transferência entre contas da própria cliente. Confira os avisos em azul nas linhas: se for, marque como "Entre contas" para não inflar entradas e saídas.</span></div>` : ''}
  ${pagFatura ? `<div class="alerta"><i class="ti ti-credit-card"></i><span>${pagFatura} pagamento(s) de fatura de cartão na conta. Eles continuam somados até você decidir: se a fatura detalhada estiver na aba Cartão, ignore o pagamento para não contar o gasto duas vezes.</span></div>` : ''}
  <div class="layout-conta">
    <div style="min-width:0">
      ${progressoCls(feitos, classificaveis.length, pendentes)}
      <div class="filtros"><span class="suave" style="font-size:12px"><i class="ti ti-filter"></i> Categorias:</span>${cats.map(c => `<button class="fc ${E.filtroCat[c] ? 'on' : ''}" data-acao="filtro" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}${filtroAtivo.length ? `<button class="fc" data-acao="filtro-limpar"><i class="ti ti-x"></i> Limpar</button>` : ''}</div>
      ${barraLote()}
      ${mesesVis.map(g => grupoMes(g, vis => {
        const v = vis.filter(passa);
        return v.length ? cabLinhas() + v.map(linha).join('') : `<div class="fraco" style="padding:14px">Nenhum lançamento ${filtroAtivo.length ? 'nessas categorias' : 'encontrado'} neste mês.</div>`;
      }, filtroAtivo.length)).join('')}
    </div>
    <aside class="lateral">
      <div class="card relatorio"><h3>Relatório executivo</h3>${relatorio}</div>
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="margin:0">Mix de gastos</h3>
        <div class="alterna"><button class="${E.modoMix === 'cat' ? 'on' : ''}" data-acao="mix" data-modo="cat">Categoria</button><button class="${E.modoMix === 'sub' ? 'on' : ''}" data-acao="mix" data-modo="sub">Sub</button></div></div>
        <div class="rosca" style="background:conic-gradient(${grad})"><div><b class="num">${brl(mix.tot)}</b><span class="fraco" style="font-size:12px">saídas da conta</span></div></div>
        ${mix.itens.map(([k, v]) => `<div class="leg" ${E.modoMix === 'cat' ? `data-acao="filtro" data-cat="${esc(k)}" role="button" tabindex="0"` : ''} title="${E.modoMix === 'cat' ? 'Filtrar por esta categoria' : ''}"><span><i style="background:${corDe(k)}"></i>${esc(k)}</span><span class="num">${brl(v)} <span class="fraco">${mix.tot > 0 ? Math.round(v / mix.tot * 100) : 0}%</span></span></div>`).join('') || '<p class="fraco" style="font-size:13px">Sem saídas no resumo.</p>'}
      </div>
    </aside>
  </div>`;
}

// ─── ABA CARTÃO ──────────────────────────────────────────────────────────
function abaCartao() {
  const docs = docsDe('fatura');
  if (!docs.length) return `<div class="card vazio"><h2>Nenhuma fatura de cartão</h2><p class="suave">Envie a fatura para ver compras, parcelas, juros e o que já está comprometido.</p><button class="btn primario" data-acao="novo-doc" data-tipo="fatura"><i class="ti ti-upload"></i> Enviar fatura</button></div>`;
  const todos = lancs().filter(l => l.origem === 'fatura');
  const e = E.cli.apuracao.resumo.endividamentoCartao;
  const r = E.cli.apuracao.resumo;
  let html = `<div class="kpis">
    <div class="kpi escuro"><small>Gastos no cartão (líquido)</small><b class="num">${brl(r.totalGastosCartao)}</b></div>
    <div class="kpi"><small>Próxima fatura (parcelas já compradas)</small><b class="num">${brl(r.comprometidoProximaFatura)}</b></div>
    <div class="kpi"><small>Parcelas futuras (todas)</small><b class="num">${brl(r.compromissoFuturoParcelas)}</b></div>
    <div class="kpi"><small>Juros, mora e multa</small><b class="num" style="color:${e.encargos ? 'var(--vermelho)' : 'inherit'}">${brl(e.encargos)}</b></div>
  </div>
  ${e.emRotativo && (e.saldoFinanciado > 0 || e.encargos > 0) ? `<div class="alerta"><i class="ti ti-alert-triangle"></i><span><b>Cliente no rotativo:</b> ${brl(e.saldoFinanciado)} da fatura anterior foram financiados, gerando ${brl(e.encargos)} de juros, mora e multa.${e.parcelasDeFinanciamento ? ` Há também ${brl(e.parcelasDeFinanciamento)} de parcelamento de fatura.` : ''}</span></div>` : ''}
  ${(() => { const d = dadosCartao(todos); return `<div class="g-grade">${graficoComposicao(d)}${graficoProjecao(d, r.parcelamentos)}</div>${graficoCategorias(d)}`; })()}
  ${secaoParcelas(r.parcelamentos)}
  ${(() => { const cl = todos.filter(classificavel), f = cl.filter(l => l.classe).length, np = cl.filter(l => l.parcelaCartao && !l.classe).length;
    return progressoCls(f, cl.length, cl.length - f, np ? ` <span class="fraco">· ${np} parcela(s) esperando fixo ou variável</span>` : ''); })()}
  ${barraLote()}`;
  for (const d of docs) {
    const itens = todos.filter(l => l.documentoId === d.id);
    const c = d.conferencia;
    const visiveis = itens.filter(l => { const b = (E.busca[d.id] || '').toLowerCase(); return (!E.catCartao || l.categoria === E.catCartao) && (!E.soPendentes || (classificavel(l) && !l.classe)) && (!b || (l.descricao + ' ' + l.categoria + ' ' + (l.subcategoria || '')).toLowerCase().includes(b)); });
    const todosSel = visiveis.length && visiveis.every(l => E.sel.has(l.id));
    html += `<section class="mes">
      <div class="fatura-cab" style="background:var(--amarelo-fundo)">
        <div style="display:flex;gap:12px;align-items:center"><span class="ic cartao" style="background:var(--branco)"><i class="ti ti-credit-card"></i></span>
          <div><b style="font-family:var(--serif);font-size:24px;font-weight:500">${esc(d.produto || 'Cartão ' + (d.banco || ''))}</b>
          <div class="suave" style="font-size:12px">${d.vencimento ? 'Vencimento ' + new Date(d.vencimento + 'T12:00:00').toLocaleDateString('pt-BR') : ''}${(d.cartoes || []).length ? ' · ' + d.cartoes.map(x => esc(x.portador || '') + (x.final ? ' (final ' + esc(x.final) + ')' : '') + (x.adicional ? ' adicional' : '')).join(', ') : ''}</div></div></div>
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px">
          <span class="suave">Total da fatura <b class="num" style="font-family:var(--serif);font-size:24px;font-weight:500;color:var(--texto);margin-left:4px">${brl(d.valor_total)}</b></span>
          ${c?.bateu === true ? '<span class="pill verde" title="Os totais impressos pelo banco conferem com os lançamentos lidos"><i class="ti ti-circle-check"></i> Conferida com o banco</span>' : c?.bateu === false ? '<span class="pill vermelho"><i class="ti ti-alert-circle"></i> Divergência na conferência</span>' : ''}
          ${c?.verificacoes?.length ? `<button class="btn" data-acao="ver-conf" data-id="${d.id}" style="padding:5px 10px;font-size:12px">Ver conferência</button>` : ''}
        </div>
      </div>
      <div id="conf-${d.id}" class="oculto">${c?.verificacoes?.length ? `<table class="conf"><tr><th>Conferência</th><th style="text-align:right">Impresso na fatura</th><th style="text-align:right">Calculado</th><th></th></tr>${c.verificacoes.map(v => `<tr><td>${esc(v.nome)}</td><td class="n num">${brl(v.declarado)}</td><td class="n num">${brl(v.calculado)}</td><td style="color:${v.bateu ? 'var(--verde)' : 'var(--vermelho)'};font-weight:700">${v.bateu ? '✓' : 'Diferença ' + brl(v.diferenca)}</td></tr>`).join('')}</table>` : ''}</div>
      <div class="mes-cab"><span style="display:flex;align-items:center;gap:10px"><input type="checkbox" data-acao="sel-lista" data-ids="${visiveis.map(l => l.id).join(',')}" ${todosSel ? 'checked' : ''} aria-label="Selecionar todos da fatura"><b>Lançamentos da fatura</b><span class="qtd">${itens.length}</span></span>
        <input type="search" data-acao="busca-mes" data-mes="${d.id}" aria-label="Buscar lançamentos na fatura" placeholder="Buscar na fatura…" value="${esc(E.busca[d.id] || '')}"></div>
      ${visiveis.length ? cabLinhas() + visiveis.map(linha).join('') : '<div class="fraco" style="padding:14px">Nenhum lançamento encontrado.</div>'}
    </section>`;
  }
  return html;
}

// ─── Calendário de parcelas (quando começa, quando termina, onde aperta) ─
// ─── Gráficos da aba Cartão (A: categorias · B: composição · C: projeção · D: linha das parcelas) ──
const ENCARGO_RE = /Encargos|IOF|Anuidade|Tarifa/i;
const sinalCartao = l => l.direcao === 'saida' ? l.valor : -l.valor;
const brlK = v => (Math.round(v / 100) / 10).toLocaleString('pt-BR') + ' mil';

/** Números da fatura mais recente (todas as faturas que vencem no mesmo mês) + média do à vista. */
function dadosCartao(todos) {
  const inc = todos.filter(l => l.situacao === 'incluido');
  const meses = [...new Set(inc.map(l => l.mesReferencia).filter(Boolean))].sort();
  const partes = m => {
    const ls = inc.filter(l => l.mesReferencia === m);
    const total = ls.reduce((a, l) => a + sinalCartao(l), 0);
    const parcelas = ls.filter(l => l.parcelaCartao).reduce((a, l) => a + l.valor, 0);
    const encargos = ls.filter(l => ENCARGO_RE.test(l.categoria)).reduce((a, l) => a + sinalCartao(l), 0);
    return { mes: m, ls, total, parcelas, encargos, vista: total - parcelas - encargos };
  };
  const todasPartes = meses.map(partes);
  const atual = todasPartes[todasPartes.length - 1];
  if (!atual) return null;
  const porCat = {}, porLoja = {};
  for (const l of atual.ls) {
    porCat[l.categoria] = (porCat[l.categoria] || 0) + sinalCartao(l);
    const n = l.descricao.replace(/\s+—\s+[^—]+$/, '');
    porLoja[n] = (porLoja[n] || 0) + sinalCartao(l);
  }
  const mediaVista = todasPartes.reduce((a, p) => a + Math.max(0, p.vista), 0) / todasPartes.length;
  return { ...atual, mediaVista, nFaturas: todasPartes.length,
    porCat: Object.entries(porCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]),
    porLoja: Object.entries(porLoja).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]) };
}

function graficoComposicao(d) {
  if (!d || d.total <= 0) return '';
  const partes = [['Parcelas de compras antigas', d.parcelas, 'var(--primaria)'], ['Compras à vista do mês', Math.max(0, d.vista), 'var(--g-claro)'], ['Juros, IOF, anuidade e tarifas', Math.max(0, d.encargos), 'var(--vermelho)']].filter(p => p[1] > 0.004);
  const tot = partes.reduce((a, p) => a + p[1], 0) || 1;
  const maior = partes.slice().sort((a, b) => b[1] - a[1])[0];
  const topo = d.porLoja.slice(0, 5), maxL = topo[0]?.[1] || 1;
  return `<div class="card g-card"><b class="g-tit">Do que é feita a fatura</b>
    <p class="g-lead"><b>${Math.round(maior[1] / tot * 100)}%</b> da fatura de ${nomeMesCurto(d.mes)} (${brl(d.total)}) ${maior[0] === 'Parcelas de compras antigas' ? 'são parcelas de compras de meses anteriores' : maior[0] === 'Compras à vista do mês' ? 'são compras à vista do mês' : 'são juros e tarifas'}.</p>
    <div class="g-stack">${partes.map(([k, v, c]) => `<span style="width:${v / tot * 100}%;background:${c}" title="${esc(k)}: ${brl(v)} (${Math.round(v / tot * 100)}%)"></span>`).join('')}</div>
    <div class="g-leg">${partes.map(([k, v, c]) => `<div><i style="background:${c}"></i><span>${k}</span><b class="num">${brl(v)}</b><em>${Math.round(v / tot * 100)}%</em></div>`).join('')}</div>
    <div class="g-sub">Onde mais gastou</div>
    ${topo.map(([k, v]) => `<div class="g-bar mini" title="${esc(k)}: ${brl(v)}"><span class="rot">${esc(k)}</span><span class="trilho"><span style="width:${v / maxL * 100}%"></span></span><span class="num">${brl(v)}</span></div>`).join('')}
  </div>`;
}

function graficoProjecao(d, p) {
  if (!d || !p?.porMes?.length) return '';
  const meses = p.porMes.slice(0, 8);
  const vista = d.mediaVista;
  const col = meses.map((m, i) => { const real = i === 0 && m.mes === d.mes; const extra = real ? Math.max(0, d.total - m.valor) : vista; return { ...m, real, extra, total: m.valor + extra }; });
  const maxV = Math.max(...col.map(c => c.total), 1);
  const passo = maxV > 16000 ? 5000 : maxV > 8000 ? 2000 : maxV > 4000 ? 1000 : 500;
  const topoY = Math.ceil(maxV * 1.12 / passo) * passo;
  const W = 640, H = 250, pl = 46, pb = 30, pt = 18, area = W - pl - 8, bw = Math.min(54, area / col.length * 0.62);
  const y = v => pt + (H - pt - pb) * (1 - v / topoY), x = i => pl + area / col.length * (i + 0.5) - bw / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="g-svg" role="img" aria-label="Projeção das próximas faturas"><defs><pattern id="g-hach" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--g-fundo)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--g-claro)" stroke-width="3"/></pattern></defs>`;
  for (let v = 0; v <= topoY; v += passo) s += `<line x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" class="g-grid"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" class="g-eixo">${v ? (v / 1000).toLocaleString('pt-BR') + ' mil' : '0'}</text>`;
  col.forEach((c, i) => {
    const xi = x(i);
    s += `<g data-acao="cal-mes" data-mes="${c.mes}" style="cursor:pointer"><title>${nomeMes(c.mes)}: ${brl(c.valor)} em parcelas já compradas${c.real ? ` + ${brl(c.extra)} do resto da fatura (real)` : ` + ${brl(c.extra)} de à vista estimado`}</title>
      <rect x="${xi - 6}" y="${pt}" width="${bw + 12}" height="${H - pt - pb}" fill="transparent"/>
      <rect x="${xi}" y="${y(c.valor)}" width="${bw}" height="${Math.max(0, y(0) - y(c.valor))}" rx="2" fill="var(--primaria)"/>
      ${c.extra > 0 ? `<rect x="${xi}" y="${y(c.total)}" width="${bw}" height="${Math.max(0, y(c.valor) - y(c.total) - 2)}" rx="2" fill="${c.real ? 'var(--g-claro)' : 'url(#g-hach)'}"/>` : ''}
      <text x="${xi + bw / 2}" y="${y(c.total) - 6}" text-anchor="middle" class="g-val">${brlK(c.total)}</text>
      <text x="${xi + bw / 2}" y="${H - 10}" text-anchor="middle" class="g-eixo${c.real ? ' forte' : ''}">${nomeMesCurto(c.mes)}${c.real ? ' (atual)' : ''}</text></g>`;
  });
  s += '</svg>';
  const prox = col[1];
  return `<div class="card g-card"><b class="g-tit">Projeção das próximas faturas</b>
    <p class="g-lead">${prox ? `Só com o que já foi comprado, a fatura de ${nomeMesCurto(prox.mes)} começa em <b>${brl(prox.valor)}</b>; com o à vista de costume, deve chegar a <b>${brl(prox.total)}</b>.` : 'Sem parcelas para os próximos meses.'}</p>
    <div class="g-leg h"><div><i style="background:var(--primaria)"></i><span>Parcelas já compradas (certo)</span></div><div><i class="hach"></i><span>À vista pela média${d.nFaturas > 1 ? ` de ${d.nFaturas} faturas` : ' da fatura atual'} (estimado: ${brl(vista)}/mês)</span></div></div>
    ${s}
    <div class="fraco" style="font-size:12px">Clique numa coluna para ver as parcelas daquele mês.</div>
  </div>`;
}

function graficoCategorias(d) {
  if (!d || !d.porCat.length) return '';
  const tot = d.porCat.reduce((a, c) => a + c[1], 0) || 1;
  let lista = d.porCat.slice(0, 8);
  if (d.porCat.length > 8) lista = [...d.porCat.slice(0, 7), [`Outras ${d.porCat.length - 7} categorias`, d.porCat.slice(7).reduce((a, c) => a + c[1], 0), true]];
  const max = Math.max(...lista.map(c => c[1]));
  return `<div class="card g-card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><b class="g-tit">Com o que gasta no cartão</b>
      ${E.catCartao ? `<button class="fc on" data-acao="cat-cartao" data-cat="">Filtrando: ${esc(E.catCartao)} <i class="ti ti-x"></i> limpar</button>` : '<span class="fraco" style="font-size:12px">Clique numa categoria para ver só os lançamentos dela</span>'}</div>
    <p class="g-lead">${esc(lista[0][0])} leva <b>${Math.round(lista[0][1] / tot * 100)}%</b> da fatura de ${nomeMesCurto(d.mes)} (${brl(lista[0][1])}).</p>
    ${lista.map(([k, v, outras]) => `<button class="g-bar ${E.catCartao === k ? 'on' : ''}" ${outras ? 'disabled' : `data-acao="cat-cartao" data-cat="${esc(k)}"`} title="${esc(k)}: ${brl(v)} (${Math.round(v / tot * 100)}%)"><span class="rot">${esc(k)}</span><span class="trilho"><span style="width:${v / max * 100}%"></span></span><span class="num">${brl(v)}</span><span class="pct">${Math.round(v / tot * 100)}%</span></button>`).join('')}
  </div>`;
}

/** D: linha do valor de parcelas em cada fatura; cada ponto abre o detalhe do mês. */
function graficoLinhaParcelas(p) {
  const pm = p.porMes;
  if (pm.length < 2) return '';
  const W = 1200, H = 220, pl = 30, pr = 30, pt = 34, pb = 30;
  const maxV = Math.max(...pm.map(m => m.valor)) * 1.1 || 1;
  const x = i => pl + (W - pl - pr) * (i / (pm.length - 1)), y = v => pt + (H - pt - pb) * (1 - v / maxV);
  const pts = pm.map((m, i) => `${x(i)},${y(m.valor)}`).join(' L');
  let s = `<svg viewBox="0 0 ${W} ${H}" class="g-svg g-linha" role="img" aria-label="Valor das parcelas por fatura">
    <path d="M${pts} L${x(pm.length - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--g-fundo)"/>
    <line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" class="g-grid"/>
    <path d="M${pts}" fill="none" stroke="var(--primaria)" stroke-width="2"/>`;
  pm.forEach((m, i) => {
    const pico = m.mes === p.mesMaisApertado, on = m.mes === E.calMes;
    s += `<g data-acao="cal-mes" data-mes="${m.mes}" style="cursor:pointer"><title>${nomeMes(m.mes)}: ${brl(m.valor)} em ${m.quantidade} parcela(s)${m.terminam.length ? ` · ${m.terminam.length} termina(m)` : ''}</title>
      <rect x="${x(i) - 22}" y="${pt - 18}" width="44" height="${H - pt}" fill="transparent"/>
      <circle cx="${x(i)}" cy="${y(m.valor)}" r="${on || pico ? 6 : 4.5}" fill="${on ? 'var(--texto)' : pico ? 'var(--amarelo)' : 'var(--primaria)'}" stroke="var(--branco)" stroke-width="2"/>
      ${m.terminam.length && i > 0 && i < pm.length - 1 ? `<text x="${x(i)}" y="${y(m.valor) - 11}" text-anchor="middle" class="g-eixo">−${m.terminam.length}</text>` : ''}
      <text x="${x(i)}" y="${H - 9}" text-anchor="middle" class="g-eixo${i === 0 ? ' forte' : ''}">${i === 0 ? 'atual' : nomeMesCurto(m.mes)}</text></g>`;
  });
  s += `<text x="${x(0)}" y="${y(pm[0].valor) - 22}" text-anchor="start" class="g-val">${brl(pm[0].valor)}</text>
    <text x="${x(pm.length - 1) - 4}" y="${y(pm[pm.length - 1].valor) - 10}" text-anchor="end" class="g-val">${brl(pm[pm.length - 1].valor)}</text></svg>`;
  return s;
}

  // primeiro mês em que o compromisso cai pela metade em relação ao próximo mês

  const sel = p.porMes.find(m => m.mes === E.calMes);
  const itensSel = sel ? p.itens.filter(i => i.inicio <= sel.mes && sel.mes <= i.fim) : [];

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${prox ? `<span class="pill" style="background:var(--marca);color:var(--texto);padding:5px 11px">Mais apertado: ${nomeMesCurto(p.mesMaisApertado)} · ${brl(p.porMes.find(m => m.mes === p.mesMaisApertado).valor)}</span>` : ''}
        ${alivio ? `<span class="pill verde" style="padding:5px 11px">Alívio a partir de ${nomeMesCurto(alivio.mes)} (cai para ${brl(alivio.valor)})</span>` : ''}
        ${p.livreDeParcelasEm ? `<span class="pill cinza" style="padding:5px 11px">Sem parcelas a partir de ${nomeMesCurto(p.livreDeParcelasEm)}</span>` : ''}
      </div>
    </div>
    ${p.porMes.length > 1 ? graficoLinhaParcelas(p) : `<div class="cal" role="list">${p.porMes.map((m, i) => `<button class="col ${i === 0 ? 'atual' : ''} ${m.mes === p.mesMaisApertado ? 'pico' : ''} ${m.mes === E.calMes ? 'on' : ''}" data-acao="cal-mes" data-mes="${m.mes}" role="listitem" title="${i === 0 ? 'Fatura atual (já lançada)' : 'Clique para ver o que cai neste mês'}">
      <span class="fim">${m.terminam.length && i > 0 ? '−' + m.terminam.length + ' acaba' + (m.terminam.length > 1 ? 'm' : '') : ''}</span>
      <span class="val">${brl(m.valor).replace('R$', '').trim()}</span>
      <span class="bar" style="height:${Math.max(2, Math.round(m.valor / max * 130))}px"></span>
      <span class="mes-l">${i === 0 ? 'atual' : nomeMesCurto(m.mes)}</span></button>`).join('')}</div>`}
    <div class="fraco" style="font-size:12px;margin-top:8px">Linha: quanto de parcelas cai em cada fatura · ponto amarelo: mês mais apertado · "−n": parcelas que terminam naquele mês · clique num ponto para ver as parcelas. Considera só compras já feitas; compras novas aumentam esses valores.${renda ? '' : ' Preencha a renda no perfil para ver o peso de cada mês na renda.'}</div>
    ${sel ? `<div style="margin-top:12px;border:1px solid var(--azul-borda);background:var(--azul-fundo);border-radius:10px;padding:12px">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px"><b>${nomeMes(sel.mes)}: ${brl(sel.valor)} em ${sel.quantidade} parcela(s)${pct(sel.valor)}</b><button class="btn" data-acao="cal-mes" data-mes="" style="padding:3px 9px;font-size:12px">Fechar</button></div>
      ${itensSel.sort((a, b) => b.valorParcela - a.valorParcela).map(i => `<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-top:1px solid var(--azul-borda)"><span>${esc(i.descricao)}${i.portador ? ` <span class="fraco">· ${esc(i.portador)}</span>` : ''} <span class="fraco">· parcela ${i.parcelaAtual + monthsBetween(p.mesFaturaAtual, sel.mes)}/${i.parcelaTotal}</span>${i.fim === sel.mes ? ' <span class="pill verde">última</span>' : ''}</span><b class="num">${brl(i.valorParcela)}</b></div>`).join('')}
    </div>` : ''}
    <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">Compras parceladas (${p.itens.length}) · ainda a pagar ${brl(p.totalRestante)}</summary>
      <div style="overflow-x:auto;margin-top:8px"><table class="tabela-parc"><thead><tr>
        <th>Compra</th><th>Parcela</th><th class="n" data-acao="ordem-parc" data-ordem="valor">Valor da parcela${seta('valor')}</th>
        <th data-acao="ordem-parc" data-ordem="inicio">Começou${seta('inicio')}</th><th data-acao="ordem-parc" data-ordem="fim">Termina${seta('fim')}</th>
        <th class="n" data-acao="ordem-parc" data-ordem="restante">Ainda a pagar${seta('restante')}</th></tr></thead><tbody>
        ${itens.map(i => `<tr><td><b>${esc(i.descricao)}</b>${i.financiamento ? ' <span class="pill vermelho">financiamento de fatura</span>' : ''}<div class="fraco" style="font-size:12px">${esc(i.portador || '')} · ${esc(i.categoria)}</div></td>
          <td class="num">${i.parcelaAtual}/${i.parcelaTotal}<span class="trilho-parc"><span style="width:${Math.round(i.parcelaAtual / i.parcelaTotal * 100)}%"></span></span></td>
          <td class="n num">${brl(i.valorParcela)}</td><td>${nomeMesCurto(i.inicio)}</td>
          <td>${i.restantes ? nomeMesCurto(i.fim) + ` <span class="fraco">(faltam ${i.restantes})</span>` : '<span class="pill verde">termina nesta fatura</span>'}</td>
          <td class="n num">${i.restantes ? brl(i.valorRestante) : '—'}</td></tr>`).join('')}
      </tbody></table></div>
    </details>
  </div>`;
}
const monthsBetween = (a, b) => { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };

// ─── ABA TUDO JUNTO ──────────────────────────────────────────────────────
// ─── Evolução mês a mês (mesma conta do servidor: modules/painel.ts) ─────
function evolucaoMensal(ls) {
  const meses = new Map();
  for (const l of ls) {
    if (!/^\d{4}-\d{2}$/.test(l.mesReferencia || '')) continue;
    if (!meses.has(l.mesReferencia)) meses.set(l.mesReferencia, { mes: l.mesReferencia, entradas: 0, saidasConta: 0, gastosCartao: 0, parcelas: 0, encargos: 0, temExtrato: false, temFatura: false });
    const m = meses.get(l.mesReferencia);
    if (l.origem === 'extrato') m.temExtrato = true; else m.temFatura = true;
    if (l.situacao !== 'incluido') continue;
    const sinal = l.direcao === 'saida' ? 1 : -1;
    if (l.origem === 'extrato') { if (l.direcao === 'entrada') m.entradas += l.valor; else m.saidasConta += l.valor; }
    else { m.gastosCartao += sinal * l.valor; if (l.parcelaCartao) m.parcelas += l.valor; if (/Encargos|IOF/i.test(l.categoria)) m.encargos += sinal * l.valor; }
  }
  return [...meses.values()].sort((a, b) => a.mes.localeCompare(b.mes)).map(m => ({ ...m, sobra: m.temExtrato ? m.entradas - m.saidasConta : null }));
}

function cardEvolucao(ls) {
  const ev = evolucaoMensal(ls);
  if (!ev.length) return '';
  // seta comparando com o mês anterior; verde = melhorou (gasto caiu / entrada ou sobra subiu)
  const delta = (atual, ant, maisEhBom) => {
    if (ant == null || atual == null || !ant) return '';
    const d = (atual - ant) / Math.abs(ant) * 100;
    if (Math.abs(d) < 1) return '<span class="ev-d fraco">=</span>';
    const bom = maisEhBom ? d > 0 : d < 0;
    return `<span class="ev-d" style="color:${bom ? 'var(--verde)' : 'var(--vermelho)'}">${d > 0 ? '▲' : '▼'} ${Math.abs(Math.round(d))}%</span>`;
  };
  const cel = (m, i, campo, maisEhBom, so) => {
    if (so === 'extrato' && !m.temExtrato || so === 'fatura' && !m.temFatura) return '<td class="num fraco">—</td>';
    const ant = i > 0 && (so === 'extrato' ? ev[i - 1].temExtrato : ev[i - 1].temFatura) ? ev[i - 1][campo] : null;
    return `<td class="num">${brl(m[campo])}${delta(m[campo], ant, maisEhBom)}</td>`;
  };
  const maxGasto = Math.max(1, ...ev.map(m => m.saidasConta + m.gastosCartao));
  return `<div class="card" style="padding:16px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <b style="font-family:var(--serif);font-size:26px;font-weight:500">Evolução mês a mês</b>
      <span class="fraco" style="font-size:12px">Cartão no mês do vencimento · setas comparam com o mês anterior</span></div>
    <div style="overflow-x:auto"><table class="tabela-ev"><thead><tr><th>Mês</th><th class="num">Entradas</th><th class="num">Saídas da conta</th><th class="num">Gastos no cartão</th><th class="num">Parcelas</th><th class="num">Juros e encargos</th><th class="num">Sobra da conta</th><th style="min-width:110px">Gasto total</th></tr></thead><tbody>
    ${ev.map((m, i) => `<tr><td><b>${nomeMesCurto(m.mes)}</b></td>
      ${cel(m, i, 'entradas', true, 'extrato')}${cel(m, i, 'saidasConta', false, 'extrato')}${cel(m, i, 'gastosCartao', false, 'fatura')}${cel(m, i, 'parcelas', false, 'fatura')}${cel(m, i, 'encargos', false, 'fatura')}
      <td class="num" style="font-weight:600;color:${m.sobra == null ? 'inherit' : m.sobra >= 0 ? 'var(--verde)' : 'var(--vermelho)'}">${m.sobra == null ? '<span class="fraco">—</span>' : brl(m.sobra)}${delta(m.sobra, i > 0 ? ev[i - 1].sobra : null, true)}</td>
      <td><span class="ev-barra" title="${brl(m.saidasConta + m.gastosCartao)}"><span style="width:${Math.round((m.saidasConta + m.gastosCartao) / maxGasto * 100)}%"></span></span></td></tr>`).join('')}

// Salvar ajustes
// ════════════════════════════════════════════════════════════════════════
/** Estado desejado de cada lançamento → envia só o que difere do padrão (vazio = volta ao da IA). */
async function aplicarAjustes(mudancas) {
  const porId = new Map(lancs().map(l => [l.id, l]));
  const corpo = mudancas.map(m => {
    const l = porId.get(m.id);
    const alvo = { categoria: l.categoria, subcategoria: l.subcategoria || '', observacao: l.observacao || '', situacao: l.situacao, classe: l.classe || null, ...m };
    const padraoSit = l.padraoIncluido ? 'incluido' : 'excluido';
    return {
      id: m.id,
      categoria: alvo.categoria !== l.categoriaIA ? alvo.categoria : null,
      subcategoria: (alvo.subcategoria || '') !== (l.subcategoriaIA || '') || alvo.categoria !== l.categoriaIA ? (alvo.subcategoria || null) : null,
      observacao: alvo.observacao || null,
      situacao: alvo.situacao !== padraoSit ? alvo.situacao : null,
      classe: alvo.classe || null
    };
  });
  // Atualização otimista: a tela muda na hora; o servidor confirma e recalcula
  for (const m of mudancas) { const l = porId.get(m.id); Object.assign(l, m); l.incluidoNoResumo = l.situacao === 'incluido'; }
  E.salvando++; desenharConteudo();
  try {
    const r = await api('PUT', `/api/app/analises/${E.cli.analise.id}/ajustes`, { ajustes: corpo });
    E.cli.apuracao = r.apuracao; if (r.plano) E.cli.plano = r.plano; E.salvoEm = r.salvoEm;
  } catch (e) {
    toast('Não foi possível salvar: ' + e.message, true);
    try { E.cli = await api('GET', '/api/app/clientes/' + E.cli.cliente.id); } catch {}
  } finally { E.salvando--; desenharConteudo(); }
}

const TITULOS_CORTE = {
  'Delivery': 'Pedir menos delivery', 'Assinaturas': 'Revisar as assinaturas', 'Alimentação': 'Comer fora com menos frequência',
  'Lazer': 'Teto para o lazer', 'Vestuário': 'Teto para roupas e calçados', 'Compras': 'Teto para compras',
  'Cuidados pessoais': 'Teto para cuidados pessoais', 'Viagem': 'Planejar as viagens', 'Transporte': 'Usar menos aplicativo de transporte'
};
const tituloDoCorte = c => TITULOS_CORTE[c] || `Reduzir gastos com ${c.toLowerCase()}`;
const FORA_DO_PLANO = new Set(['Pagamento de fatura', 'Investimento', 'Encargos e juros', 'IOF']);
const MESES_C = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const brl0 = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0, minimumFractionDigits: 0 });
const curtoMil = v => { const a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : a >= 1e3 ? Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil' : Math.round(v).toLocaleString('pt-BR'); };
/** Mês n do plano (1 = mês que vem) como "dez/2026". */
const mesDoPlano = n => { const d = new Date(); const t = d.getFullYear() * 12 + d.getMonth() + n; return MESES_C[t % 12] + '/' + Math.floor(t / 12); };
const mesIso = k => /^\d{4}-\d{2}/.test(k || '') ? MESES_C[Number(k.slice(5, 7)) - 1] + '/' + k.slice(0, 4) : '';
const copia = o => JSON.parse(JSON.stringify(o));

function simularPlano(base, cfg, meses = 240) {
  const i = Math.pow(1 + (Number(cfg.taxaAno) || 0) / 100, 1 / 12) - 1;
  const rot = cfg.sairRotativo && base.emRotativo;
  const media = new Map(base.mediaPorCategoria.map(c => [c.categoria, c.valor]));
  const cortes = cfg.cortes.map(c => ({ categoria: c.categoria, valor: arred((media.get(c.categoria) || 0) * (Number(c.percentual) || 0) / 100) }));
  const ganhoRot = rot ? base.jurosMensal : 0;
  const economia = ganhoRot + cortes.reduce((a, c) => a + c.valor, 0);
  const custoVida = cfg.custoVidaMensal ?? base.custoVidaEstimado;
  const meta = arred(custoVida * (Number(cfg.mesesReserva) || 0));
  let divida = rot ? base.saldoRotativo : 0, com = Number(cfg.reservaAtual) || 0, reserva = com, juros = 0;
  let mesQuita = rot ? (divida > 0 ? null : 1) : null, mesReserva = com >= meta && meta > 0 ? 0 : null;
  const pontos = [{ mes: 0, comMudancas: com, continuandoAssim: reserva, jurosPagos: 0 }];
  for (let m = 1; m <= meses; m++) {
    let livre = economia;
    if (divida > 0) { const pago = Math.min(divida, livre); divida -= pago; livre -= pago; if (divida <= 0.005 && mesQuita === null) mesQuita = m; }
    com = com * (1 + i) + livre;
    juros += base.jurosMensal;
    reserva = reserva * (1 + i);
    if (mesReserva === null && meta > 0 && com >= meta) mesReserva = m;
    pontos.push({ mes: m, comMudancas: com, continuandoAssim: reserva - juros, jurosPagos: juros });
  }
  return { economiaMensal: economia, ganhos: { rotativo: ganhoRot, cortes }, metaReserva: meta, custoVida, mesQuitaRotativo: mesQuita, mesReservaCompleta: mesReserva, pontos };
}

/** Atitudes na ordem do plano: rotativo primeiro (é o que mais custa), depois os cortes. */
function atitudesDo(base, cfg, sim) {
  const lista = [];
  if (cfg.sairRotativo && base.emRotativo) lista.push({ titulo: cfg.tituloRotativo || 'Sair do rotativo', texto: cfg.textoRotativo, valor: sim.ganhos.rotativo, sufixo: 'por mês, sem juros' });
  cfg.cortes.forEach((c, k) => lista.push({ titulo: c.titulo || tituloDoCorte(c.categoria), texto: c.texto || `Gastar ${c.percentual}% a menos com ${c.categoria.toLowerCase()} por mês.`, valor: sim.ganhos.cortes[k]?.valor || 0, sufixo: 'por mês' }));
  return lista;
}

function ladoPlano() {
  const b = E.cli.plano.base, cfg = E.planoEdit, s = simularPlano(b, cfg, 120);
  return `<div class="card">
      <p class="grande">${s.economiaMensal > 0 ? `Com <b>${brl0(s.economiaMensal)} por mês</b>, em 10 anos: <b>${brl0(s.pontos[120].comMudancas)}</b>.` : 'Inclua pelo menos uma atitude para simular.'}</p>
      <dl>
        ${b.emRotativo ? `<dt>Juros em 10 anos, continuando assim</dt><dd class="num" style="color:var(--vermelho)">${brl0(s.pontos[120].jurosPagos)}</dd>` : ''}
        ${cfg.sairRotativo && b.emRotativo ? `<dt>Fora do rotativo</dt><dd>${s.mesQuitaRotativo ? mesDoPlano(s.mesQuitaRotativo) : '—'}</dd>` : ''}
        ${b.livreDeParcelasEm ? `<dt>Sem parcelas no cartão</dt><dd>${mesIso(b.livreDeParcelasEm)}</dd>` : ''}
        <dt>Reserva de ${cfg.mesesReserva} meses</dt><dd>${s.mesReservaCompleta === 0 ? 'já tem' : s.mesReservaCompleta ? mesDoPlano(s.mesReservaCompleta) : 'acima de 10 anos'}</dd>
      </dl>
    </div>

    <p class="fraco" style="font-size:12px;margin:0">A tela do cliente usa o que está nesta aba, salvo ou não. Salve para manter na próxima vez.</p>`;
}

function ligarPlano() {
  const el = $('#conteudo'); if (!el || E.aba !== 'plano') return;
  el.oninput = ev => {
    const t = ev.target, cfg = E.planoEdit;
    if (t.dataset.plano) {
      const k = t.dataset.plano;
      if (t.type === 'checkbox') { cfg[k] = t.checked; desenharConteudo(); return; }
      cfg[k] = t.type === 'number' ? (t.value === '' ? (k === 'custoVidaMensal' ? null : 0) : Number(t.value)) : t.value;
    } else if (t.dataset.corte !== undefined) {
      const c = cfg.cortes[Number(t.dataset.corte)], campo = t.dataset.campo;
      if (campo === 'categoria') {
        if (!c.titulo || c.titulo === tituloDoCorte(c.categoria)) c.titulo = tituloDoCorte(t.value);
        c.categoria = t.value; desenharConteudo(); return;
      }
      c[campo] = campo === 'percentual' ? Math.max(0, Math.min(100, Number(t.value) || 0)) : t.value;
      const g = el.querySelector(`[data-ganho="${t.dataset.corte}"] b`);
      if (g) g.textContent = brl(arred((E.cli.plano.base.mediaPorCategoria.find(x => x.categoria === c.categoria)?.valor || 0) * c.percentual / 100));
    }
    $('#planoStatus').textContent = 'Alterações não salvas.';
    $('#planoLado').innerHTML = ladoPlano();
  };
}

async function salvarPlano(plano) {
  const st = $('#planoStatus'); if (st) st.textContent = 'Salvando…';
  try {
    const { _de, ...limpo } = plano || {};
    const r = await api('PATCH', '/api/app/analises/' + E.cli.analise.id, { plano: plano ? limpo : null });
    const atual = await api('GET', '/api/app/clientes/' + E.cli.cliente.id);
    E.cli = atual; E.planoEdit = null;
    desenharConteudo();
    toast(r.plano ? 'Plano salvo' : 'Voltou para o plano sugerido');
  } catch (e) { if (st) st.textContent = e.message; toast(e.message, true); }
}

      <div class="dir">
        <a class="btn" href="#/cliente/${cliente.id}/plano" style="text-decoration:none"><i class="ti ti-arrow-left"></i> <span class="so-tela-larga">Voltar para a análise</span></a>
        <button class="btn" type="button" data-acao="imprimir"><i class="ti ti-file-type-pdf"></i> <span class="so-tela-larga">Salvar em PDF</span></button>

        ${habitos.length > 1 ? `<div class="ap-habito total"><div class="nome">Por ano, nesses hábitos</div><div class="pmes num">${brl0(totMes)} por mês</div><div class="ano num">${brl0(totMes * 12)}</div></div>` : ''}

            ${cfg.cortes.map((c, k) => `<div class="ap-alavanca"><label for="apC${k}">${esc(c.titulo || tituloDoCorte(c.categoria))} <span id="apV${k}">${c.percentual}%</span></label><small>${esc(c.categoria)}: ${brl0(media(c.categoria))} por mês hoje</small><input type="range" id="apC${k}" data-ap="corte" data-k="${k}" min="0" max="100" step="5" value="${c.percentual}"></div>`).join('')}

      </section>` : ''}

    </div>

  atualizarSimulacao();

const SUBCATEGORIAS_DE = c => {
  const s = E.taxonomia?.subcategorias?.[c] || [];
  return s.length ? s.slice(0, 3).join(', ') : 'Média por mês na análise';
};

function atualizarSimulacao() {
  const b = E.cli.plano.base, cfg = E.ap.cfg, anos = E.ap.anos, n = anos * 12;
  const s = simularPlano(b, cfg), at = atitudesDo(b, cfg, s);
  const fim = s.pontos[n].comMudancas, juros = s.pontos[n].jurosPagos, semMudar = s.pontos[n].continuandoAssim;
  $('#apFrase').innerHTML = s.economiaMensal > 0
    ? `Com <b>${brl0(s.economiaMensal)} por mês</b> a mais, em ${anos} anos você teria cerca de <b>${brl0(fim)}</b>. ${b.jurosMensal ? `Continuando assim, seriam ${brl0(juros)} pagos só em juros.` : `Continuando assim, ${brl0(semMudar)}.`}`
    : 'Escolha pelo menos uma mudança para ver a simulação.';
  // datas de liberdade
  const marcos = [];
  if (b.emRotativo) marcos.push(['Fora do rotativo', cfg.sairRotativo ? (s.mesQuitaRotativo ? mesDoPlano(s.mesQuitaRotativo) : 'acima de 20 anos') : '—', cfg.sairRotativo ? `A economia dos primeiros meses quita os ${brl0(b.saldoRotativo)}.` : 'Marque "sair do rotativo" para ver a data.']);
  if (b.livreDeParcelasEm) marcos.push(['Sem parcelas no cartão', mesIso(b.livreDeParcelasEm), 'Se não fizer novas compras parceladas.']);
  marcos.push(['Reserva de emergência completa', s.mesReservaCompleta === 0 ? 'já tem' : s.mesReservaCompleta ? mesDoPlano(s.mesReservaCompleta) : 'acima de 20 anos', `${cfg.mesesReserva} meses do seu custo de vida (${brl0(s.metaReserva)}).`]);
  $('#apMarcos').innerHTML = marcos.map(([o, q, d]) => `<div class="ap-marco"><div class="quando">${q}</div><div class="oque">${o}</div><small>${d}</small></div>`).join('');
  const passos = $('#apPassos');
  if (passos) passos.innerHTML = at.map(a => `<li><div><h3>${esc(a.titulo)}</h3>${a.texto ? `<p>${esc(a.texto)}</p>` : ''}</div><div class="ganho num">+${brl0(a.valor)}<small>${a.sufixo}</small></div></li>`).join('');
  graficoSimulacao(s, n, anos);
}

function graficoSimulacao(s, n, anos) {
  const caixa = $('#apGraf'), svg = $('#apSvg'), dica = $('#apDica'); if (!svg) return;
  const W = Math.round(Math.max(320, Math.min(640, caixa.clientWidth || 640))), H = W < 500 ? 240 : 300, L = 60, R = W < 500 ? 64 : 92, T = 16, B = 34;
  const cs = getComputedStyle(document.documentElement), cor = k => cs.getPropertyValue(k).trim();
  const C = s.pontos.slice(0, n + 1).map(p => p.comMudancas), A = s.pontos.slice(0, n + 1).map(p => p.continuandoAssim);
  let max = Math.max(...C, ...A, 1), min = Math.min(...A, ...C, 0);
  const bruto = (max - min) / 4 || 1, pot = Math.pow(10, Math.floor(Math.log10(bruto)));
  const passo = [1, 2, 2.5, 5, 10].map(x => x * pot).find(x => x >= bruto);
  max = Math.ceil(max / passo) * passo; min = Math.floor(min / passo) * passo;
  const x = m => L + (m / n) * (W - L - R), y = v => T + (max - v) / (max - min || 1) * (H - T - B);
  let g = '';
  for (let v = min; v <= max + 1e-6; v += passo) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-6 ? cor('--apagado') : cor('--borda2')}" stroke-width="1"/>`;
    g += `<text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="${cor('--fraco')}">${Math.abs(v) < 1e-6 ? '0' : (v < 0 ? '−' : '') + curtoMil(Math.abs(v))}</text>`;
  }
  const pa = anos <= 5 ? 1 : anos <= 10 ? 2 : 5;
  for (let a = 0; a <= anos; a += pa) g += `<text x="${x(a * 12)}" y="${H - 10}" text-anchor="middle" font-size="12" fill="${cor('--fraco')}">${a === 0 ? 'hoje' : a + (a === 1 ? ' ano' : ' anos')}</text>`;
  const linha = arr => arr.map((v, m) => (m ? 'L' : 'M') + x(m).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  g += `<path d="${linha(A)}" fill="none" stroke="${cor('--s-atual')}" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round"/>`;
  g += `<path d="${linha(C)}" fill="none" stroke="${cor('--s-mudanca')}" stroke-width="2.5" stroke-linejoin="round"/>`;
  const rot = (v, k) => `<circle cx="${x(n)}" cy="${y(v)}" r="4.5" fill="${cor(k)}" stroke="${cor('--branco')}" stroke-width="2"/><text x="${x(n) + 10}" y="${y(v) + 5}" font-size="14" font-weight="700" fill="${cor('--texto')}">${(v < 0 ? '−' : '') + curtoMil(Math.abs(v))}</text>`;
  const yc = y(C[n]), ya = y(A[n]);
  g += rot(C[n], '--s-mudanca');
  if (Math.abs(yc - ya) > 16) g += rot(A[n], '--s-atual');
  g += `<line id="apMira" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${cor('--apagado')}" stroke-width="1" opacity="0"/><rect id="apArea" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  const area = svg.querySelector('#apArea'), mira = svg.querySelector('#apMira');
  area.onpointermove = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const m = Math.max(0, Math.min(n, Math.round((px - L) / (W - L - R) * n)));
    mira.setAttribute('x1', x(m)); mira.setAttribute('x2', x(m)); mira.setAttribute('opacity', 1);
    const a = Math.floor(m / 12), mm = m % 12;
    const quando = m === 0 ? 'Hoje' : [a ? a + (a > 1 ? ' anos' : ' ano') : '', mm ? mm + (mm > 1 ? ' meses' : ' mês') : ''].filter(Boolean).join(' e ');
    dica.innerHTML = `<b>${quando}</b><div class="lin"><i style="background:${cor('--s-mudanca')}"></i>Com as mudanças: ${brl0(C[m])}</div>`
      + `<div class="lin"><i style="background:${cor('--s-atual')}"></i>${s.pontos[m].jurosPagos ? 'Juros pagos: ' + brl0(s.pontos[m].jurosPagos) : 'Continuando assim: ' + brl0(A[m])}</div>`;
    dica.style.left = Math.min(x(m) / W * r.width + 12, r.width - dica.offsetWidth) + 'px'; dica.style.opacity = 1;
  };
  area.onpointerleave = () => { mira.setAttribute('opacity', 0); dica.style.opacity = 0; };
}

// Campos básicos vão nas colunas do cliente; o resto em "ficha" (modules/ficha.ts).
// ════════════════════════════════════════════════════════════════════════
const FC_PASSOS = ['Quem é', 'Renda e família', 'Dinheiro hoje', 'Objetivos'];
const FC_RENDA = [['clt', 'CLT'], ['autonomo', 'Autônomo'], ['empresario', 'Empresário'], ['aposentado', 'Aposentado'], ['outro', 'Outro']];
const FC_DEPEND = [[0, 'Nenhuma'], [1, '1'], [2, '2'], [3, '3 ou mais']];
const FC_DIVIDAS = [['emprestimo', 'Empréstimo pessoal'], ['veiculo', 'Financiamento de veículo'], ['imobiliario', 'Financiamento imobiliário'], ['consignado', 'Consignado'], ['cheque_especial', 'Cheque especial'], ['outro', 'Outra dívida']];
const FC_OBJ = [['reserva', 'Reserva de emergência', 'Para imprevistos'], ['dividas', 'Sair das dívidas', 'Rotativo, empréstimos'], ['viagem', 'Viagem', 'Férias, intercâmbio'],
  ['carro', 'Carro', 'Troca ou primeiro carro'], ['casa', 'Casa própria', 'Entrada ou quitação'], ['aposentadoria', 'Aposentadoria', 'Viver de renda']];
const fichaVazia = () => ({ nascimento: null, profissao: '', formaRenda: null, dependentes: null, outrasRendas: null, reservaAtual: null, semDividas: false, dividas: [], objetivos: [], lgpd: false, lgpdEm: null });
const paraNumero = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return Number.isFinite(n) && n >= 0 ? n : null; };
const fmtValor = n => n == null ? '' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const mascaraCpf = v => { const d = v.replace(/\D/g, '').slice(0, 11); return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); };
const mascaraFone = v => { const d = v.replace(/\D/g, '').slice(0, 11); return d.length <= 2 ? d.replace(/(\d+)/, '($1') : d.length <= 6 ? d.replace(/(\d{2})(\d+)/, '($1) $2') : d.length <= 10 ? d.replace(/(\d{2})(\d{4})(\d+)/, '($1) $2-$3') : d.replace(/(\d{2})(\d{5})(\d+)/, '($1) $2-$3'); };
const idadeDe = iso => { if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null; const h = new Date(), n = new Date(iso + 'T12:00:00'); let a = h.getFullYear() - n.getFullYear(); if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) a--; return a >= 0 && a < 130 ? a : null; };
const mesesAte = prazo => { if (!/^\d{4}-\d{2}$/.test(prazo || '')) return null; const h = new Date(); return (Number(prazo.slice(0, 4)) * 12 + Number(prazo.slice(5, 7)) - 1) - (h.getFullYear() * 12 + h.getMonth()); };

async function telaFicha(id) {
  let c = null;
  if (id) {
    if (!E.cli || E.cli.cliente.id !== id) {

      try { E.cli = await api('GET', '/api/app/clientes/' + id); } catch (e) { return telaErro(e.message); }
    }
    c = E.cli.cliente;
  }
  E.ficha = {
    id: c?.id || null, passo: 0, erro: '',
    dados: { nome: c?.nome || '', cpf: c?.cpf || '', telefone: c?.telefone || '', email: c?.email || '', renda_declarada: c?.renda_declarada ?? null, observacao: c?.observacao || '' },
    f: { ...fichaVazia(), ...(c?.ficha || {}) }
  };
  // ficha antiga (só o texto "objetivo"): vira um objetivo "outro" para não perder
  if (c?.objetivo && !E.ficha.f.objetivos.length) E.ficha.f.objetivos = [{ tipo: 'outro', descricao: c.objetivo.slice(0, 120), valor: null, prazo: null }];
  document.title = (c ? 'Ficha de ' + c.nome : 'Novo cliente') + ' — TRIAD Mirror';

}

function guardarParaMes(o) {
  const n = mesesAte(o.prazo);
  if (o.valor == null || n == null) return null;
  if (n < 1) return { erro: 'Escolha uma data a partir do mês que vem.' };
  const taxa = (E.cli?.plano?.config?.taxaAno ?? 10) / 100, i = Math.pow(1 + taxa, 1 / 12) - 1;
  const ja = o.tipo === 'reserva' ? (E.ficha.f.reservaAtual || 0) * Math.pow(1 + i, n) : 0;
  const falta = Math.max(0, o.valor - ja);
  const fator = i > 0 ? (Math.pow(1 + i, n) - 1) / i : n;
  return { mensal: falta / fator, taxa: taxa * 100, n, contaReserva: o.tipo === 'reserva' && ja > 0 };
}

function textoGuardar(o) {
  const g = guardarParaMes(o);
  if (!g) return '<span class="fraco" style="font-family:\'Public Sans\',sans-serif;font-size:14px">Informe quanto custa e quando, e a gente mostra quanto guardar por mês.</span>';
  if (g.erro) return `<span style="font-family:'Public Sans',sans-serif;font-size:14px;color:var(--vermelho)">${g.erro}</span>`;
  if (g.mensal <= 0.5) return 'Com o que você já tem guardado, <b>esse objetivo já está garantido</b>.';
  return `Para chegar lá, guarde <b>${brl0(Math.ceil(g.mensal))} por mês</b> a partir de ${MESES[(new Date().getMonth() + 1) % 12].toLowerCase()}.`
    + `<span class="fraco" style="display:block;font-family:'Public Sans',sans-serif;font-size:13px;margin-top:4px">${g.n} meses, com rendimento simulado de ${fmtValor(g.taxa)}% ao ano${g.contaReserva ? ', contando o que você já tem guardado' : ''}.</span>`;
}
