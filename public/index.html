// CLIENTE — apuração
// ════════════════════════════════════════════════════════════════════════
async function telaCliente(id, silencioso) {
  if (!silencioso) { E.catCartao = null; E.calMes = null; }
  if (!silencioso) $('#app').innerHTML = topo() + `<main><div class="carregando">Abrindo análise…</div></main>`;
  try { E.cli = await api('GET', '/api/app/clientes/' + id); }
  catch (e) { return telaErro(e.message); }
  document.title = E.cli.cliente.nome + ' — TRIAD Mirror';
  desenharCliente();
}

const lancs = () => E.cli?.apuracao?.lancamentos || [];
/** Mostra o ano só quando ele é diferente do ano mais recente da análise (ex: parcelas antigas). */
const anoDiferente = iso => { const anos = lancs().map(l => (l.data || '').slice(0, 4)).filter(Boolean); const max = anos.sort().pop(); return iso && max && iso.slice(0, 4) !== max; };
const docsDe = tipo => (E.cli?.documentos || []).filter(d => d.tipo === tipo);

function salvoTxt() {
  if (E.salvando) return '<span class="salvo"><i class="ti ti-loader-2"></i> Salvando…</span>';
  if (E.salvoEm) return `<span class="salvo"><i class="ti ti-check" style="color:#7fd19c"></i> Salvo ${new Date(E.salvoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>`;
  return '';
}

function desenharCliente() {
  const { cliente, analise, documentos } = E.cli;
  const ext = docsDe('extrato'), fat = docsDe('fatura');
  const bancosConta = [...new Set(ext.map(d => d.banco).filter(Boolean))];
  const cartoes = fat.map(d => d.produto || ('Cartão ' + (d.banco || ''))).filter((v, i, a) => a.indexOf(v) === i);
  if (!ext.length && fat.length && E.aba === 'conta') E.aba = 'cartao';
  const concluida = analise.status === 'concluida';
  const fi = cliente.ficha || {}, idade = idadeDe(fi.nascimento);
  const objs = (fi.objetivos || []).map(o => o.descricao).filter(Boolean);
  const info = [cliente.cpf ? 'CPF ' + esc(cliente.cpf) : '', idade != null ? idade + ' anos' : '', fi.profissao ? esc(fi.profissao) : '', cliente.telefone ? esc(cliente.telefone) : '', cliente.renda_declarada ? 'Renda declarada ' + brl(cliente.renda_declarada) : '',
    objs.length ? (objs.length > 1 ? 'Objetivos: ' : 'Objetivo: ') + esc(objs.join(', ')) : cliente.objetivo ? 'Objetivo: ' + esc(cliente.objetivo) : ''].filter(Boolean).join(' · ');

  const chipsDocs = documentos.map(d => {
    const conta = d.tipo === 'extrato';
    const extra = conta ? '' : (d.conferencia?.bateu === true ? ' <span class="pill verde" title="Todos os totais impressos conferem">conferida</span>' : d.conferencia?.bateu === false ? ' <span class="pill vermelho">divergente</span>' : '');
    const ruim = d.qualidade_ruim ? ' <span class="pill vermelho" title="' + esc(d.motivo_qualidade_ruim || '') + '">ilegível</span>' : '';
    return `<span class="doc"><span class="ic ${conta ? 'conta' : 'cartao'}" style="width:24px;height:24px;font-size:14px;border-radius:6px"><i class="ti ${conta ? 'ti-building-bank' : 'ti-credit-card'}"></i></span>
      <span><b>${conta ? 'Conta' : 'Cartão'} ${esc(d.banco || '')}</b>${!conta && d.vencimento ? ' · venc. ' + dataBR(d.vencimento) + '/' + d.vencimento.slice(2, 4) : ''} <span class="fraco">· ${d.lancamentos} lanç.</span>${extra}${ruim}</span>
      <button data-acao="excluir-doc" data-id="${d.id}" title="Excluir documento" aria-label="Excluir documento"><i class="ti ti-x"></i></button></span>`;
  }).join('');

  E.chipsDocs = chipsDocs;
  if (LANC_ABAS.includes(E.aba)) E.ultLanc = E.aba;
  const precisaDoc = !documentos.length && !['perfil', 'cadastro', 'docs', 'reunioes', 'simuladores', 'calendario'].includes(E.aba);
  $('#app').innerHTML = topo(salvoTxt()) + `<div class="cli-wrap">${colunaCliente()}<main>
    ${cabecalhoPerfil()}
    ${LANC_ABAS.includes(E.aba) && documentos.length ? `
    <div class="abas" role="tablist" style="margin-top:14px">
      <button class="aba ${E.aba === 'tudo' ? 'on' : ''}" data-acao="aba" data-aba="tudo" role="tab"><span class="ic tudo"><i class="ti ti-layout-list"></i></span><span><b>Tudo junto</b><small>Conta + cartão</small></span></button>
      <button class="aba ${E.aba === 'conta' ? 'on' : ''}" data-acao="aba" data-aba="conta" role="tab"><span class="ic conta"><i class="ti ti-building-bank"></i></span><span><b>Conta bancária</b><small>${bancosConta.length ? esc(bancosConta.join(', ')) : 'Nenhum extrato ainda'}</small></span></button>
      <button class="aba ${E.aba === 'cartao' ? 'on' : ''}" data-acao="aba" data-aba="cartao" role="tab"><span class="ic cartao"><i class="ti ti-credit-card"></i></span><span><b>Cartão de crédito</b><small>${cartoes.length ? esc(cartoes.join(', ')) : 'Nenhuma fatura ainda'}</small></span></button>
    </div>` : ''}
    ${precisaDoc ? `<div class="card vazio" style="margin-top:16px"><h2>Envie o primeiro documento</h2><p class="suave">Extrato bancário (conta) ou fatura do cartão de crédito, em PDF ou foto.</p><button class="btn primario" data-acao="novo-doc"><i class="ti ti-upload"></i> Enviar documento</button></div>`
      : `<div id="conteudo" style="${E.aba === 'perfil' ? '' : 'margin-top:14px'}"></div>`}
  </main></div>`;
  if (!precisaDoc) desenharConteudo();
}

// ════════════════════════════════════════════════════════════════════════
// PERFIL DO CLIENTE — capa + números + abas (Visão geral, Lançamentos,
// Documentos, Plano, App). A Visão geral usa os mesmos cálculos do app do
// cliente (E.cli.perfil) e a linha do painel (E.cli.resumoPainel).
// ════════════════════════════════════════════════════════════════════════
const LANC_ABAS = ['tudo', 'conta', 'cartao'];
const FORMA_RENDA_TXT = { clt: 'CLT', autonomo: 'Autônomo', empresario: 'Empresário', aposentado: 'Aposentado', outro: '' };
const DIVIDA_TXT = { emprestimo: 'Empréstimo pessoal', veiculo: 'Financiamento de veículo', imobiliario: 'Financiamento imobiliário', consignado: 'Consignado', cheque_especial: 'Cheque especial', outro: 'Dívida' };
const nomeDivida = d => String(d?.nome || '').trim() || DIVIDA_TXT[d?.tipo] || 'Dívida';
const mesCurtoPf = k => /^\d{4}-\d{2}/.test(k || '') ? MESES_C[Number(k.slice(5, 7)) - 1] + '/' + k.slice(2, 4) : '';
const mesNomePf = k => /^\d{4}-\d{2}/.test(k || '') ? MESES[Number(k.slice(5, 7)) - 1].toLowerCase() : '';
const PF_CORES = ['var(--primaria)', '#3B7D5E', 'var(--cal-barra)', '#C9A227', 'var(--borda-forte)'];

function pfMeses() { return (E.cli?.perfil?.meses || []).filter(m => m.gastou > 0 || m.entrou > 0); }
function pfUltimos() { const ms = pfMeses(); return { at: ms[ms.length - 1] || null, pa: ms.length > 1 ? ms[ms.length - 2] : null }; }

function cabecalhoPerfil() {
  const { cliente: c, analise, documentos } = E.cli;
  const P = E.cli.perfil, R = E.cli.resumoPainel || {}, fi = c.ficha || {};
  const idade = idadeDe(fi.nascimento);
  const info = [fi.profissao ? esc(fi.profissao) : '', idade != null ? idade + ' anos' : '', FORMA_RENDA_TXT[fi.formaRenda] || '',
    fi.dependentes ? fi.dependentes + (fi.dependentes > 1 ? ' dependentes' : ' dependente') : '', fi.cidade ? esc(fi.cidade) : ''].filter(Boolean).join(' · ');
  const objs = (fi.objetivos || []).map(o => o.descricao).filter(Boolean);
  const frase = c.objetivo || (objs.length ? 'Objetivos: ' + objs.join(', ') : '');
  const { at } = pfUltimos();
  const fone = String(c.telefone || '').replace(/\D/g, '');
  const concluida = analise.status === 'concluida';
  const desde = (c.criado_em || '').slice(0, 7);
  const stats = [
    P?.nota ? [String(P.nota.valor), 'nota'] : null,
    R.renda ? [brl0(R.renda), 'renda'] : null,
    at ? (at.semRenda ? [brl0(at.gastou), 'gastou em ' + MESES_C[Number(at.mes.slice(5, 7)) - 1]] : [brl0(Math.abs(at.sobra)), (at.sobra >= 0 ? 'sobrou em ' : 'faltou em ') + MESES_C[Number(at.mes.slice(5, 7)) - 1]]) : null,
    R.meses?.length ? [String(R.meses.length), R.meses.length > 1 ? 'meses analisados' : 'mês analisado'] : null,
    [String(documentos.length), documentos.length === 1 ? 'documento' : 'documentos']
  ].filter(Boolean);
  const secao = LANC_ABAS.includes(E.aba) ? 'lanc' : E.aba;
  const aba = (id, alvo, txt) => `<button class="pf-aba ${secao === id ? 'on' : ''}" data-acao="aba" data-aba="${alvo}" role="tab" aria-selected="${secao === id}">${txt}</button>`;
  return `<div class="card pf-topo">
    <div class="pf-capa">
      <div class="pf-capa-pills">${desde ? `<span class="pill pf-vidro">Cliente desde ${mesCurtoPf(desde)}</span>` : ''}
        ${concluida ? '<span class="pill pf-vidro"><i class="ti ti-check"></i> Análise concluída</span>' : documentos.length ? '<span class="pill pf-vidro">Em revisão</span>' : '<span class="pill pf-vidro">Sem documentos</span>'}
        ${c.app_publicado_em ? (c.app_ativo ? '<span class="pill pf-marca">App no ar</span>' : '<span class="pill pf-vidro">App desativado</span>') : ''}</div>
    </div>
    <div class="pf-id">
      <span class="pf-foto">${esc(iniciais(c.nome))}</span>
      <div class="pf-nome"><h1>${esc(c.nome)}</h1><div class="suave">${info || 'Complete a ficha para ver profissão, idade e cidade aqui'}</div></div>
      <div class="pf-botoes">
        ${fone ? `<a class="btn" href="https://wa.me/${fone.length <= 11 ? '55' + fone : fone}" target="_blank" rel="noopener" style="text-decoration:none"><i class="ti ti-brand-whatsapp"></i> WhatsApp</a>` : ''}
        <a class="btn" href="#/cliente/${c.id}/cadastro" style="text-decoration:none"><i class="ti ti-id-badge-2"></i> Ficha</a>
        <button class="btn ${c.app_publicado_em ? '' : 'primario'}" data-acao="app-cliente"><i class="ti ti-device-mobile"></i> ${c.app_publicado_em ? 'App do cliente' : 'Gerar app do cliente'}</button>
      </div>
    </div>
    ${frase ? `<p class="pf-frase">“${esc(frase)}”</p>` : ''}
    <div class="pf-stats num">${stats.map(([v, l]) => `<div><b>${v}</b> <span>${esc(l)}</span></div>`).join('')}</div>
  </div>`;
}

// ── blocos da visão geral
function pfNota() {
  const N = E.cli.perfil?.nota; if (!N) return '';
  const r = 50, C = 2 * Math.PI * r, d = N.valor / 100 * C;
  const delta = N.anterior != null ? N.valor - N.anterior : null;
  return `<div class="card"><div class="pf-t">Saúde financeira</div>
    <div class="pf-anel"><svg viewBox="0 0 120 120" width="150" height="150" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--borda2)" stroke-width="11"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--primaria)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/></svg>
      <div><b>${N.valor}</b><small>${esc(N.rotulo)}</small></div></div>
    <div class="pf-centro ${delta > 0 ? 'pf-bom' : delta < 0 ? 'pf-ruim' : 'fraco'}">${delta == null ? 'Nota de 0 a 100' : delta === 0 ? 'Igual à última publicação' : `${delta > 0 ? '▲' : '▼'} ${Math.abs(delta)} pontos desde a última publicação`}</div>
    <div class="pf-pilares">${N.pilares.map(p => `<div title="${esc(p.texto)}"><div class="pf-lin2"><span>${esc(p.nome)}</span><b class="num">${p.pontos}/25</b></div><div class="pf-barra"><i style="width:${p.pontos / 25 * 100}%;background:${p.status === 'ok' ? 'var(--primaria)' : p.status === 'atencao' ? '#C9A227' : 'var(--vermelho)'}"></i></div></div>`).join('')}</div>
  </div>`;
}

function pfSobre() {
  const { cliente: c } = E.cli, fi = c.ficha || {}, R = E.cli.resumoPainel || {};
  const bancos = [...new Set((E.cli.documentos || []).map(d => d.banco).filter(Boolean))];
  const L = [
    ['Profissão', fi.profissao ? esc(fi.profissao) : ''],
    ['Nascimento', fi.nascimento ? dataCompleta(fi.nascimento) : ''],
    ['Renda', R.renda ? brl0(R.renda) + (FORMA_RENDA_TXT[fi.formaRenda] ? ' · ' + FORMA_RENDA_TXT[fi.formaRenda] : '') + (R.rendaFonte === 'extrato' ? ' <span class="fraco">(extrato)</span>' : '') : ''],
    ['Outras rendas', fi.outrasRendas ? brl0(fi.outrasRendas) : ''],
    ['Dependentes', fi.dependentes != null ? String(fi.dependentes) : ''],
    ['Reserva hoje', fi.reservaAtual != null ? brl0(fi.reservaAtual) : ''],
    ['Bancos', bancos.length ? esc(bancos.join(' · ')) : ''],
    ['Cidade', fi.cidade ? esc(fi.cidade) : ''],
    ['Telefone', c.telefone ? esc(c.telefone) : ''],
    ['E-mail', c.email ? esc(c.email) : ''],
    ['CPF', c.cpf ? esc(c.cpf) : ''],
    ['LGPD', fi.lgpd ? `<span class="pf-bom">Autorizado ${fi.lgpdEm ? dataBR(fi.lgpdEm.slice(0, 10)) : ''}</span>` : '<span class="pf-ruim">Não autorizado</span>']
  ].filter(([, v]) => v);
  return `<div class="card"><div class="pf-t">Sobre</div>${L.map(([k, v]) => `<div class="pf-lin"><span>${k}</span><b>${v}</b></div>`).join('')}
    ${[[c.observacao, ''], [fi.obsRenda, 'Renda e família'], [fi.obsDinheiro, 'Dinheiro hoje']].filter(([t]) => t).map(([t, r]) => `<div class="pf-obs">${r ? `<b style="display:block;font-size:11.5px;margin-bottom:2px">${r}</b>` : ''}${esc(t)}</div>`).join('')}</div>`;
}

function pfKpis() {
  const { at, pa } = pfUltimos(), R = E.cli.resumoPainel || {}, P = E.cli.perfil, fi = E.cli.cliente.ficha || {};
  if (!at) return '';
  const mm = MESES_C[Number(at.mes.slice(5, 7)) - 1], pm = pa ? mesNomePf(pa.mes) : '';
  const comparavel = pa && pa.comFatura === at.comFatura;
  const delta = (a, b, menorMelhor) => {
    if (!comparavel || b == null) return '';
    const d = a - b; if (Math.abs(d) < 1) return `<div class="pf-d fraco">igual a ${pm}</div>`;
    const bom = menorMelhor ? d < 0 : d > 0;
    return `<div class="pf-d ${bom ? 'pf-bom' : 'pf-ruim'}">${d > 0 ? '▲' : '▼'} ${brl0(Math.abs(d))} vs ${pm}</div>`;
  };
  const prox = P?.parcelas?.proxima;
  const tiles = [
    `<small>Renda</small><b class="num">${R.renda ? brl0(R.renda + (Number(fi.outrasRendas) || 0)) : '—'}</b><div class="pf-d fraco">${fi.outrasRendas ? 'salário + ' + brl0(fi.outrasRendas) + ' extra' : R.rendaFonte === 'extrato' ? 'pelo extrato' : R.renda ? 'declarada' : 'não informada'}</div>`,
    `<small>Gastou em ${mm}</small><b class="num">${brl0(at.gastou)}</b>${delta(at.gastou, pa?.gastou, true)}`,
    at.semRenda ? `<small>Juros em ${mm}</small><b class="num">${brl0(at.juros)}</b><div class="pf-d ${at.juros > 0.5 ? 'pf-ruim' : 'pf-bom'}">${at.juros > 0.5 ? 'pagou juros do cartão' : 'sem juros'}</div>`
      : `<small>${at.sobra >= 0 ? 'Sobrou' : 'Faltou'} em ${mm}</small><b class="num ${at.sobra < 0 ? 'pf-ruim' : ''}">${brl0(Math.abs(at.sobra))}</b>${delta(at.sobra, pa?.sobra, false)}`,
    `<small>Parcelas ${prox ? 'em ' + MESES_C[Number(prox.mes.slice(5, 7)) - 1] : ''}</small><b class="num">${prox ? brl0(prox.valor) : 'Nenhuma'}</b><div class="pf-d ${R.pctRendaEmParcelas >= 30 ? 'pf-ruim' : R.pctRendaEmParcelas >= 15 ? 'pf-atencao' : 'fraco'}">${R.pctRendaEmParcelas != null ? Math.round(R.pctRendaEmParcelas) + '% da renda' : prox ? 'cartão parcelado' : 'cartão livre'}</div>`
  ];
  return `<div class="pf-kpis">${tiles.map(t => `<div class="card pf-kpi">${t}</div>`).join('')}</div>`;
}

function pfGraficoMeses() {
  const ms = pfMeses(); if (!ms.length) return '';
  const semRenda = ms.every(m => m.semRenda);
  const W = 560, H = 200, pt = 26, pb = 24, n = ms.length, slot = (W - 20) / n, bw = Math.min(30, slot * (semRenda ? 0.5 : 0.32));
  const maxV = Math.max(...ms.map(m => Math.max(m.gastou, semRenda ? 0 : m.entrou))) * 1.1 || 1, y = v => pt + (H - pt - pb) * (1 - v / maxV);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entrou e gastou por mês"><line x1="10" x2="${W - 10}" y1="${y(0)}" y2="${y(0)}" stroke="var(--borda)"/>`;
  ms.forEach((m, i) => {
    const cx = 10 + i * slot + slot / 2, last = i === n - 1;
    if (!semRenda) s += `<g><title>${nomeMes(m.mes)}: entrou ${brl0(m.entrou)}${m.rendaEstimada ? ' (renda declarada)' : ''}</title><rect x="${cx - bw - 2}" y="${y(m.entrou)}" width="${bw}" height="${y(0) - y(m.entrou)}" rx="2" fill="var(--pf-entrou)" ${m.rendaEstimada ? 'opacity=".55"' : ''}/></g>`;
    s += `<g><title>${nomeMes(m.mes)}: gastou ${brl0(m.gastou)}</title><rect x="${semRenda ? cx - bw / 2 : cx + 2}" y="${y(m.gastou)}" width="${bw}" height="${y(0) - y(m.gastou)}" rx="2" fill="${m.gastou > m.entrou && !m.semRenda ? 'var(--vermelho)' : 'var(--primaria)'}"/></g>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--fraco)" font-weight="${last ? 700 : 400}">${MESES_C[Number(m.mes.slice(5, 7)) - 1]}</text>`;
  });
  s += `</svg>`;
  return `<div class="card"><div class="pf-t pf-t-flex"><span>${semRenda ? 'Gastos mês a mês' : 'Entrou × gastou, mês a mês'}</span>
    <span class="pf-leg">${semRenda ? '' : '<i style="background:var(--pf-entrou)"></i>Entrou '}<i style="background:var(--primaria)"></i>Gastou${semRenda ? '' : ' <i style="background:var(--vermelho)"></i>Gastou mais do que entrou'}</span></div>${s}</div>`;
}

function pfOndeVai() {
  const { at } = pfUltimos(); if (!at) return '';
  const cats = Object.entries(at.categorias || {}).sort((a, b) => b[1] - a[1]);
  const top = cats.filter(([k]) => k !== 'Outros').slice(0, 4), resto = Math.max(0, at.gastou - top.reduce((a, [, v]) => a + v, 0));
  const linhas = [...top, ...(resto >= 1 ? [['Outros gastos', resto]] : [])];
  const tot = linhas.reduce((a, [, v]) => a + v, 0) || 1;
  return `<div class="card"><div class="pf-t">Para onde vai o dinheiro (${MESES_C[Number(at.mes.slice(5, 7)) - 1]})</div>
    <div class="pf-pilha">${linhas.map(([, v], i) => `<i style="width:${v / tot * 100}%;background:${PF_CORES[i]}"></i>`).join('')}</div>
    ${linhas.map(([k, v], i) => `<div class="pf-lin"><span><i class="pf-q" style="background:${PF_CORES[i]}"></i>${esc(k)}</span><b class="num">${brl0(v)}</b></div>`).join('')}</div>`;
}

function pfParcelas() {
  const Pp = E.cli.perfil?.parcelas; if (!Pp) return '';
  const pm = (Pp.porMes || []).slice(0, 18);
  if (!pm.length) return `<div class="card"><div class="pf-t">Parcelas acabando</div><p class="suave" style="margin:0">Nenhuma compra parcelada em aberto no cartão.</p></div>`;
  const W = 260, H = 110, mx = Math.max(...pm.map(p => p.valor)) || 1, x = i => 8 + i * (W - 16) / Math.max(1, pm.length - 1), y = v => 10 + (H - 34) * (1 - v / mx);
  const pts = pm.map((p, i) => `${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ');
  const ult = pm[pm.length - 1];
  return `<div class="card"><div class="pf-t">Parcelas acabando</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Parcelas por mês"><line x1="8" x2="${W - 8}" y1="${H - 24}" y2="${H - 24}" stroke="var(--borda)"/>
      <polyline points="${pts}" pathLength="1" fill="none" stroke="var(--primaria)" stroke-width="2.5" stroke-linejoin="round"/>
      ${pm.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.valor)}" r="${i === 0 ? 3.5 : 0}" fill="var(--primaria)"><title>${nomeMes(p.mes)}: ${brl0(p.valor)}</title></circle><rect x="${x(i) - 6}" y="0" width="12" height="${H - 24}" fill="transparent"><title>${nomeMes(p.mes)}: ${brl0(p.valor)}${p.terminam ? ' · ' + p.terminam + ' terminam' : ''}</title></rect>`).join('')}
      <text x="8" y="${H - 8}" font-size="10" fill="var(--fraco)">${mesCurtoPf(pm[0].mes)}</text><text x="${W - 8}" y="${H - 8}" font-size="10" fill="var(--fraco)" text-anchor="end">${mesCurtoPf(ult.mes)}</text></svg>
    <small class="suave">De ${brl0(pm[0].valor)} em ${mesNomePf(pm[0].mes)} para ${brl0(ult.valor)} em ${mesNomePf(ult.mes)}/${ult.mes.slice(2, 4)}.${Pp.livreEm ? ` Livre em ${mesCurtoPf(Pp.livreEm)}.` : ''}</small></div>`;
}

function pfEventosTempo() {
  const { cliente: c, analise, documentos } = E.cli, fi = c.ficha || {}, P = E.cli.perfil;
  const ev = [];
  (fi.notas || []).forEach((n, i) => ev.push({ q: n.em, tipo: 'nota', titulo: 'Anotação' + (n.autor ? ' de ' + n.autor : ''), texto: n.texto, quando: dataCompleta(n.em.slice(0, 10)), i }));
  const porDia = {};
  documentos.forEach(d => { const k = (d.criado_em || '').slice(0, 10); if (k) (porDia[k] = porDia[k] || []).push(d); });
  Object.entries(porDia).forEach(([k, ds]) => ev.push({ q: k + 'T23:00', tipo: 'doc', titulo: ds.length > 1 ? ds.length + ' documentos lidos' : 'Documento lido',
    texto: ds.map(d => (d.tipo === 'extrato' ? 'Extrato ' : 'Fatura ') + (d.banco || '') + (d.vencimento ? ' venc. ' + dataBR(d.vencimento) : '')).join(' · '), quando: dataCompleta(k) }));
  if (analise.status === 'concluida' && analise.atualizado_em) ev.push({ q: analise.atualizado_em, tipo: 'ok', titulo: 'Análise concluída', texto: lancs().filter(l => l.situacao === 'incluido').length + ' lançamentos na análise', quando: dataCompleta(analise.atualizado_em.slice(0, 10)) });
  const hist = c.app_snapshot?.historico || [];
  hist.forEach((h, i) => ev.push({ q: h.data, tipo: 'app', titulo: i === 0 ? 'App do cliente publicado' : 'App atualizado para o cliente', texto: `Nota ${h.nota}` + (i > 0 && hist[i - 1] ? ` (era ${hist[i - 1].nota})` : ''), quando: dataCompleta(h.data.slice(0, 10)) }));
  (P?.eventos || []).forEach(e => ev.push({ q: e.mes + '-27', tipo: e.tipo === 'conquista' ? 'conq' : 'alerta', titulo: e.titulo, texto: e.texto, quando: nomeMes(e.mes) + ' · ' + (e.tipo === 'conquista' ? 'Conquista' : 'Atenção') }));
  (fi.atas || []).forEach(a => ev.push({ q: a.data + 'T' + (a.hora || '12:00'), tipo: 'ata', titulo: 'Reunião: ' + a.titulo, texto: [a.temas.join(', '), a.combinados.length ? a.combinados.length + (a.combinados.length > 1 ? ' combinados' : ' combinado') : ''].filter(Boolean).join(' · '), quando: dataCompleta(a.data) + (metaAta(a) ? ' · ' + metaAta(a) : '') }));
  if (c.criado_em) ev.push({ q: c.criado_em, tipo: 'novo', titulo: 'Cliente cadastrado', texto: '', quando: dataCompleta(c.criado_em.slice(0, 10)) });
  return ev.sort((a, b) => String(b.q).localeCompare(String(a.q)));
}

const PF_ICONE = { nota: ['pf-i-nota', 'ti-pencil'], doc: ['pf-i-doc', 'ti-file-text'], ok: ['pf-i-ok', 'ti-player-play'], app: ['pf-i-app', 'ti-device-mobile'], conq: ['pf-i-ok', 'ti-star'], alerta: ['pf-i-al', 'ti-alert-triangle'], novo: ['pf-i-doc', 'ti-user-plus'], ata: ['pf-i-app', 'ti-users'] };
function pfLinhaTempo() {
  const ev = pfEventosTempo(), lim = E.pfTudo ? ev.length : 8;
  return `<div class="card"><div class="pf-t">Linha do tempo</div>
    <div class="pf-nova"><textarea id="pfNota" rows="2" maxlength="1000" placeholder="Escreva uma anotação sobre o cliente (fica salva na linha do tempo)…"></textarea><button class="btn primario" data-acao="pf-nota"><i class="ti ti-send"></i> Salvar</button></div>
    <div class="pf-feed">${ev.slice(0, lim).map(e => `<div class="pf-it"><span class="pf-ic ${PF_ICONE[e.tipo][0]}"><i class="ti ${PF_ICONE[e.tipo][1]}"></i></span>
      <div style="flex:1;min-width:0"><b>${esc(e.titulo)}</b>${e.texto ? `<div class="suave pf-quebra">${esc(e.texto)}</div>` : ''}<small class="fraco">${e.quando}</small></div>
      ${e.tipo === 'nota' ? `<button class="pf-x" data-acao="pf-nota-del" data-i="${e.i}" title="Apagar anotação" aria-label="Apagar anotação"><i class="ti ti-x"></i></button>` : ''}</div>`).join('')}</div>
    ${ev.length > 8 ? `<button class="btn" data-acao="pf-tudo" style="width:100%;margin-top:8px">${E.pfTudo ? 'Mostrar menos' : `Ver tudo (${ev.length})`}</button>` : ''}</div>`;
}

function pfObjetivos() {
  const metas = E.cli.perfil?.futuro?.metas;
  const fi = E.cli.cliente.ficha || {};
  const pct = m => Math.max(0, Math.min(100, m.valor ? m.atual / m.valor * 100 : 0));
  let corpo;
  if (metas?.length) corpo = metas.map((m, i) => `<div class="pf-meta"><div class="pf-lin2"><b>${esc(m.titulo)}</b><span class="num">${m.atual >= m.valor ? '✓' : Math.round(pct(m)) + '%'}</span></div>
      <div class="pf-barra"><i style="width:${pct(m)}%;background:${i % 2 ? 'var(--azul)' : 'var(--primaria)'}"></i></div>
      <small class="fraco">${brl0(m.atual)} de ${brl0(m.valor)}${m.prazo ? ' · ' + mesCurtoPf(m.prazo) : ''}${m.previsao && m.atual < m.valor ? ' · previsão ' + mesCurtoPf(m.previsao) : ''}</small></div>`).join('');
  else if ((fi.objetivos || []).length) corpo = fi.objetivos.map(o => `<div class="pf-lin"><span>${esc(o.descricao || 'Objetivo')}</span><b>${o.valor ? brl0(o.valor) : ''}${o.prazo ? ' · ' + mesCurtoPf(o.prazo) : ''}</b></div>`).join('');
  else corpo = `<p class="suave" style="margin:0">Nenhum objetivo na ficha. <a href="#" data-acao="editar-perfil">Adicionar</a></p>`;
  return `<div class="card"><div class="pf-t">Objetivos</div>${corpo}</div>`;
}

function pfDividas() {
  const fi = E.cli.cliente.ficha || {}, Pp = E.cli.perfil?.parcelas, rot = E.cli.apuracao?.resumo?.endividamentoCartao;
  const L = (fi.dividas || []).map(d => [nomeDivida(d), [d.saldo ? brl0(d.saldo) : '', d.parcela ? brl0(d.parcela) + (d.parcelasRestantes ? ' · ' + d.parcelasRestantes + 'x' : '') : ''].filter(Boolean).join(' · ') || '—']);
  if (Pp?.totalRestante > 0) L.push(['Cartão parcelado', brl0(Pp.totalRestante) + (Pp.livreEm ? ' · até ' + mesCurtoPf(Pp.livreEm) : '')]);
  if (E.cli.documentos.some(d => d.tipo === 'fatura')) L.push(['Rotativo', rot?.emRotativo ? `<span class="pf-ruim">Sim${rot.encargos ? ' · ' + brl0(rot.encargos) + ' de juros' : ''}</span>` : '<span class="pf-bom">Nenhum</span>']);
  return `<div class="card"><div class="pf-t">Dívidas</div>${L.length ? L.map(([k, v]) => `<div class="pf-lin"><span>${esc(k)}</span><b class="num">${v}</b></div>`).join('') : `<p class="suave" style="margin:0">${fi.semDividas ? 'Cliente sem dívidas.' : 'Nenhuma dívida informada.'}</p>`}</div>`;
}

function pfAtencao() {
  const R = E.cli.resumoPainel || {}, itens = [];
  (R.alertas || []).forEach(a => itens.push([/Rotativo|Documento ilegível/.test(a) ? 'pf-a-r' : 'pf-a-a', a]));
  if (R.aClassificar) itens.push(['pf-a-z', R.aClassificar + (R.aClassificar > 1 ? ' lançamentos a classificar' : ' lançamento a classificar')]);
  const fi = E.cli.cliente.ficha || {};
  if (!fi.lgpd) itens.push(['pf-a-z', 'Falta a autorização LGPD na ficha']);
  if (!itens.length) return '';
  return `<div class="card"><div class="pf-t">Atenção</div><div class="pf-alertas">${itens.map(([c, t]) => `<span class="${c}">${esc(t)}</span>`).join('')}</div></div>`;
}

function pfConquistas() {
  const P = E.cli.perfil; if (!P) return '';
  const { at } = pfUltimos(), rot = E.cli.apuracao?.resumo?.endividamentoCartao;
  const temFatura = E.cli.documentos.some(d => d.tipo === 'fatura');

// ── Outlook (Microsoft 365 da empresa): abre o Outlook na web com o evento preenchido.
// Horário de Brasília (-03:00, sem horário de verão). Sem hora = evento de dia todo.
function linkOutlook({ titulo, data, hora, duracao, corpo }) {
  const p = new URLSearchParams({ path: '/calendar/action/compose', rru: 'addevent', subject: titulo });
  if (hora) {
    const ini = new Date(`${data}T${hora}:00-03:00`), fim = new Date(ini.getTime() + (duracao || 60) * 60000);
    const br = d => new Date(d.getTime() - 3 * 3600000).toISOString().slice(0, 19) + '-03:00';
    p.set('startdt', br(ini)); p.set('enddt', br(fim));
  } else {
    const fim = new Date(data + 'T12:00:00Z'); fim.setUTCDate(fim.getUTCDate() + 1);
    p.set('startdt', data); p.set('enddt', fim.toISOString().slice(0, 10)); p.set('allday', 'true');
  }
  if (corpo) p.set('body', corpo);
  return 'https://outlook.office.com/calendar/0/deeplink/compose?' + p.toString().replace(/\+/g, '%20');
}

}

async function salvarAtaEditada(comWhats) {
  const a = lerAta();
  if (!a.data) return toast('Informe a data da reunião.', true);
  a.titulo = a.titulo.trim() || 'Reunião de ' + dataCompleta(a.data);
  a.assuntos = a.assuntos.map(t => t.trim()).filter(Boolean);
  a.combinados = a.combinados.filter(c => c.texto.trim());
  if (!a.id) { a.id = 'ata-' + Date.now().toString(36); a.criadoEm = new Date().toISOString(); }
  const atas = atasDe().filter(x => x.id !== a.id);
  E.ataAntFeitos?.forEach(k => { const [id, i] = k.split('|'); const x = atas.find(y => y.id === id); if (x?.combinados[+i]) { x.combinados[+i].feito = true; x.combinados[+i].feitoEm = hojeISO(); } });
  atas.push(a);
  const extra = a.proxima?.data && a.proxima.data >= hojeISO() ? { proximoContato: { data: a.proxima.data, hora: a.proxima.hora || '', duracao: (E.cli.cliente.ficha || {}).proximoContato?.duracao || 60, motivo: 'Reunião combinada na ata nº ' + a.numero } } : null;
  E.ataEdit = null; E.ataSel = a.id; E.ataAntFeitos = null;
  await salvarAtas(atas, extra, 'Ata salva');
  if (comWhats) abrirWhatsAta(a);
}

// ── Agenda e Reuniões (todos os clientes)
async function carregarListaClientes() {
  const r = await api('GET', '/api/app/clientes');
  E.listaClientes = r.clientes || [];
  E.agendaPendentes = itensAgenda().filter(i => i.data && i.data <= hojeISO()).length;
  return E.listaClientes;
}

function itensAgenda() {
  const out = [];
  (E.listaClientes || []).forEach(c => {
    const fi = c.ficha || {}, pc = fi.proximoContato || {};
    if (pc.data) out.push({ data: pc.data, hora: pc.hora || '', duracao: pc.duracao, tipo: 'contato', cliente: c, titulo: pc.motivo || 'Contato com o cliente', aba: 'perfil' });
    (fi.atas || []).forEach(a => {
      if (a.proxima?.data && a.proxima.data !== pc.data) out.push({ data: a.proxima.data, hora: a.proxima.hora || '', tipo: 'reuniao', cliente: c, titulo: 'Reunião combinada na ata nº ' + a.numero, aba: 'reunioes', ata: a.id });
      (a.combinados || []).forEach(k => { if (!k.feito) out.push({ data: k.prazo, hora: '', tipo: 'combinado', cliente: c, titulo: k.texto, resp: k.responsavel, aba: 'reunioes', ata: a.id }); });
    });
  });
  return out.sort((x, y) => (x.data || '9999').localeCompare(y.data || '9999') || x.hora.localeCompare(y.hora));
}

const CAT_ARQ = [['contrato', 'Contrato', 'cat-contrato'], ['comprovante', 'Comprovante', 'cat-comprovante'], ['planilha', 'Planilha', 'cat-planilha'], ['dividas', 'Dívidas', 'cat-dividas'], ['imposto', 'Imposto de renda', 'cat-imposto'], ['outros', 'Outros', 'cat-outros']];

const catCls = c => (CAT_ARQ.find(x => x[0] === c) || CAT_ARQ[5])[2];
const tamTxt = b => !b ? '' : b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB';
function extDe(nome, mime) {
  const e = (String(nome || '').match(/\.([a-z0-9]{2,5})$/i) || [])[1];
  if (e) return e.toUpperCase().replace('JPEG', 'JPG');
  return /pdf/.test(mime || '') ? 'PDF' : /image/.test(mime || '') ? 'IMG' : 'ARQ';
}
const iconeArq = ext => `<span class="dc-ext dc-${/PDF/.test(ext) ? 'pdf' : /XLS|CSV/.test(ext) ? 'xls' : /DOC|PPT|TXT/.test(ext) ? 'doc' : /JPG|PNG|WEBP|HEIC|GIF|IMG/.test(ext) ? 'img' : 'zip'}">${esc(ext.slice(0, 4))}</span>`;
const quandoPor = (iso, por) => `${dataBR(String(iso).slice(0, 10))}/${String(iso).slice(2, 4)}${por ? ' · ' + esc(por) : ''}`;

function abaDocs() {
  const docs = E.cli.documentos, arqs = E.cli.arquivos || [];
  const sub = E.docsAba === 'arquivos' ? 'arquivos' : 'leitura';
  return `<div class="dc-subabas" role="tablist">
      <button class="dc-sub ${sub === 'leitura' ? 'on' : ''}" data-acao="docs-sub" data-v="leitura" role="tab" aria-selected="${sub === 'leitura'}">Extratos e faturas <em>${docs.length}</em></button>
      <button class="dc-sub ${sub === 'arquivos' ? 'on' : ''}" data-acao="docs-sub" data-v="arquivos" role="tab" aria-selected="${sub === 'arquivos'}">Arquivos do cliente <em>${arqs.length}</em></button>
    </div>
    <div class="dc-corpo">${sub === 'leitura' ? docsLeitura(docs) : docsArquivos(arqs)}</div>`;

function docsLeitura(docs) {
  const lin = d => {
    const conta = d.tipo === 'extrato';
    const prod = !conta && d.produto ? String(d.produto) : '';
    const titulo = (conta ? 'Extrato ' : 'Fatura ') + (prod && d.banco && prod.toLowerCase().includes(String(d.banco).toLowerCase()) ? prod : [d.banco || '', prod].filter(Boolean).join(' '));
    const det = conta

/** Liga o arrastar-e-soltar e a busca (chamado depois de desenhar a aba). */
function ligarDocs() {
  const drop = $('#dcDrop'), inp = $('#dcInput');
  if (inp) inp.onchange = () => { if (inp.files.length) modalEnviarArquivos([...inp.files]); inp.value = ''; };
  if (drop) {
    ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, ev => { ev.preventDefault(); drop.classList.add('sobre'); }));
    ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, ev => { ev.preventDefault(); drop.classList.remove('sobre'); }));
    drop.addEventListener('drop', ev => { const fs = [...(ev.dataTransfer?.files || [])]; if (fs.length) modalEnviarArquivos(fs); });
  }
  const b = $('#arqBusca');
  if (b) b.oninput = () => { E.arqBusca = b.value; clearTimeout(E.tArq); E.tArq = setTimeout(() => { desenharConteudo(); const x = $('#arqBusca'); x?.focus(); x?.setSelectionRange(x.value.length, x.value.length); }, 250); };
}

function sugerirCategoria(nome) {
  const n = nome.toLowerCase();
  if (/contrato/.test(n)) return 'contrato';
  if (/comprovante|pix|recibo|boleto|pagamento/.test(n)) return 'comprovante';
  if (/\.(xlsx?|csv)$/.test(n) || /planilha/.test(n)) return 'planilha';
  if (/irpf|imposto|informe|declara/.test(n)) return 'imposto';
  if (/financiamento|emprestimo|empréstimo|renegocia|divida|dívida|acordo/.test(n)) return 'dividas';
  return 'outros';
}

function modalEnviarArquivos(files) {
  const grandes = files.filter(f => f.size > 20 * 1024 * 1024);
  if (grandes.length) toast(`${grandes.map(f => f.name).join(', ')}: passa de 20 MB e não será enviado.`, true);
  files = files.filter(f => f.size <= 20 * 1024 * 1024).slice(0, 20);
  if (!files.length) return;
  E.envio = { files, nomes: files.map(f => f.name.replace(/\.[^.]+$/, '')), categoria: sugerirCategoria(files[0].name), anotacao: '' };
  desenharModalEnvio();

function lerEnvio() {

async function guardarEnvio() {

/** Abre (ou baixa) um arquivo protegido: busca com o login e entrega ao navegador. */
async function abrirProtegido(rota, nome, baixar) {
  const janela = baixar ? null : window.open('', '_blank');
  if (janela) janela.document.write('<p style="font:15px system-ui;padding:24px;color:#4D5550">Abrindo arquivo…</p>');
  try {
    const r = await api('GET', rota + (baixar ? '?baixar=1' : ''), undefined, { blob: true });
    const url = URL.createObjectURL(await r.blob());
    if (baixar || !janela) { const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); }
    else janela.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { janela?.close(); toast(e.message, true); }
}

// SIMULADORES — aba do cliente com 7 simulações, já preenchidas com os
// números da análise e da ficha. Tudo é calculado no navegador; nada é salvo,
// exceto quando a consultora clica em "Salvar no plano do cliente".
// ════════════════════════════════════════════════════════════════════════
const SIMS = [
  ['plano', 'ti-adjustments-horizontal', 'E se mudar alguns hábitos?', 'Cortes e saída do rotativo, lado a lado com "continuar assim".'],
  ['objetivo', 'ti-target-arrow', 'Quanto guardar para um objetivo', 'Valor e prazo → quanto por mês. Ou o contrário.'],
  ['reserva', 'ti-shield-check', 'Reserva de emergência', 'Quanto precisa ter e quando completa.'],
  ['divida', 'ti-receipt-off', 'Quitar uma dívida', 'Quanto tempo e quanto de juros, pagando mais ou menos.'],
  ['habito', 'ti-coffee', 'Quanto custa um hábito', 'Um gasto pequeno no mês, em 1, 5 e 10 anos.'],
  ['parcela', 'ti-credit-card', 'Nova compra parcelada', 'Como uma compra mexe nas próximas faturas.'],
  ['investir', 'ti-trending-up', 'Investir todo mês', 'Quanto vira guardando um valor fixo.']
];
const mesNome = n => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + n); return MESES[d.getMonth()].toLowerCase() + ' de ' + d.getFullYear(); };
const mesCurtoN = n => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + n); return MESES_C[d.getMonth()] + '/' + String(d.getFullYear()).slice(2); };
const tempoTxt = n => n == null ? '—' : n < 1 ? 'já' : n < 12 ? n + (n === 1 ? ' mês' : ' meses') : (() => { const a = Math.floor(n / 12), m = n % 12; return a + (a === 1 ? ' ano' : ' anos') + (m ? ' e ' + m + (m === 1 ? ' mês' : ' meses') : ''); })();
const taxaMes = aa => Math.pow(1 + (Number(aa) || 0) / 100, 1 / 12) - 1;
const num = v => { const n = Number(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };

function iniciarSim() {
  const c = E.cli, b = c.plano?.base || {}, cfg = c.plano?.config || {}, fi = c.cliente.ficha || {};
  const objs = (fi.objetivos || []).filter(o => o.valor);

  const taxa = cfg.taxaAno ?? 10;
  const custoVida = Math.round(cfg.custoVidaMensal ?? b.custoVidaEstimado ?? 0);
  E.sim = {
    cli: c.cliente.id, atual: E.sim?.cli === c.cliente.id ? E.sim.atual : 'plano', taxa,
    plano: { rot: !!(cfg.sairRotativo && b.emRotativo), anos: 10, cortes: (() => {
      const fora = ['Pagamento de fatura', 'Investimento', 'Moradia', 'Saúde', 'Educação', 'Impostos e taxas', 'Transferência', 'Encargos e juros', 'Estorno', 'Salário', 'Outros', 'Empréstimos e financiamentos'];
      const cats = (b.mediaPorCategoria || []).filter(x => !fora.includes(x.categoria) && !/Encargos|IOF|Transfer|Pagamento|Pix|TED|DOC|Saque/i.test(x.categoria)).slice(0, 6).map(x => x.categoria);
      (cfg.cortes || []).forEach(k => { if (!cats.includes(k.categoria)) cats.push(k.categoria); });
      return Object.fromEntries(cats.map(c => [c, (cfg.cortes || []).find(k => k.categoria === c)?.percentual || 0]));
    })() },
    objetivo: { modo: 'quanto', idx: objs.length ? 0 : -1, valor: objs[0]?.valor || 20000, prazo: objs[0]?.prazo || (() => { const d = new Date(); return (d.getFullYear() + 2) + '-' + String(d.getMonth() + 1).padStart(2, '0'); })(), ja: objs[0]?.tipo === 'reserva' ? (fi.reservaAtual || 0) : 0, mensal: 500 },
    reserva: { custo: custoVida || 4000, meses: cfg.mesesReserva || 6, ja: Math.round(cfg.reservaAtual ?? fi.reservaAtual ?? 0), mensal: 500 },
    divida: b.emRotativo && b.saldoRotativo > 0
      ? { saldo: Math.round(b.saldoRotativo), juros: b.saldoRotativo ? Math.min(20, Math.max(1, +(b.jurosMensal / b.saldoRotativo * 100).toFixed(1))) : 12, parcela: Math.round(Math.max(b.jurosMensal * 1.5, b.saldoRotativo / 10)), extra: 200, nome: 'Rotativo do cartão' }
      : div ? { saldo: Math.round(div.saldo), juros: 2, parcela: Math.round(div.parcela || div.saldo / 24), extra: 200, nome: nomeDivida(div) }
      : { saldo: 5000, juros: 3, parcela: 400, extra: 200, nome: 'Dívida' },
    habito: { nome: hab?.categoria || 'Delivery', valor: Math.round(hab?.valor || 300), freq: 'mes' },
    parcela: { valor: 3000, vezes: 10 },
    investir: { inicial: Math.round(fi.reservaAtual || 0), mensal: 500, anos: 10 }
  };
}

// CALENDÁRIO FINANCEIRO — o mês dia a dia, só dias úteis. O servidor descobre
// o que se repete (extrato) e os vencimentos (cartões); a consultora ajusta
// e inclui contas em ficha.calendario. Fim de semana e feriado em cinza.
// ════════════════════════════════════════════════════════════════════════
const SEM_C = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const semDe = d => SEM_C[new Date(d + 'T12:00:00').getDay()].toLowerCase();
const vC = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const vC0 = v => (v < 0 ? '−' : '') + Math.round(Math.abs(v)).toLocaleString('pt-BR');
const MESES_CAL = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const mesCal = k => MESES_CAL[+k.slice(5, 7) - 1].replace(/^./, c => c.toUpperCase()) + ' ' + k.slice(0, 4);
const cfgCal = () => { const c = (E.cli.cliente.ficha || {}).calendario || {}; return { saldoInicial: c.saldoInicial ?? null, ajustes: { ...(c.ajustes || {}) }, extras: [...(c.extras || [])] }; };
function regraTxt(it) {
  if (it.freq === 'unica') return 'só em ' + dataCompleta(it.data);
  if (it.freq === 'anual') return 'todo ano, ' + String(it.regra.dia).padStart(2, '0') + '/' + String(it.mes).padStart(2, '0');
  return it.regra.tipo === 'util' ? it.regra.n + 'º dia útil' : 'todo dia ' + it.regra.dia;
}
async function carregarCal(forcar) {
  const id = E.cli.cliente.id;
  if (!forcar && E.cal && E.calCli === id) return;
  E.cal = await api('GET', '/api/app/clientes/' + id + '/calendario'); E.calCli = id;
  if (E.calMes == null || E.calMes >= E.cal.meses.length) E.calMes = 0;
}
async function salvarCal(cfg, msg) {
  try {
    const r = await api('PATCH', '/api/app/clientes/' + E.cli.cliente.id, { ficha: { calendario: cfg } });
    E.cli.cliente = r.cliente; E.calEdit = null; await carregarCal(true); desenharConteudo(); if (msg) toast(msg);
  } catch (e) { toast(e.message, true); }
}
function abaCalendario() {
  if (!E.cal || E.calCli !== E.cli.cliente.id) {
    carregarCal().then(desenharConteudo).catch(e => { const el = $('#conteudo'); if (el) el.innerHTML = `<div class="card vazio"><p>${esc(e.message)}</p></div>`; });
    return '<div class="carregando">Montando o calendário…</div>';
  }
  const C = E.cal, M = C.meses[E.calMes], hoje = C.hoje, comSaldo = C.saldoInicial != null;
  const prim = new Date(M.mes + '-01T12:00:00').getDay();
  const cel = d => {
    const ev = d.eventos, mostra = ev.slice(0, 3), neg = comSaldo && d.saldo < 0 && d.data >= hoje;

function formCal(it) {

  return `<div class="cal-form" data-id="${esc(it?.id || '')}">
    <div class="cal-f2">${novo || it.origem === 'manual' ? `<div style="grid-column:1/-1"><label class="rot">Nome</label><input id="cfTitulo" value="${esc(it?.titulo || '')}" placeholder="Ex: IPVA, aluguel recebido, academia" maxlength="60"></div>

      <div id="cfNumBox" ${['anual', 'unica'].includes(quando) ? 'hidden' : ''}><label class="rot">Dia</label><input id="cfNum" type="number" min="1" max="31" value="${r.tipo === 'util' ? r.n : r.dia}"></div>
      <div id="cfDataBox" ${['anual', 'unica'].includes(quando) ? '' : 'hidden'}><label class="rot">Data</label><input id="cfData" type="date" value="${esc(dataVal)}"></div></div>
    ${it?.origem === 'cartao' ? '<p class="fraco" style="font-size:12px;margin:8px 0 0">Deixe o valor como está para usar o previsto de cada mês (parcelas + média à vista). Mudando, ele fica fixo.</p>' : ''}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn primario" data-acao="cal-salvar">Salvar</button><button class="btn" data-acao="cal-cancelar">Cancelar</button>

      ${!novo && it.origem === 'manual' ? `<button class="btn" data-acao="cal-excluir" data-id="${esc(it.id)}" style="margin-left:auto;color:var(--vermelho)">Excluir</button>` : ''}</div></div>`;
}
function salvarFormCal() {
  const f = $('.cal-form'); if (!f) return;
  const id = f.dataset.id, it = id ? E.cal.itens.find(x => x.id === id) : null, cfg = cfgCal();
  const quando = $('#cfQuando').value, num = Math.round(+$('#cfNum').value), dt = $('#cfData').value, valor = $('#cfValor').value;
  if (['dia', 'util'].includes(quando) && !(num >= 1 && num <= (quando === 'util' ? 23 : 31))) return toast('Informe um dia válido.', true);
  if (['anual', 'unica'].includes(quando) && !dt) return toast('Escolha a data.', true);
  const regra = quando === 'util' ? { tipo: 'util', n: num } : quando === 'dia' ? { tipo: 'dia', dia: num } : { tipo: 'dia', dia: +dt.slice(8, 10) };
  if (!it || it.origem === 'manual') {
    const titulo = $('#cfTitulo').value.trim(); if (!titulo) return toast('Dê um nome.', true);
    if (!(+valor > 0)) return toast('Informe o valor.', true);
    const e = { id: it?.id || 'man-' + Date.now().toString(36), titulo, tipo: $('#cfTipo').value, valor: +valor, regra, freq: quando === 'anual' ? 'anual' : quando === 'unica' ? 'unica' : 'mensal', ...(quando === 'anual' ? { mes: +dt.slice(5, 7) } : {}), ...(quando === 'unica' ? { data: dt } : {}), ativo: true };
    cfg.extras = cfg.extras.filter(x => x.id !== e.id).concat(e);
    return salvarCal(cfg, it ? 'Conta atualizada' : 'Incluída no calendário');
  }
  const a = { ...(cfg.ajustes[id] || {}) }; a.regra = regra;
  if (valor !== '' && Math.abs(+valor - it.valor) > 0.004) a.valor = +valor;
  cfg.ajustes[id] = a; salvarCal(cfg, 'Calendário atualizado');
}

const chips = (k, atual, ops) => `<div class="sm-chips">${ops.map(([v, t]) => `<button type="button" class="dc-chip ${String(atual) === String(v) ? 'on' : ''}" data-acao="sim-chip" data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div>`;

const kpis = l => `<div class="sm-kpis">${l.map(([r, v, cls]) => `<div><small>${r}</small><b class="num ${cls || ''}">${v}</b></div>`).join('')}</div>`;

/** Gráfico de linhas simples: séries [{nome, cor, pontos:[valores], tracejado}] por mês. */
function graficoSim(series, rotuloX) {
  const W = 620, H = 220, pl = 8, pr = 8, pt = 16, pb = 26, n = Math.max(...series.map(s => s.pontos.length)) - 1 || 1;
  const vals = series.flatMap(s => s.pontos), max = Math.max(1, ...vals) * 1.08, min = Math.min(0, ...vals);
  const x = i => pl + (W - pl - pr) * i / n, y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  const marcas = [0, Math.round(n / 4), Math.round(n / 2), Math.round(3 * n / 4), n];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" class="sm-graf" role="img" aria-label="Gráfico da simulação">
    <line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--borda)"/>
    ${series.map(s => `<polyline points="${s.pontos.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}" fill="none" stroke="${s.cor}" stroke-width="${s.tracejado ? 2 : 3}" ${s.tracejado ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round"/>
      <circle cx="${x(s.pontos.length - 1)}" cy="${y(s.pontos[s.pontos.length - 1])}" r="4" fill="${s.cor}"/>`).join('')}
    ${marcas.map(i => `<text x="${x(i)}" y="${H - 6}" font-size="11" fill="var(--fraco)" text-anchor="${i === 0 ? 'start' : i === n ? 'end' : 'middle'}">${rotuloX(i)}</text>`).join('')}
  </svg><div class="sm-leg">${series.map(s => `<span><i style="border-color:${s.cor};${s.tracejado ? 'border-top-style:dashed' : ''}"></i>${s.nome}</span>`).join('')}</div>`;
}

function cfgDoSim() {
  const S = E.sim, cfg = E.cli.plano?.config || {};

}
function entradasPlano() {

// ── 2. Objetivo

    <p class="sm-sub">O que você quer descobrir?</p>${chips('objetivo.modo', O.modo, [['quanto', 'Quanto guardar por mês'], ['quando', 'Quando chego lá']])}

function resObjetivo() {

  if (O.modo === 'quanto') {
    const n = mesesAte(O.prazo);
    if (n == null || n < 1) return '<p class="sm-frase">Escolha uma data a partir do mês que vem.</p>';
    const futJa = ja * Math.pow(1 + i, n), falta = Math.max(0, valor - futJa), fator = i > 0 ? (Math.pow(1 + i, n) - 1) / i : n, mensal = falta / fator;
    const pontos = Array.from({ length: n + 1 }, (_, m) => ja * Math.pow(1 + i, m) + mensal * (i > 0 ? (Math.pow(1 + i, m) - 1) / i : m));

      ${kpis([['Por mês', brl0(Math.ceil(mensal)), 'pf-bom'], ['Prazo', tempoTxt(n)], ['Você deposita', brl0(ja + mensal * n)], ['O rendimento põe', brl0(Math.max(0, valor - ja - mensal * n))]])}
      ${graficoSim([{ nome: 'Guardado', cor: 'var(--s-mudanca)', pontos }, { nome: 'Objetivo', cor: 'var(--fraco)', tracejado: true, pontos: pontos.map(() => valor) }], k => k === 0 ? 'hoje' : mesCurtoN(k))}
      ${explica('Conta de quanto depositar todo mês (com rendimento de ' + fmtValor(E.sim.taxa) + '% ao ano) para, somado ao que já está guardado, chegar ao valor na data.')}`;
  }

    ${kpis([['Chega em', mesNome(n), 'pf-bom'], ['Tempo', tempoTxt(n)], ['Você deposita', brl0(ja + m * n)], ['O rendimento põe', brl0(Math.max(0, pontos[n] - ja - m * n))]])}
    ${graficoSim([{ nome: 'Guardado', cor: 'var(--s-mudanca)', pontos }, { nome: 'Objetivo', cor: 'var(--fraco)', tracejado: true, pontos: pontos.map(() => valor) }], k => k === 0 ? 'hoje' : mesCurtoN(k))}
    ${explica('Mês a mês: o que está guardado rende ' + fmtValor(E.sim.taxa) + '% ao ano e recebe o depósito do mês, até passar do valor do objetivo.')}`;

// ── 3. Reserva

    ${campoN('divida.juros', 'Juros por mês', D.juros, '% ao mês', 'min="0" max="25" step="0.1"')}<small class="fraco sm-dica">Rotativo do cartão costuma passar de 10% ao mês; empréstimo pessoal, 2% a 6%.</small>

}

}
