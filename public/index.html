function atualizarCampoFicha(t, final) {
  const campo = t.dataset?.fc; if (!campo) return;
  const F = E.ficha, f = F.f;
  if (t.dataset.mascara === 'cpf') t.value = mascaraCpf(t.value);
  if (t.dataset.mascara === 'fone') t.value = mascaraFone(t.value);
  let v = t.type === 'checkbox' ? t.checked : t.dataset.tipo === 'dinheiro' ? paraNumero(t.value) : t.type === 'number' ? (t.value === '' ? null : Math.max(0, Math.round(Number(t.value)))) : t.value;
  if (t.dataset.tipo === 'dinheiro' && final && v != null) t.value = fmtValor(v);
  const partes = campo.split('.');
  if (partes[0] === 'f') { f[partes[1]] = partes[1] === 'nascimento' || partes[1] === 'prazo' ? (v || null) : v; if (partes[1] === 'lgpd') f.lgpdEm = v ? new Date().toISOString() : null; }
  else if (partes[0] === 'div') f.dividas[+partes[1]][partes[2]] = v;
  else if (partes[0] === 'obj') f.objetivos[+partes[1]][partes[2]] = partes[2] === 'prazo' ? (v || null) : v;
  else F.dados[campo] = v;
  if (campo === 'nome' && F.erro && String(v).trim()) { F.erro = ''; t.removeAttribute('aria-invalid'); $('#fcErro')?.remove(); }
  if (campo === 'f.nascimento') { const a = idadeDe(v); $('#fcIdade').textContent = a != null ? a + ' anos' : ''; }
  if (partes[0] === 'obj') { const r = $('#obR' + partes[1]); if (r) r.innerHTML = textoGuardar(f.objetivos[+partes[1]]); }
}

function fichaClique(a, el) {
  const F = E.ficha, f = F.f;
  if (a === 'fc-chip') {
    const campo = el.dataset.campo, raw = el.dataset.valor;
    if (campo === 'formaRenda') f.formaRenda = f.formaRenda === raw ? null : raw;
    else if (campo === 'dependentes') f.dependentes = f.dependentes === Number(raw) ? null : Number(raw);
    else if (campo === 'semDividas') { f.semDividas = !f.semDividas; if (f.semDividas) f.dividas = []; }
    else if (campo === 'divida') {
      const k = f.dividas.findIndex(x => x.tipo === raw);
      if (k >= 0) f.dividas.splice(k, 1); else { f.dividas.push({ tipo: raw, saldo: null, parcela: null, parcelasRestantes: null }); f.semDividas = false; }
    }
    desenharFicha(); return;
  }
  if (a === 'fc-obj') {
    const tipo = el.dataset.tipo, k = f.objetivos.findIndex(o => o.tipo === tipo);
    if (k >= 0) f.objetivos.splice(k, 1);
    else if (f.objetivos.length < 3) f.objetivos.push({ tipo, descricao: FC_OBJ.find(t => t[0] === tipo)[1], valor: null, prazo: null });
    desenharFicha(); return;
  }
  if (a === 'fc-passo') { irPassoFicha(+el.dataset.p); return; }
  if (a === 'fc-voltar') { irPassoFicha(F.passo - 1); return; }
  if (a === 'fc-seguir') { irPassoFicha(F.passo + 1); return; }
  if (a === 'fc-concluir') { salvarFicha(!!el.dataset.sair); return; }
}

function irPassoFicha(n) {
  const F = E.ficha;
  if (n > 0 && F.passo === 0 && !F.dados.nome.trim()) { F.erro = 'Informe o nome do cliente para continuar.'; desenharFicha(); return; }
  F.passo = Math.max(0, Math.min(3, n)); F.erro = '';
  desenharFicha(); window.scrollTo(0, 0);
}

async function salvarFicha(sair) {
  const F = E.ficha, d = F.dados;
  if (!d.nome.trim()) { F.passo = 0; F.erro = 'Informe o nome do cliente.'; desenharFicha(); return; }
  if (d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) { F.passo = 0; desenharFicha(); toast('E-mail inválido. Confira no passo 1.', true); $('#fcEmail')?.focus(); return; }
  const objetivosTxt = F.f.objetivos.map(o => o.descricao || FC_OBJ.find(t => t[0] === o.tipo)?.[1]).filter(Boolean).join(', ');
  const corpo = { ...d, nome: d.nome.trim(), objetivo: objetivosTxt || null, ficha: F.f };
  document.querySelectorAll('[data-acao="fc-concluir"]').forEach(b => { b.disabled = true; });
  try {
    if (F.id) {
      const r = await api('PATCH', '/api/app/clientes/' + F.id, corpo);
      if (E.cli?.cliente?.id === F.id) E.cli.cliente = r.cliente;
      E.planoEdit = null;
      toast('Ficha salva');
      location.hash = '#/cliente/' + F.id + '/' + (E.aba || 'conta');
      if (sair) return;
    } else {
      const r = await api('POST', '/api/app/clientes', corpo);
      E.clientes = null;
      toast('Cliente cadastrado');
      location.hash = '#/cliente/' + r.cliente.id + '/conta';
    }
  } catch (e) {
    toast(e.message, true);
    document.querySelectorAll('[data-acao="fc-concluir"]').forEach(b => { b.disabled = false; });
  }
}

    <label class="rot">O que é este documento?</label>
    <div class="opcoes-tipo">
      <button type="button" class="opcao-tipo ${tipo === 'extrato' ? 'on' : ''}" data-tipo="extrato"><span class="ic conta"><i class="ti ti-building-bank"></i></span><span><b>Extrato da conta</b><br><small class="suave">Conta corrente ou poupança</small></span></button>
      <button type="button" class="opcao-tipo ${tipo === 'fatura' ? 'on' : ''}" data-tipo="fatura"><span class="ic cartao"><i class="ti ti-credit-card"></i></span><span><b>Fatura do cartão</b><br><small class="suave">Cartão de crédito (Itaú)</small></span></button>
    </div>
    <div style="margin-top:14px"><label class="rot" for="dArq">Arquivo</label><input id="dArq" type="file" accept="application/pdf,image/*"></div>
    <div id="dSenhaBox" class="oculto" style="margin-top:14px"><label class="rot" for="dSenha">Senha do PDF</label><input id="dSenha" type="password" autocomplete="off"></div>
    <div class="progresso oculto" id="dProg"><div></div></div>
    <div class="suave" id="dStatus" style="font-size:13px;margin-top:8px;min-height:18px"></div>
    <div class="erro-txt" id="dErro" role="alert"></div>
    <div class="acoes"><button class="btn" data-acao="fechar-modal" id="dCancelar">Fechar</button><button class="btn primario" id="dEnviar"><i class="ti ti-upload"></i> Enviar e analisar</button></div>`);
  document.querySelectorAll('.opcao-tipo').forEach(b => b.onclick = () => { tipo = b.dataset.tipo; document.querySelectorAll('.opcao-tipo').forEach(x => x.classList.toggle('on', x === b)); $('#dErro').textContent = ''; });
  $('#dArq').onchange = () => { $('#dErro').textContent = ''; };
  $('#dEnviar').onclick = async () => {
    const arq = $('#dArq').files[0];
    if (!tipo) { $('#dErro').textContent = 'Escolha se é extrato da conta ou fatura do cartão.'; return; }
    if (!arq) { $('#dErro').textContent = 'Escolha o arquivo.'; return; }
    const fd = new FormData(); fd.append('file', arq); fd.append('tipoDocumento', tipo);
    if ($('#dSenha').value) fd.append('password', $('#dSenha').value);
    $('#dEnviar').disabled = true; $('#dErro').textContent = ''; $('#dProg').classList.remove('oculto');
    const barra = p => { $('#dProg').firstElementChild.style.width = p + '%'; };
    barra(5); $('#dStatus').textContent = 'Enviando…';
    const inicio = Date.now();
    try {
      const { jobId } = await api('POST', `/api/app/clientes/${E.cli.cliente.id}/documentos`, fd);
      for (;;) {
        await new Promise(r => setTimeout(r, 2000));
        const j = await api('GET', '/api/app/jobs/' + encodeURIComponent(jobId));
        const seg = Math.round((Date.now() - inicio) / 1000);
        if (j.status === 'processing') {
          const p = j.progress;
          barra(p?.chunksTotal ? 10 + 85 * p.chunksCompleted / p.chunksTotal : Math.min(85, 10 + seg));
          $('#dStatus').textContent = `Lendo com IA… ${seg}s` + (p?.chunksTotal > 1 ? ` (parte ${p.chunksCompleted} de ${p.chunksTotal})` : '');
          continue;
        }
        if (j.status === 'error') {
          if (j.errorCode === 'PDF_PASSWORD_REQUIRED' || j.errorCode === 'PDF_PASSWORD_INCORRECT') {
            $('#dSenhaBox').classList.remove('oculto'); $('#dSenha').focus();
          }
          throw new Error(j.error);
        }
        barra(100); $('#dStatus').textContent = 'Pronto!';
        fecharModal();
        if (j.result?.qualidadeRuim) toast('Documento salvo, mas a leitura ficou incompleta: confira os lançamentos.', true); else toast('Documento analisado e salvo');
        E.aba = tipo === 'fatura' ? 'cartao' : 'conta';
        location.hash = `#/cliente/${E.cli.cliente.id}/${E.aba}`;
        await telaCliente(E.cli.cliente.id, true);
        return;
      }
    } catch (e) {
      $('#dErro').textContent = e.message; $('#dEnviar').disabled = false; $('#dProg').classList.add('oculto'); $('#dStatus').textContent = '';
    }
  };
}

// ─── Exportar ────────────────────────────────────────────────────────────
function modalExportar() {
  const cl = lancs().filter(classificavel);
  const pendConta = cl.filter(l => l.origem === 'extrato' && !l.classe).length;
  const pendCartao = cl.filter(l => l.origem === 'fatura' && !l.classe).length;
  const pm = E.cli.apuracao.resumo.parcelamentos?.porMes || [];
  const temParcelas = pm.length > 1;
  abrirModal(`<h2>Exportar para Excel</h2><p class="suave" style="margin:0 0 16px">Escolha o formato.</p>
    <div style="border:2px solid var(--preto);border-radius:12px;padding:14px;margin-bottom:10px">
      <div style="display:flex;gap:12px;align-items:flex-start"><span class="ic cartao"><i class="ti ti-table"></i></span>
        <div style="flex:1"><b>Planilha da consultoria</b><div class="suave" style="font-size:13px;margin:2px 0 8px">O modelo da consultoria preenchido: custo fixo, custo variável, investimentos, entradas, cartão parcelado e cartão à vista, em cada mês. Todos os lançamentos entram; se faltar linha num bloco, a aba ganha linhas (fórmulas ajustadas).</div>
          ${pendConta ? `<div class="alerta" style="margin:0 0 8px"><i class="ti ti-alert-triangle"></i><span>${pendConta} lançamento(s) da <b>conta</b> ainda estão "a classificar" e não vão para a planilha. <button class="btn" data-acao="ir-pendentes" data-aba="conta" style="padding:2px 8px;font-size:12px">Classificar agora</button></span></div>` : ''}
          ${pendCartao ? `<div class="alerta" style="margin:0 0 8px"><i class="ti ti-alert-triangle"></i><span>${pendCartao} compra(s) do <b>cartão</b> (à vista ou parcelas) ainda estão "a classificar" e não vão para a planilha. <button class="btn" data-acao="ir-pendentes" data-aba="cartao" style="padding:2px 8px;font-size:12px">Classificar agora</button></span></div>` : ''}
          ${!pendConta && !pendCartao && cl.length ? '<div class="pill verde" style="margin-bottom:8px"><i class="ti ti-check"></i> Tudo classificado</div>' : ''}
          ${temParcelas ? `<div class="suave" style="font-size:13px;margin-bottom:10px"><i class="ti ti-calendar-repeat"></i> As parcelas do cartão entram em <b>todos os meses até a última</b> (${nomeMesCurto(pm[pm.length - 1].mes)}), sempre no bloco "Cartão parcelado", classificadas ou não. Meses de outro ano ganham abas novas copiadas do modelo.</div>` : ''}
          <div id="xGrupos" class="suave" style="font-size:13px;margin-bottom:10px"><i class="ti ti-loader-2"></i> Procurando lançamentos com o mesmo nome…</div>
          <button class="btn primario" data-acao="baixar" data-tipo="consultoria"><i class="ti ti-download"></i> Baixar planilha da consultoria</button></div></div>
      <div id="xResultado"></div>
    </div>
    <div style="border:1px solid var(--borda);border-radius:12px;padding:14px">
      <div style="display:flex;gap:12px;align-items:flex-start"><span class="ic conta"><i class="ti ti-file-spreadsheet"></i></span>
        <div style="flex:1"><b>Excel detalhado do Mirror</b><div class="suave" style="font-size:13px;margin:2px 0 8px">Todos os lançamentos com categoria, subcategoria, situação, observação e a conferência das faturas.</div>
          <button class="btn" data-acao="baixar" data-tipo="mirror"><i class="ti ti-download"></i> Baixar Excel detalhado</button></div></div>
    </div>
    <div class="acoes"><button class="btn" data-acao="fechar-modal">Fechar</button></div>`);
  carregarGrupos();
}

// Lançamentos com o mesmo nome (mesmo mês e bloco) que podem virar uma linha só
async function carregarGrupos() {
  const el = $('#xGrupos'); if (!el) return;
  let grupos = [];
  try { grupos = (await api('GET', `/api/app/analises/${E.cli.analise.id}/planilha/grupos`)).grupos || []; } catch { el.innerHTML = ''; return; }
  E.grupos = grupos;
  if (!grupos.length) { el.innerHTML = '<i class="ti ti-list-details"></i> Todos os lançamentos entram um por linha (não há nomes repetidos no mesmo mês).'; return; }
  const tot = grupos.reduce((a, g) => a + g.quantidade, 0);
  el.innerHTML = `<div class="juntar">
    <label class="juntar-cab"><input type="checkbox" id="xJuntar" checked data-acao="juntar-todos"> <span><b>Juntar lançamentos com o mesmo nome</b><br>
      <span class="fraco">${grupos.length} nome(s) se repetem: ${tot} lançamentos viram ${grupos.length} linha(s), com a soma. A etiqueta (comentário) da célula lista cada um.</span></span></label>
    <div class="juntar-lista">${grupos.map(g => `<label class="juntar-item" title="${esc(g.itens.map(i => dataBR(i.data) + '  ' + brl(i.valor)).join('\n'))}">
      <input type="checkbox" class="xGrupo" value="${esc(g.chave)}" checked>
      <span class="nome">${esc(g.nome)}</span>
      <span class="qtd">${g.quantidade}x</span>
      <span class="num">${brl(g.total)}</span>
      <span class="fraco meses">${g.meses.map(nomeMesCurto).join(', ')}</span></label>`).join('')}</div>
    <div class="fraco" style="font-size:12px;margin-top:6px">Desmarque o que deve continuar separado. Tudo aparece na planilha: se um bloco não couber, a aba ganha linhas.</div>
  </div>`;
}

// ─── Modal genérico ──────────────────────────────────────────────────────
function abrirModal(html) {
  fecharModal();
  const f = document.createElement('div');
  f.className = 'fundo-modal'; f.id = 'fundoModal';
  f.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  f.addEventListener('mousedown', ev => { if (ev.target === f && !document.querySelector('#dEnviar:disabled')) fecharModal(); });
  document.body.appendChild(f);
}
function fecharModal() { const f = $('#fundoModal'); if (f) f.remove(); }
// Ícones são decorativos: esconde dos leitores de tela
new MutationObserver(() => document.querySelectorAll('i.ti:not([aria-hidden])').forEach(i => i.setAttribute('aria-hidden', 'true'))).observe(document.body, { childList: true, subtree: true });
// Elementos clicáveis que não são <button> (linha de cliente, logo, legenda) também respondem ao teclado
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target instanceof HTMLElement && ev.target.matches('[data-acao][tabindex]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { fecharMenus(); if (!document.querySelector('#dEnviar:disabled')) fecharModal(); } });

// ════════════════════════════════════════════════════════════════════════
// Eventos (delegação)
// ════════════════════════════════════════════════════════════════════════
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-acao]');
  if (!el) { if (!ev.target.closest('.menu-sit,.menu-usuario')) fecharMenus(); return; }
  const a = el.dataset.acao, id = el.dataset.id;
  if (!['menu-sit', 'menu-usuario', 'menu-cls', 'menu-cls-lote'].includes(a) && !el.closest('.menu-sit,.menu-usuario')) fecharMenus();
  switch (a) {
    case 'ir-clientes': location.hash = '#/clientes'; break;
    case 'cat-cartao': E.catCartao = el.dataset.cat || null; desenharConteudo(); if (E.catCartao) document.querySelector('.fatura-cab')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'filtro-carteira': E.filtroCarteira = el.dataset.f; desenharClientes(); break;
    case 'abrir-cliente': location.hash = '#/cliente/' + id + '/conta'; break;
    case 'novo-cliente': location.hash = '#/cliente/novo'; break;
    case 'editar-perfil': location.hash = '#/cliente/' + E.cli.cliente.id + '/ficha'; break;
    case 'fc-chip': case 'fc-obj': case 'fc-passo': case 'fc-voltar': case 'fc-seguir': case 'fc-concluir': fichaClique(a, el); break;
    case 'fechar-modal': fecharModal(); break;
    case 'menu-usuario': {
      if (document.querySelector('.menu-usuario')) { fecharMenus(); break; }
      const m = document.createElement('div'); m.className = 'menu-usuario';
      m.innerHTML = `<div style="padding:8px 10px 10px;border-bottom:1px solid var(--borda2);margin-bottom:4px"><b>${esc(sessao?.usuario?.nome)}</b><div class="suave" style="font-size:12px">${esc(sessao?.usuario?.email)}</div></div><button data-acao="ir-clientes"><i class="ti ti-users"></i> Clientes</button><button data-acao="tema"><i class="ti ${temaEscuro() ? 'ti-sun' : 'ti-moon'}"></i> ${temaEscuro() ? 'Modo claro' : 'Modo escuro'}</button><button data-acao="sair"><i class="ti ti-logout"></i> Sair</button>`;
      document.body.appendChild(m); break;
    }
    case 'tema': alternarTema(); if ($('#apSvg')) atualizarSimulacao(); break;
    case 'imprimir': window.print(); break;
    case 'ap-anos': E.ap.anos = +el.dataset.anos; document.querySelectorAll('[data-acao="ap-anos"]').forEach(b => b.setAttribute('aria-pressed', b === el)); atualizarSimulacao(); break;
    case 'plano-salvar': salvarPlano(E.planoEdit); break;
    case 'plano-sugerido': if (confirm('Descartar o plano salvo e voltar ao sugerido pela análise?')) salvarPlano(null); break;
    case 'plano-remover': E.planoEdit.cortes.splice(+el.dataset.k, 1); desenharConteudo(); break;
    case 'plano-adicionar': {
      const usadas = new Set(E.planoEdit.cortes.map(c => c.categoria));
      const livre = E.cli.plano.base.mediaPorCategoria.find(c => !FORA_DO_PLANO.has(c.categoria) && !usadas.has(c.categoria) && TITULOS_CORTE[c.categoria])
        || E.cli.plano.base.mediaPorCategoria.find(c => !FORA_DO_PLANO.has(c.categoria) && !usadas.has(c.categoria));
      if (!livre) { toast('Não há outra categoria com gasto para incluir.', true); break; }
      E.planoEdit.cortes.push({ categoria: livre.categoria, percentual: 20, titulo: tituloDoCorte(livre.categoria), texto: '' });
      desenharConteudo(); break;
    }
    case 'sair': salvarSessao(null); E.cli = null; E.clientes = null; E.painel = null; location.hash = '#/login'; break;
    case 'aba': E.aba = el.dataset.aba; E.sel.clear(); history.replaceState(null, '', `#/cliente/${E.cli.cliente.id}/${E.aba}`); desenharCliente(); break;
    case 'mes': E.mesSel = el.dataset.mes || null; desenharConteudo(); break;
    case 'mix': E.modoMix = el.dataset.modo; desenharConteudo(); break;
    case 'filtro': E.filtroCat[el.dataset.cat] = !E.filtroCat[el.dataset.cat]; if (E.aba !== 'conta') { E.aba = 'conta'; desenharCliente(); } else desenharConteudo(); break;
    case 'filtro-limpar': E.filtroCat = {}; desenharConteudo(); break;
    case 'sel': ev.target.checked ? E.sel.add(id) : E.sel.delete(id); desenharConteudo(); break;
    case 'sel-mes': {
      const busca = (E.busca[el.dataset.mes] || '').toLowerCase();
      const filtro = Object.keys(E.filtroCat).filter(k => E.filtroCat[k]);
      const base = E.aba === 'conta' ? lancs().filter(l => l.origem === 'extrato') : lancs();
      const alvo = base.filter(l => mesDe(l) === el.dataset.mes && (!busca || (l.descricao + ' ' + l.categoria + ' ' + (l.subcategoria || '')).toLowerCase().includes(busca)) && (E.aba !== 'conta' || !filtro.length || filtro.includes(l.categoria)));
      alvo.forEach(l => ev.target.checked ? E.sel.add(l.id) : E.sel.delete(l.id)); desenharConteudo(); break;
    }
    case 'sel-lista': (el.dataset.ids || '').split(',').filter(Boolean).forEach(i => ev.target.checked ? E.sel.add(i) : E.sel.delete(i)); desenharConteudo(); break;
    case 'lote-limpar': E.sel.clear(); desenharConteudo(); break;
    case 'lote-sit': { const ids = [...E.sel]; E.sel.clear(); aplicarAjustes(ids.map(i => ({ id: i, situacao: el.dataset.sit }))); break; }
    case 'lote-cat': editarLancamentos([...E.sel]); break;
    case 'editar': editarLancamentos([id], el.dataset.foco); break;
    case 'menu-sit': ev.stopPropagation(); menuSituacao(el, id); break;
    case 'sit-escolher': fecharMenus(); aplicarAjustes([{ id, situacao: el.dataset.sit }]); break;
    case 'sit-rapida': aplicarAjustes([{ id, situacao: el.dataset.sit }]); break;
    case 'ver-conf': $('#conf-' + id)?.classList.toggle('oculto'); break;
    case 'menu-cls': ev.stopPropagation(); menuClasse(el, [id]); break;
    case 'menu-cls-lote': {
      ev.stopPropagation();
      const ids = [...E.sel].filter(i => { const l = lancs().find(x => x.id === i); return l && classificavel(l); });
      if (!ids.length) { toast('Selecione lançamentos que estejam no resumo (parcelas do cartão já vão sozinhas para a planilha).', true); break; }
      menuClasse(el, ids); break;
    }
    case 'cls-escolher': {
      fecharMenus();
      const ids = (el.dataset.ids || '').split(',').filter(Boolean);
      if (ids.length > 1) E.sel.clear();
      aplicarAjustes(ids.map(i => ({ id: i, classe: el.dataset.cls || null })));
      break;
    }
    case 'juntar-todos': el.closest('.juntar')?.classList.toggle('off', !el.checked); break;
    case 'so-pendentes': E.soPendentes = !E.soPendentes; desenharConteudo(); break;
    case 'ir-pendentes': { fecharModal(); E.soPendentes = true; E.mesSel = null;
      const destino = el.dataset.aba || 'conta';
      if (E.aba !== destino) { E.aba = destino; history.replaceState(null, '', `#/cliente/${E.cli.cliente.id}/${destino}`); desenharCliente(); } else desenharConteudo(); window.scrollTo({ top: 0 }); break; }
    case 'cal-mes': E.calMes = el.dataset.mes && el.dataset.mes !== E.calMes ? el.dataset.mes : null; desenharConteudo(); break;
    case 'ordem-parc': E.ordemParc = el.dataset.ordem; { const d = document.querySelector('.card details'); const aberto = d?.open; desenharConteudo(); if (aberto) document.querySelector('.card details').open = true; } break;
    case 'novo-doc': modalDocumento(el.dataset.tipo); break;
    case 'excluir-doc': {
      const d = E.cli.documentos.find(x => x.id === id);
      if (!confirm(`Excluir ${d.tipo === 'extrato' ? 'o extrato' : 'a fatura'} ${d.banco || ''}? Os ajustes feitos nos lançamentos dele também serão apagados.`)) break;
      try { await api('DELETE', '/api/app/documentos/' + id); toast('Documento excluído'); await telaCliente(E.cli.cliente.id, true); } catch (e) { toast(e.message, true); }
      break;
    }
    case 'excel': modalExportar(); break;
    case 'baixar': {
      el.disabled = true; const txt = el.innerHTML; el.innerHTML = '<i class="ti ti-loader-2"></i> Gerando…';
      try {
        const consultoria = el.dataset.tipo === 'consultoria';
        let q = '';
        if (consultoria && $('#xJuntar')?.checked) {
          const separar = [...document.querySelectorAll('.xGrupo')].filter(c => !c.checked).map(c => c.value);
          q = '?juntar=1' + (separar.length ? '&separar=' + encodeURIComponent(separar.join('|')) : '');
        }
        const rota = consultoria ? `/api/app/analises/${E.cli.analise.id}/planilha${q}` : `/api/app/analises/${E.cli.analise.id}/excel`;
        const r = await api('GET', rota, undefined, { blob: true });
        const nome = decodeURIComponent((r.headers.get('content-disposition') || '').match(/filename\*=UTF-8''([^;]+)/)?.[1] || 'mirror.xlsx');
        const url = URL.createObjectURL(await r.blob());
        const a2 = document.createElement('a'); a2.href = url; a2.download = nome; document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        if (consultoria) {
          let info = {}; try { info = JSON.parse(decodeURIComponent(r.headers.get('x-mirror-resumo') || '%7B%7D')); } catch {}
          const linhas = [`<p style="margin:0 0 8px"><b>${info.linhas || 0}</b> linha(s) preenchidas em: ${(info.meses || []).map(nomeMesCurto).join(', ') || '—'}${info.mesesProjetados?.length ? ` · parcelas projetadas em ${info.mesesProjetados.map(nomeMesCurto).join(', ')}` : ''}.</p>`];
          if (info.aClassificar) linhas.push(`<p style="margin:0 0 8px;color:var(--vermelho)"><i class="ti ti-alert-triangle"></i> ${info.aClassificar} lançamento(s) da conta ainda "a classificar" ficaram fora.</p>`);
          if (info.aClassificarCartao) linhas.push(`<p style="margin:0 0 8px;color:var(--vermelho)"><i class="ti ti-alert-triangle"></i> ${info.aClassificarCartao} compra(s) do cartão (à vista ou parcelas) ainda "a classificar" ficaram fora.</p>`);
          (info.linhasExtras || []).forEach(x => linhas.push(`<p style="margin:0 0 8px" class="suave">${esc(x.aba)}: ganhou ${x.quantidade} linha(s) para caber todos os lançamentos.</p>`));
          if (info.juntados) linhas.push(`<p style="margin:0 0 8px" class="suave">${info.juntados} linha(s) com nomes repetidos somados (detalhe no comentário de cada célula).</p>`);
          (info.agrupados || []).forEach(g => linhas.push(`<p style="margin:0 0 8px" class="suave">${esc(g.aba)} · ${esc(g.bloco)}: não coube tudo; ${g.quantidade} lançamento(s) foram somados na linha "Outros" (a lista está no comentário da célula).</p>`));
          (info.avisos || []).forEach(a => linhas.push(`<p style="margin:0 0 8px" class="suave">${esc(a)}</p>`));
          $('#xResultado').innerHTML = `<div class="alerta azul" style="display:block;margin-top:14px">${linhas.join('')}</div>`;
        } else fecharModal();
      } catch (e) { toast(e.message, true); }
      el.disabled = false; el.innerHTML = txt; break;
    }
    case 'status': {
      try { await api('PATCH', '/api/app/analises/' + E.cli.analise.id, { status: el.dataset.status }); E.cli.analise.status = el.dataset.status; desenharCliente(); toast(el.dataset.status === 'concluida' ? 'Análise concluída' : 'Análise reaberta'); }
      catch (e) { toast(e.message, true); }
      break;
    }
  }
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset?.acao !== 'busca-mes') return;
  E.busca[el.dataset.mes] = el.value;
  const pos = el.selectionStart, chave = el.dataset.mes;
  desenharConteudo();
  const novo = document.querySelector(`[data-acao="busca-mes"][data-mes="${chave}"]`);
  if (novo) { novo.focus(); novo.setSelectionRange(pos, pos); }
});

rotear();
})();
</script>
