<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<script>try{var t=localStorage.getItem('mirror.tema');if(t==="escuro"||t==="claro")document.documentElement.dataset.tema=t}catch(e){}</script>
<title>TRIAD Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Dees Mirror — visual "Relatório"
   Papel branco, tinta verde-escura, títulos e números em serifa (Newsreader),
   texto em Public Sans. Marca-texto amarelo só no que falta revisar.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --tinta:#1C2420;--tinta2:#2A332E;--tinta3:#3A453F;--tinta-texto:#A9B3AD;
  --primaria:#0F5A3F;--primaria-escura:#0A3F2C;
  /* nomes antigos, mantidos para o JS e os estilos inline */
  --preto:var(--tinta);--preto2:var(--tinta2);--preto3:var(--tinta3);
  --amarelo:var(--primaria);--amarelo-claro:#FFF3C2;--amarelo-fundo:#FFF9E3;--marca:#FFE680;
  --fundo:#FFFFFF;--branco:#ffffff;--borda:#E4E7E4;--borda2:#EEF0EE;--linha-hover:#F7F8F7;
  --texto:#1C2420;--suave:#4D5550;--fraco:#6B736E;--apagado:#A9AFAB;
  --verde:#0F5A3F;--verde-fundo:#E5F0EA;--verde-borda:#C3DCCD;--verde-claro:#0F5A3F;
  --vermelho:#B03A2E;--vermelho-fundo:#FBEAE7;
  --azul:#2F5D8A;--azul-fundo:#EBF1F7;--azul-borda:#CCDAE8;--marrom:#5C4A00;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --r-ctrl:3px;--r-painel:4px;
  --foco:0 0 0 3px rgba(15,90,63,.28);
  --primaria-texto:#0F5A3F;--borda-forte:#C9CEC9;--sel-fundo:#FFFBEA;--alerta-borda:#E3C341;--alerta-texto:#3D3300;--aviso-texto:#203F5E;
  --marca-hover:#FFDB4D;--cal-barra:#8FB8A5;--tinta-hover:#4A5650;--investimento:#3B6D11;--cartao-vista:#6B2D8A;--sombra-rgb:28,36,32;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--foco);border-radius:3px}
.oculto{display:none!important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";white-space:nowrap}
.suave{color:var(--suave)}.fraco{color:var(--fraco)}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:2px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.amarelo{background:var(--marca);color:var(--texto)}.pill.verde{background:var(--verde-fundo);color:var(--verde)}
.pill.cinza{background:var(--borda2);color:var(--suave)}.pill.vermelho{background:var(--vermelho-fundo);color:var(--vermelho)}.pill.azul{background:var(--azul-fundo);color:var(--azul)}
.btn{border:1px solid var(--borda-forte);background:var(--branco);border-radius:var(--r-ctrl);padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background-color .15s}
.btn:hover{border-color:var(--texto)}
.btn.primario{background:var(--primaria);border-color:var(--primaria);color:#fff}
.btn.primario:hover{background:var(--primaria-escura);border-color:var(--primaria-escura)}
.btn.escuro{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.perigo{color:var(--vermelho)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=tel],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid var(--borda-forte);border-radius:var(--r-ctrl);padding:9px 11px;background:var(--branco);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primaria);box-shadow:var(--foco)}
input[type=checkbox]{accent-color:var(--primaria);width:15px;height:15px}
label.rot{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
.erro-txt{color:var(--vermelho);font-size:13px;margin-top:8px;min-height:18px}
::selection{background:var(--marca)}

/* topo */
.topo{background:var(--branco);color:var(--texto);height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--borda)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;cursor:pointer}
.logo i.q{width:13px;height:13px;border-radius:2px;background:var(--primaria);display:inline-block}
.logo span{color:var(--fraco);font-weight:500}
.logo-img{height:36px;width:auto;display:block}
.logo-img.grande{height:64px}
.topo .dir{display:flex;align-items:center;gap:14px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primaria);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:0}
.menu-usuario{position:absolute;right:32px;top:56px;background:var(--branco);color:var(--texto);border:1px solid var(--borda);border-radius:var(--r-painel);padding:6px;min-width:230px;box-shadow:0 12px 32px rgba(var(--sombra-rgb),.12);z-index:30}
.menu-usuario button{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:3px}
.menu-usuario button:hover{background:var(--linha-hover)}
.salvo{font-size:12px;color:var(--fraco);display:flex;align-items:center;gap:5px}
.salvo .ti-check{color:var(--verde)!important}

main{max-width:1320px;margin:0 auto;padding:32px 32px 120px}
.card{background:var(--branco);border:1px solid var(--borda);border-radius:var(--r-painel)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login .esq{background:var(--branco);color:var(--texto);padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--borda)}
.login .esq h1{font-size:60px;line-height:1.02;margin:0 0 22px;font-weight:500;letter-spacing:-.02em;max-width:14ch}
.login .esq h1 em{color:inherit;font-style:normal}
.login .esq p{color:var(--suave);line-height:1.6;max-width:44ch;margin:0;font-size:18px}
.login .dir{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--branco)}
.login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px;border:1px solid var(--borda);border-radius:var(--r-painel);padding:40px}
.login form h2{font-size:32px!important;font-weight:500!important}
.login form input[type=email],.login form input[type=password]{border:0;border-bottom:2px solid var(--texto);border-radius:0;padding:10px 0;font-size:16px;background:none}
.login form input:focus{box-shadow:none;border-bottom-color:var(--primaria)}
.login form .btn.primario{padding:14px!important;font-size:15px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .esq{padding:28px;min-height:auto;gap:28px;border-right:0;border-bottom:1px solid var(--borda)}.login .esq h1{font-size:38px}.login form{border:0;padding:8px}}

/* clientes */
.cab-pagina{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:0;padding-bottom:20px;border-bottom:2px solid var(--texto)}
.cab-pagina h1{font-size:44px;margin:0;line-height:1.05}
.cab-pagina + .card{border:0;border-radius:0}
.tabela-clientes{width:100%;border-collapse:collapse}
.painel-grade{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1100px){.painel-grade{grid-template-columns:1fr}}
.tabela-clientes.carteira th,.tabela-clientes.carteira td{padding-left:16px}
.tabela-clientes.carteira td{padding-top:14px;padding-bottom:14px}
.tabela-clientes.carteira td b{font-size:18px}
.tabela-clientes .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabela-ev{width:100%;border-collapse:collapse;font-size:13px}
.tabela-ev th{text-align:left;font-size:12px;color:var(--fraco);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--borda);white-space:nowrap}
.tabela-ev td{padding:9px 10px;border-bottom:1px solid var(--borda2);vertical-align:top}
.tabela-ev .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-d{display:block;font-size:11px;font-weight:600}
.ev-barra{display:block;height:8px;background:var(--borda2);border-radius:2px;margin-top:5px}
.ev-barra span{display:block;height:100%;background:var(--primaria);border-radius:2px}
.g-grade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;margin-bottom:14px}
@media (max-width:1000px){.g-grade{grid-template-columns:1fr}}
.g-card{padding:16px 18px}
body{--g-claro:color-mix(in srgb,var(--primaria) 45%,var(--branco));--g-fundo:color-mix(in srgb,var(--primaria) 12%,var(--branco))}
.g-tit{font-family:var(--serif);font-size:24px;font-weight:500}
.g-lead{margin:4px 0 12px;color:var(--suave);font-size:14px}
.g-stack{display:flex;gap:2px;height:28px;margin-bottom:10px}.g-stack span{display:block;height:100%}
.g-stack span:first-child{border-radius:4px 0 0 4px}.g-stack span:last-child{border-radius:0 4px 4px 0}
.g-leg div{display:grid;grid-template-columns:14px minmax(0,1fr) auto 38px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.g-leg i{width:12px;height:12px;border-radius:2px;display:block}.g-leg em{font-style:normal;color:var(--fraco);text-align:right}
.g-leg.h{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:4px}.g-leg.h div{display:flex;gap:7px}
.g-leg i.hach{background:repeating-linear-gradient(45deg,var(--g-claro) 0 3px,var(--g-fundo) 3px 6px)}
.g-sub{font-size:12px;font-weight:600;color:var(--fraco);margin:14px 0 4px}
.g-bar{display:grid;grid-template-columns:170px minmax(0,1fr) 100px 38px;gap:10px;align-items:center;font-size:13px;width:100%;background:none;border:0;padding:4px 6px;margin:0 -6px;border-radius:4px;text-align:left;color:var(--texto);cursor:pointer;font:inherit;font-size:13px}
.g-bar:hover:not([disabled]),.g-bar.on{background:var(--linha-hover)}.g-bar[disabled]{cursor:default}
.g-bar.mini{grid-template-columns:150px minmax(0,1fr) 92px;cursor:default;padding:3px 0;margin:0}
.g-bar .rot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.g-bar .num{text-align:right}.g-bar .pct{text-align:right;color:var(--fraco);font-size:12px}
.g-bar .trilho{height:12px;background:var(--borda2);border-radius:2px;overflow:hidden}.g-bar .trilho span{display:block;height:100%;background:var(--primaria);border-radius:0 4px 4px 0}
.g-bar.on .trilho span{background:var(--texto)}
.g-svg{width:100%;height:auto;display:block;overflow:visible}
.g-linha{max-width:1200px;margin-top:10px}
.g-svg .g-grid{stroke:var(--borda);stroke-width:1}.g-svg .g-eixo{font-size:11px;fill:var(--fraco)}.g-svg .g-eixo.forte{fill:var(--texto);font-weight:700}
.g-svg .g-val{font-size:11px;font-weight:600;fill:var(--texto)}
.prod{padding:16px 18px}
.prod-cab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prod-cab b{font-family:var(--serif);font-weight:500;font-size:20px}
.prod-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:14px}
.prod-grade small{display:block;color:var(--fraco);font-size:12px;margin-bottom:2px}
.prod-grade b{font-family:var(--serif);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.prod-grade .fraco{display:block;font-size:11px}
.prod-barras{display:flex;align-items:flex-end;gap:8px;margin-bottom:8px}
.prod-barras>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:96px}
.prod-barras .b{width:100%;max-width:26px;background:var(--primaria);border-radius:2px 2px 0 0}
.prod-barras .v{font-size:11px;font-weight:600;color:var(--suave)}
.prod-barras .m{font-size:11px;color:var(--fraco);border-top:1px solid var(--borda);width:100%;text-align:center;padding-top:3px}
.tabela-clientes th{text-align:left;font-size:12px;color:var(--fraco);font-weight:600;padding:12px 16px 12px 0;border-bottom:1px solid var(--borda)}
.tabela-clientes td{padding:20px 16px 20px 0;border-bottom:1px solid var(--borda);vertical-align:middle}
.tabela-clientes td b{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.01em}
.tabela-clientes tr.linha{cursor:pointer}
.tabela-clientes tr.linha:hover td,.tabela-clientes tr.linha:focus-visible td{background:var(--linha-hover)}
.tabela-clientes tr.linha:hover b{color:var(--primaria-texto)}
.tabela-clientes tr.linha:focus-visible{box-shadow:inset 3px 0 0 var(--primaria)}
.ini{width:40px;height:40px;border-radius:50%;background:var(--verde-fundo);color:var(--primaria-texto);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.vazio{padding:56px 20px;text-align:center}
.vazio h2{margin:0 0 6px;font-size:26px}
.vazio p{max-width:46ch;margin:0 auto 16px}

/* modal */
.fundo-modal{position:fixed;inset:0;background:rgba(var(--sombra-rgb),.45);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px;z-index:50;overflow:auto}
.modal{background:var(--branco);border-radius:var(--r-painel);width:100%;max-width:560px;padding:28px;box-shadow:0 24px 64px rgba(var(--sombra-rgb),.25)}
.modal h2{margin:0 0 4px;font-size:28px}
.modal .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grade2{grid-template-columns:1fr}}
.opcoes-tipo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opcao-tipo{border:1px solid var(--borda);border-radius:var(--r-painel);padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;background:var(--branco);text-align:left}
.opcao-tipo.on{border:2px solid var(--primaria);padding:11px}
.ic{width:34px;height:34px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.ic.conta{background:var(--azul-fundo);color:var(--azul)}.ic.cartao{background:var(--amarelo-claro);color:var(--marrom)}.ic.tudo{background:var(--verde-fundo);color:var(--primaria-texto)}

/* perfil do cliente */
.perfil{padding:8px 0 22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end}
.perfil .ini{width:56px;height:56px;font-size:17px}
.perfil h1{font-size:46px;margin:0;line-height:1.05}
main > .card:has(.perfil){border:0;border-radius:0;border-bottom:2px solid var(--texto)}
.docs{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 20px;border-top:1px solid var(--borda)}
.doc{border:1px solid var(--borda);border-radius:var(--r-ctrl);padding:6px 8px 6px 7px;display:flex;align-items:center;gap:8px;font-size:12px;background:var(--branco)}
.doc button{border:0;background:none;color:var(--apagado);padding:0 2px;font-size:15px;border-radius:3px}
.doc button:hover{color:var(--vermelho)}

/* abas: índice de seções */
.abas{display:flex;gap:28px;margin:18px 0 22px;border-bottom:1px solid var(--borda);overflow-x:auto}
.aba{border:0;background:none;border-radius:0;padding:10px 0 12px;display:flex;gap:10px;align-items:center;text-align:left;position:relative;color:var(--fraco);flex:none}
.aba .ic{width:26px;height:26px;font-size:15px}
.aba b{display:block;font-size:16px;font-weight:600}
.aba small{color:var(--fraco);font-size:12px}
.aba:hover{color:var(--texto)}
.aba.on{color:var(--texto);padding:10px 0 12px;border:0}
.aba.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primaria)}

/* números grandes: régua, não cartões */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;margin-bottom:22px;border-top:2px solid var(--texto);border-bottom:1px solid var(--borda)}
.kpi{background:none;border:0;border-left:1px solid var(--borda);border-radius:0;padding:16px 20px}
.kpi:first-child{border-left:0;padding-left:0}
.kpi small{display:block;color:var(--fraco);font-size:13px;margin-bottom:6px}
.kpi b{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi.escuro{background:none;color:var(--texto)}
.kpi.escuro small{color:var(--fraco)}.kpi.escuro b{color:var(--primaria-texto)}
.alerta{background:var(--amarelo-fundo);border:0;border-left:3px solid var(--alerta-borda);border-radius:0;padding:12px 16px;font-size:14px;color:var(--alerta-texto);margin-bottom:12px;display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.alerta > i{font-size:17px;margin-top:2px}
.alerta.azul{background:var(--azul-fundo);border-left-color:var(--azul);color:var(--aviso-texto)}

/* conta bancária */
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--fraco);font-size:13px}
.stats span{display:inline-flex;align-items:center;gap:5px}
.meses{display:flex;gap:0;overflow-x:auto;padding:0;margin:14px 0 22px;border:1px solid var(--borda);border-radius:var(--r-painel)}
.mc{flex:1 0 200px;background:var(--branco);border:0;border-left:1px solid var(--borda);border-radius:0;padding:14px 18px;cursor:pointer;text-align:left;position:relative}
.mc:first-child{border-left:0}
.mc:hover{background:var(--linha-hover)}
.mc.on{border:0;border-left:1px solid var(--borda);padding:14px 18px;background:var(--verde-fundo)}
.mc.on::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--primaria)}
.mc b{display:block;margin-bottom:6px;font-family:var(--serif);font-weight:500;font-size:19px}
.mc div{font-size:13px;display:flex;justify-content:space-between;gap:6px;line-height:1.7}
/* médias: régua de números */
.medias{background:none;color:var(--texto);border-radius:0;border-top:2px solid var(--texto);border-bottom:1px solid var(--borda);padding:18px 0;display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:0;align-items:end;margin-bottom:22px}
.medias>div{padding:0 20px;border-left:1px solid var(--borda)}
.medias>div:first-child{padding-left:0;border-left:0}
.medias small{color:var(--fraco);font-size:13px;display:block;margin-bottom:4px}
.medias b{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.01em}
.medias .tit{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--texto);display:block;margin-bottom:2px}
@media (max-width:700px){.medias{grid-template-columns:1fr 1fr;row-gap:14px}.medias>div:first-child{grid-column:1/-1}.medias>div:nth-child(2){padding-left:0;border-left:0}.medias b{font-size:24px}}
.layout-conta{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
@media (max-width:1000px){.layout-conta{grid-template-columns:1fr}}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fc{border:1px solid var(--borda);background:var(--branco);border-radius:2px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--suave)}
.fc:hover{border-color:var(--texto);color:var(--texto)}
.fc.on{background:var(--primaria);color:#fff;border-color:var(--primaria)}
.lote{background:var(--tinta);color:#fff;border-radius:var(--r-painel);padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:68px;z-index:10;box-shadow:0 8px 24px rgba(var(--sombra-rgb),.18)}
.lote button{background:var(--tinta3);border:0;color:#fff;border-radius:3px;padding:6px 10px;font-size:12px;font-weight:600}
.lote button:hover{background:var(--tinta-hover)}
.mes{background:var(--branco);border:0;border-radius:0;overflow:visible;margin-bottom:36px}
.mes-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 0 10px;background:none;color:var(--texto);flex-wrap:wrap;border-bottom:2px solid var(--texto)}
.mes-cab b{font-family:var(--serif);font-size:28px;font-weight:500}
.mes-cab .qtd{color:var(--fraco);font-size:13px}
.mes-cab .tot b{font-family:"Public Sans",sans-serif;font-size:14px;font-weight:700}
.mes-cab input[type=search]{background:var(--branco);border:0;border-bottom:1px solid var(--borda-forte);border-radius:0;padding:6px 0;width:180px;font-size:13px}
.mes-cab input[type=search]:focus{box-shadow:none;border-bottom-color:var(--primaria)}
.bloco-cab{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:600;font-size:13px;border-top:1px solid var(--borda);gap:8px;flex-wrap:wrap;margin-top:8px}
.bloco-cab.conta{background:none;color:var(--azul)}.bloco-cab.cartao{background:none;color:var(--marrom)}
.r{display:grid;grid-template-columns:22px 50px minmax(0,1fr) 220px 124px 140px;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--borda)}
.r:hover{background:var(--linha-hover)}
.r.sel{background:var(--sel-fundo)}
.r.off .desc b,.r.off .valor{color:var(--apagado)}
.r.off .valor{text-decoration:line-through}
.r .desc b{font-weight:600;font-size:15px;word-break:break-word}
.r .meta{font-size:12px;color:var(--fraco);margin-top:2px}
.r .nota{font-size:12px;color:var(--marrom);margin-top:4px}
.r .aviso{font-size:12px;color:var(--aviso-texto);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--azul-fundo);border-radius:0;border-left:2px solid var(--azul);padding:6px 10px;line-height:1.5}
.r .aviso button{border:1px solid var(--azul-borda);background:var(--branco);color:var(--azul);border-radius:2px;padding:2px 8px;font-size:12px;font-weight:600}
.r .valor{text-align:right;font-weight:600;font-size:15px}
.r .valor.entrada{color:var(--verde)}
.r .valor.saida{color:var(--texto)}
.cat{border:1px solid transparent;border-radius:var(--r-ctrl);padding:4px 8px;background:none;text-align:left;font-size:13px;line-height:1.35;width:100%}
.cat:hover{border-color:var(--borda);background:var(--branco)}
.cat .ti-chevron-down{color:var(--apagado);font-size:12px}
.cat .ponto{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.cat .sub{color:var(--fraco);padding-left:13px}
.cat.mudou{background:var(--amarelo-fundo)}
.cat.mudou::after{content:"editada";font-size:10px;font-weight:700;color:var(--marrom);margin-left:13px}
.sit{border:1px solid var(--borda);background:var(--branco);border-radius:2px;padding:4px 10px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--suave)}
.sit:hover{border-color:var(--texto);color:var(--texto)}
.sit.incluido{background:var(--branco);border-color:var(--borda);color:var(--suave)}
.sit.excluido{background:var(--borda2);border-color:var(--borda2);color:var(--fraco)}
.sit.entre_contas{background:var(--azul-fundo);border-color:var(--azul-borda);color:var(--azul)}
.acoes-linha{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.cls{display:inline-flex;width:auto;max-width:100%;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;border:0;background:var(--marca);color:var(--texto);border-radius:2px;padding:3px 8px;font-size:12px;font-weight:700}
.cls:hover{background:var(--marca-hover)}
.cls .ti-chevron-down{opacity:.6}
.cls.fixo,.cls.variavel,.cls.investimento,.cls.entrada,.cls.fora,.cls.cartao_vista{background:none;font-weight:500;padding:3px 8px}
.cls.fixo:hover,.cls.variavel:hover,.cls.investimento:hover,.cls.entrada:hover,.cls.fora:hover,.cls.cartao_vista:hover{background:var(--linha-hover)}
.cls.fixo{color:var(--azul)}
.cls.variavel{color:var(--marrom)}
.cls.investimento{color:var(--investimento)}
.cls.entrada{color:var(--verde)}
.cls.fora{color:var(--fraco)}
.cls.cartao_vista{color:var(--cartao-vista)}
.juntar{border:1px solid var(--borda);border-radius:var(--r-painel);padding:10px 12px;background:var(--branco)}
.juntar-cab{display:flex;gap:9px;align-items:flex-start;color:var(--texto);cursor:pointer}
.juntar-cab input{margin-top:3px}
.juntar-lista{margin-top:8px;max-height:190px;overflow:auto;border-top:1px solid var(--borda2);padding-top:6px}
.juntar-item{display:grid;grid-template-columns:18px minmax(0,1fr) 34px 92px 64px;gap:8px;align-items:center;padding:4px 2px;font-size:13px;color:var(--texto);cursor:pointer;border-radius:3px}
.juntar-item:hover{background:var(--linha-hover)}
.juntar-item .nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.juntar-item .qtd{font-weight:700;color:var(--marrom)}
.juntar-item .num{text-align:right}
.juntar-item .meses{font-size:12px;text-align:right;margin:0;align-self:center;display:block;overflow:visible;border:0}
.juntar.off .juntar-lista{opacity:.4;pointer-events:none}
.cls.auto{background:none;color:var(--fraco);font-weight:400;cursor:default;padding:3px 8px}
.cls.auto:hover{background:none}
.progresso-cls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--branco);border:1px solid var(--borda);border-radius:var(--r-painel);padding:12px 16px;margin-bottom:14px;font-size:13px}
.progresso-cls .trilho{flex:1 1 160px;height:6px;background:var(--borda2);border-radius:0;overflow:hidden;min-width:120px}
.progresso-cls .trilho span{display:block;height:100%;background:var(--primaria);transition:width .4s}
.icone-btn{border:1px solid transparent;background:none;border-radius:3px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--apagado);font-size:16px}
.icone-btn:hover{border-color:var(--borda);color:var(--texto);background:var(--branco)}
.icone-btn.tem{color:var(--marrom);background:var(--amarelo-fundo)}
.menu-sit{position:absolute;background:var(--branco);border:1px solid var(--borda);border-radius:var(--r-painel);padding:6px;box-shadow:0 12px 32px rgba(var(--sombra-rgb),.14);z-index:40;min-width:260px}
.menu-sit button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 9px;border-radius:3px}
.menu-sit button:hover{background:var(--linha-hover)}
.menu-sit small{display:block;color:var(--fraco);font-size:12px}
.r-cab{font-size:12px;color:var(--fraco);background:none;font-weight:600;padding-top:10px;padding-bottom:10px;border-top:0}
.r-cab:hover{background:none}
@media (max-width:860px){
  .r{grid-template-columns:22px minmax(0,1fr) 110px;grid-template-areas:"ck desc valor" "ck cat cat" "ck acoes acoes";gap:6px 10px}
  .r>.ck{grid-area:ck}.r>.data{display:none}.r>.desc{grid-area:desc}.r>.cat-col{grid-area:cat}.r>.valor{grid-area:valor;align-self:start}.r>.acoes-linha{grid-area:acoes;justify-content:flex-start}
  .r-cab{display:none}
  .mes-cab input[type=search]{width:100%}
  main{padding:20px 16px 120px}
  .topo{padding:0 16px}
  .perfil h1,.cab-pagina h1{font-size:32px}
}
.lateral{display:flex;flex-direction:column;gap:28px}
.lateral .card{padding:18px 0 0;border:0;border-top:2px solid var(--texto);border-radius:0}
.lateral h3{margin:0 0 12px;font-size:22px;color:var(--texto)}
.relatorio p{margin:0 0 12px;font-size:14px;line-height:1.65;color:var(--suave)}
.relatorio p b{color:var(--texto)}
.rosca{width:160px;height:160px;border-radius:50%;margin:8px auto 16px;display:flex;align-items:center;justify-content:center}
.rosca div{width:118px;height:118px;border-radius:50%;background:var(--branco);display:flex;flex-direction:column;align-items:center;justify-content:center}
.rosca b{font-family:var(--serif);font-size:17px;font-weight:500}
.leg{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 6px;margin:0 -6px;border-radius:2px;cursor:pointer}
.leg:hover{background:var(--linha-hover)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.barra-cat{display:grid;grid-template-columns:200px minmax(0,1fr) 120px 46px;gap:16px;align-items:center;margin:10px 0;font-size:14px}
.barra-cat .trilho{background:var(--borda2);border-radius:0;height:10px;overflow:hidden}
.barra-cat .trilho span{display:block;height:100%}
@media (max-width:600px){.barra-cat{grid-template-columns:110px minmax(0,1fr) 90px}.barra-cat .pct{display:none}}
.alterna{background:var(--branco);border:1px solid var(--borda);border-radius:var(--r-ctrl);padding:2px;display:inline-flex}
.alterna button{border:0;background:none;color:var(--fraco);padding:5px 11px;border-radius:2px;font-size:12px;font-weight:600}
.alterna button.on{background:var(--tinta);color:#fff}

/* cartão */
.fatura-cab{padding:14px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--borda);background:none!important}
.mes > .fatura-cab{border-top:2px solid var(--texto)}
.conf{width:100%;border-collapse:collapse;font-size:13px}
.cal{display:flex;align-items:flex-end;gap:10px;height:200px;padding:14px 0 0;overflow-x:auto}
.cal .col{flex:1 0 50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border:0;background:none;padding:0;border-radius:2px}
.cal .col:hover .bar{opacity:.85}
.cal .val{font-size:11px;color:var(--fraco);margin-bottom:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cal .bar{width:100%;max-width:52px;border-radius:0;background:var(--cal-barra);min-height:3px}
.cal .col.atual .bar{background:var(--borda)}
.cal .col.pico .bar{background:var(--primaria)}
.cal .col.on .bar{outline:2px solid var(--texto);outline-offset:2px}
.cal .mes-l{font-size:12px;margin-top:7px;color:var(--fraco);white-space:nowrap}
.cal .col.pico .mes-l{color:var(--texto);font-weight:700}
.cal .fim{font-size:11px;color:var(--verde);height:15px;white-space:nowrap}
.tabela-parc{width:100%;border-collapse:collapse;font-size:13px}
.tabela-parc th{text-align:left;font-size:12px;color:var(--fraco);padding:10px 12px 10px 0;border-bottom:1px solid var(--borda);white-space:nowrap;cursor:pointer;user-select:none;font-weight:600}
.tabela-parc th:hover{color:var(--texto)}
.tabela-parc td{padding:10px 12px 10px 0;border-bottom:1px solid var(--borda2)}
.tabela-parc td.n,.tabela-parc th.n{text-align:right}
.trilho-parc{display:inline-block;width:90px;height:5px;background:var(--borda2);overflow:hidden;vertical-align:middle;margin-left:8px}
.trilho-parc span{display:block;height:100%;background:var(--primaria)}
.conf td,.conf th{padding:8px 0;border-top:1px solid var(--borda2);text-align:left}
.conf th{font-size:12px;color:var(--fraco)}
.conf td.n{text-align:right}
main > div > .card[style*="padding:16px"]{border:0;border-top:2px solid var(--texto);border-radius:0;padding:18px 0!important}

/* barra de ações flutuante */
.barra-acoes{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--branco);border:1px solid var(--borda);border-radius:var(--r-painel);padding:6px;display:flex;gap:4px;z-index:25;box-shadow:0 14px 40px rgba(var(--sombra-rgb),.16);max-width:calc(100vw - 24px);overflow-x:auto}
.barra-acoes button{background:none;border:0;color:var(--texto);padding:9px 14px;border-radius:3px;display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.barra-acoes button:hover{background:var(--linha-hover)}
.barra-acoes button.destaque{background:var(--primaria);color:#fff}
.barra-acoes button.destaque:hover{background:var(--primaria-escura)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:var(--r-painel);z-index:60;font-size:13px;font-weight:500;max-width:90vw;box-shadow:0 10px 30px rgba(var(--sombra-rgb),.25);animation:sobe .2s ease-out}
.toast.erro{background:var(--vermelho)}
@keyframes sobe{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.progresso{height:4px;background:var(--borda2);overflow:hidden;margin-top:12px}
.progresso div{height:100%;background:var(--primaria);width:0;transition:width .3s}
.carregando{padding:60px;text-align:center;color:var(--fraco);font-family:var(--serif);font-size:20px}

/* ── modo escuro: escolhido pelo analista, ou automático pelo sistema ── */
:root[data-tema="escuro"]{
  --tinta:#2A3530;--tinta2:#323E38;--tinta3:#3E4C45;--tinta-texto:#A9B3AD;--tinta-hover:#4C5B53;
  --primaria:#1F7A55;--primaria-escura:#25915F;--primaria-texto:#7FD1A8;
  --amarelo-claro:#3A3418;--amarelo-fundo:#2B2715;--marca:#FFE680;--marca-hover:#FFDB4D;
  --fundo:#111714;--branco:#161E1A;--borda:#2A332E;--borda2:#222B26;--linha-hover:#1C2621;--borda-forte:#3C4741;
  --texto:#E6EBE7;--suave:#B7C0BA;--fraco:#8E9892;--apagado:#5F6A64;
  --verde:#7FD1A8;--verde-fundo:#183126;--verde-borda:#2C5141;--verde-claro:#7FD1A8;
  --vermelho:#F2927F;--vermelho-fundo:#3A201C;
  --azul:#93B8E0;--azul-fundo:#1A2735;--azul-borda:#2E4258;--marrom:#E6CD78;
  --sel-fundo:#242A1C;--alerta-borda:#B9982A;--alerta-texto:#F1E3B0;--aviso-texto:#C6DAF0;--cal-barra:#3F7A61;
  --investimento:#A8D27A;--cartao-vista:#D3A6EC;--sombra-rgb:0,0,0;
  --foco:0 0 0 3px rgba(127,209,168,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --tinta:#2A3530;--tinta2:#323E38;--tinta3:#3E4C45;--tinta-texto:#A9B3AD;--tinta-hover:#4C5B53;
  --primaria:#1F7A55;--primaria-escura:#25915F;--primaria-texto:#7FD1A8;
  --amarelo-claro:#3A3418;--amarelo-fundo:#2B2715;--marca:#FFE680;--marca-hover:#FFDB4D;
  --fundo:#111714;--branco:#161E1A;--borda:#2A332E;--borda2:#222B26;--linha-hover:#1C2621;--borda-forte:#3C4741;
  --texto:#E6EBE7;--suave:#B7C0BA;--fraco:#8E9892;--apagado:#5F6A64;
  --verde:#7FD1A8;--verde-fundo:#183126;--verde-borda:#2C5141;--verde-claro:#7FD1A8;
  --vermelho:#F2927F;--vermelho-fundo:#3A201C;
  --azul:#93B8E0;--azul-fundo:#1A2735;--azul-borda:#2E4258;--marrom:#E6CD78;
  --sel-fundo:#242A1C;--alerta-borda:#B9982A;--alerta-texto:#F1E3B0;--aviso-texto:#C6DAF0;--cal-barra:#3F7A61;
  --investimento:#A8D27A;--cartao-vista:#D3A6EC;--sombra-rgb:0,0,0;
  --foco:0 0 0 3px rgba(127,209,168,.35);
  color-scheme:dark;
}}
/* logo: versão escura no tema claro, versão clara no tema escuro */
.logo-tema-escuro{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]) body{--g-claro:color-mix(in srgb,var(--primaria) 50%,#ffffff);--g-fundo:color-mix(in srgb,var(--primaria) 22%,var(--branco))}}
:root[data-tema="escuro"] body{--g-claro:color-mix(in srgb,var(--primaria) 50%,#ffffff);--g-fundo:color-mix(in srgb,var(--primaria) 22%,var(--branco))}
:root[data-tema="escuro"] .logo-tema-claro{display:none!important}
:root[data-tema="escuro"] .logo-tema-escuro{display:block!important}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]) .logo-tema-claro{display:none!important}:root:not([data-tema="claro"]) .logo-tema-escuro{display:block!important}}
/* no escuro o marca-texto mantém texto escuro para continuar legível */
:root[data-tema="escuro"] .cls:not(.fixo):not(.variavel):not(.investimento):not(.entrada):not(.fora):not(.cartao_vista):not(.auto),:root[data-tema="escuro"] .pill.amarelo{color:#1C2420}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]) .cls:not(.fixo):not(.variavel):not(.investimento):not(.entrada):not(.fora):not(.cartao_vista):not(.auto),:root:not([data-tema="claro"]) .pill.amarelo{color:#1C2420}}
.btn-tema{width:34px;height:34px;border-radius:50%;border:1px solid var(--borda);background:var(--branco);color:var(--suave);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.btn-tema:hover{color:var(--texto);border-color:var(--borda-forte)}
.login{position:relative}
.login > .btn-tema{position:absolute;top:20px;right:20px;z-index:2}

/* ── Plano do cliente: cores das duas linhas da simulação (validadas para daltonismo) ── */
:root{--s-mudanca:#2E8B63;--s-atual:#C2410C}
:root[data-tema="escuro"]{--s-mudanca:#38A374;--s-atual:#CC7A22}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--s-mudanca:#38A374;--s-atual:#CC7A22}}

/* aba do analista */
.plano-grade{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}

.plano-bloco{border-top:2px solid var(--texto);padding:16px 0 22px}

.plano-bloco > p{margin:0 0 14px;color:var(--fraco);font-size:14px;max-width:60ch}
.plano-base{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--borda);border-radius:var(--r-painel);margin:0 0 6px}
.plano-base div{padding:12px 14px;border-left:1px solid var(--borda)}

.plano-campos small{display:block;color:var(--fraco);font-size:12px;margin-top:4px}
.atitude{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--borda)}
.atitude:first-of-type{border-top:0}
.atitude .n{font-family:var(--serif);font-size:24px;line-height:1.2;color:var(--primaria-texto)}
.atitude .linha1{display:grid;grid-template-columns:minmax(0,1.2fr) 110px minmax(0,1.4fr) 34px;gap:10px;align-items:end}
.atitude .linha2{margin-top:8px}
.atitude .ganho{font-size:13px;color:var(--fraco);margin-top:6px}
.atitude .ganho b{color:var(--primaria-texto)}
@media (max-width:700px){.atitude .linha1{grid-template-columns:1fr 90px}.atitude .linha1 > :nth-child(3){grid-column:1/-1}}
.plano-chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.plano-chk input{margin-top:3px}
.plano-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}

<body>
<div id="app"><div class="carregando">Carregando…</div></div>

<script>
(() => {
'use strict';
// ════════════════════════════════════════════════════════════════════════
// Utilidades
// ════════════════════════════════════════════════════════════════════════
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataBR = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : esc(iso || '');
const dataLonga = iso => { try { return new Date(iso).toLocaleDateString('pt-BR'); } catch { return ''; } };
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const nomeMes = k => MESES[Number(k.slice(5, 7)) - 1] + ' de ' + k.slice(0, 4);
const nomeMesCurto = k => /^\d{4}-\d{2}/.test(k || '') ? MESES[Number(k.slice(5, 7)) - 1].slice(0, 3).toLowerCase() + '/' + k.slice(2, 4) : '';
const iniciais = n => String(n || '?').trim().split(/\s+/).filter(Boolean).map(p => p[0]).filter((_, i, a) => i === 0 || i === a.length - 1).join('').toUpperCase().slice(0, 2);
const arred = n => Math.round(n * 100) / 100;
const CORES = ['#2E8B63', '#C9A227', '#2F5D8A', '#B5613A', '#6F5AA8', '#3E8E7E', '#A84A6A', '#8A7A4F', '#5C7F99', '#9AA19C', '#7E9B3C', '#7A3E2E'];
const corDe = (() => { const m = {}; let i = 0; return c => m[c] || (m[c] = CORES[i++ % CORES.length]); })();
const NOME_SIT = { incluido: 'No resumo', excluido: 'Ignorado', entre_contas: 'Entre contas' };
const CLASSES = [
  ['fixo', 'ti-lock', 'Custo fixo', 'Gasto que se repete todo mês (aluguel, escola, contas)'],
  ['variavel', 'ti-shopping-cart', 'Custo variável', 'Muda de mês a mês (mercado, lazer, compras)'],
  ['investimento', 'ti-trending-up', 'Investimento', 'Aplicação, previdência, poupança'],
  ['entrada', 'ti-arrow-down-left', 'Entrada', 'Salário, renda, recebimentos'],
  ['cartao_vista', 'ti-credit-card', 'Cartão à vista do mês', 'Compra à vista no cartão (bloco "Cartão à vista do mês")'],
  ['fora', 'ti-ban', 'Não vai para a planilha', 'Fica de fora da planilha da consultoria']
];
const NOME_CLASSE = Object.fromEntries(CLASSES.map(c => [c[0], c[2]]));
/** Entra na contagem "a classificar": no resumo e não é parcela de cartão (essa vai sozinha). */
const classificavel = l => l.situacao === 'incluido';
/** Parcela de compra no cartão: o analista escolhe só entre custo fixo e custo variável. */
const CLASSES_PARCELA = [
  ['fixo', 'ti-lock', 'Custo fixo', 'Para a sua análise. Na planilha, toda parcela vai para "Cartão parcelado", até a última'],
  ['variavel', 'ti-shopping-cart', 'Custo variável', 'Para a sua análise. Na planilha, toda parcela vai para "Cartão parcelado", até a última']
];

// ════════════════════════════════════════════════════════════════════════
// Tema claro / escuro (sem escolha salva, segue o sistema operacional)
// ════════════════════════════════════════════════════════════════════════
const TEMA = 'mirror.tema';
const ICONE_SOL = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICONE_LUA = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const mqEscuro = window.matchMedia('(prefers-color-scheme: dark)');
const temaEscuro = () => document.documentElement.dataset.tema ? document.documentElement.dataset.tema === 'escuro' : mqEscuro.matches;
function botaoTema() {
  const e = temaEscuro();
  return `<button type="button" class="btn-tema" data-acao="tema" aria-label="${e ? 'Usar modo claro' : 'Usar modo escuro'}" title="${e ? 'Modo claro' : 'Modo escuro'}">${e ? ICONE_SOL : ICONE_LUA}</button>`;
}
function atualizarTema() {
  document.querySelectorAll('.btn-tema').forEach(b => { b.outerHTML = botaoTema(); });
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = temaEscuro() ? '#111714' : '#FFFFFF';
}
function alternarTema() {
  const novo = temaEscuro() ? 'claro' : 'escuro';
  document.documentElement.dataset.tema = novo;
  try { localStorage.setItem(TEMA, novo); } catch {}
  atualizarTema();
}
mqEscuro.addEventListener?.('change', atualizarTema);
atualizarTema();

function toast(msg, erro) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : '');
  t.setAttribute('role', erro ? 'alert' : 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), erro ? 6000 : 2600);
}

// ════════════════════════════════════════════════════════════════════════
// Sessão e API
// ════════════════════════════════════════════════════════════════════════
const ARMAZ = 'mirror.sessao';
let sessao = null;
try { sessao = JSON.parse(localStorage.getItem(ARMAZ) || 'null'); } catch { sessao = null; }
function salvarSessao(s) { sessao = s; try { s ? localStorage.setItem(ARMAZ, JSON.stringify(s)) : localStorage.removeItem(ARMAZ); } catch {} }

let renovando = null;
async function renovarSessao() {
  if (!sessao?.renovacao) return false;
  renovando = renovando || fetch('/api/auth/renovar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ renovacao: sessao.renovacao }) })
    .then(async r => { if (!r.ok) return false; salvarSessao(await r.json()); return true; })
    .catch(() => false).finally(() => { setTimeout(() => { renovando = null; }, 0); });
  return renovando;
}

async function api(metodo, rota, corpo, opcoes = {}) {
  const fazer = () => {
    const h = {};
    if (sessao?.token) h.Authorization = 'Bearer ' + sessao.token;
    let body;
    if (corpo instanceof FormData) body = corpo;
    else if (corpo !== undefined) { h['Content-Type'] = 'application/json'; body = JSON.stringify(corpo); }
    return fetch(rota, { method: metodo, headers: h, body });
  };
  if (sessao && sessao.expiraEm && sessao.expiraEm * 1000 < Date.now() + 60000) await renovarSessao();
  let r = await fazer();
  if (r.status === 401 && sessao && !opcoes.semRenovar) {
    if (await renovarSessao()) r = await fazer();
  }
  if (r.status === 401) { salvarSessao(null); location.hash = '#/login'; throw new Error('Sua sessão expirou. Entre de novo.'); }
  if (opcoes.blob) { if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Erro ' + r.status); } return r; }
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(dados.error || 'Erro ' + r.status); e.status = r.status; e.codigo = dados.codigo; throw e; }
  return dados;
}

// ════════════════════════════════════════════════════════════════════════
// Estado
// ════════════════════════════════════════════════════════════════════════
const E = {
  taxonomia: null,              // { categorias, subcategorias }
  clientes: null, buscaClientes: '',
  cli: null,                    // { cliente, analise, documentos, apuracao }
  aba: 'conta', modoMix: 'cat', mesSel: null, filtroCat: {}, busca: {}, sel: new Set(),
  salvando: 0, salvoEm: null,
  calMes: null, ordemParc: 'fim', soPendentes: false
};

// ════════════════════════════════════════════════════════════════════════
// Roteamento
// ════════════════════════════════════════════════════════════════════════
window.addEventListener('hashchange', rotear);
async function rotear() {
  fecharMenus();
  const h = location.hash || '#/clientes';
  if (!sessao) { if (h !== '#/login') { location.hash = '#/login'; return; } return telaLogin(); }
  if (h === '#/login') { location.hash = '#/clientes'; return; }
  if (!E.taxonomia) { try { E.taxonomia = await api('GET', '/api/app/categorias'); } catch (e) { return telaErro(e.message); } }
  if (h === '#/cliente/novo') { E.ap = null; return telaFicha(null); }
  const m = h.match(/^#\/cliente\/([0-9a-f-]{36})(?:\/(conta|cartao|tudo|plano|apresentacao|ficha))?$/i);
  if (m) {
    if (!E.cli || E.cli.cliente.id !== m[1]) { E.mesSel = null; E.filtroCat = {}; E.busca = {}; E.sel = new Set(); E.planoEdit = null; }
    if (m[2] === 'apresentacao') return telaApresentacao(m[1]);
    if (m[2] === 'ficha') { E.ap = null; return telaFicha(m[1]); }
    E.ap = null;
    if (m[2]) E.aba = m[2];
    return telaCliente(m[1]);
  }
  return telaClientes();
}

function telaErro(msg) {
  $('#app').innerHTML = topo() + `<main><div class="card vazio"><h2>Não foi possível carregar</h2><p class="suave">${esc(msg)}</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div></main>`;
}

function topo(extraDir = '') {
  return `<header class="topo">
    <div class="logo" data-acao="ir-clientes" role="link" tabindex="0" aria-label="Ir para a lista de clientes"><img src="/img/logo-dees-destaque.png" alt="Dees" class="logo-img logo-tema-claro"><img src="/img/logo-dees-claro.png" alt="Dees" class="logo-img logo-tema-escuro"></div>
    <div class="dir">${extraDir}${botaoTema()}<button class="avatar" data-acao="menu-usuario" aria-label="Menu do usuário">${esc(iniciais(sessao?.usuario?.nome))}</button></div>
  </header>`;
}
