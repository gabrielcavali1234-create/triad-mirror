<style>
:root{
  --p:#0F5A3F;--p-claro:#7FB59B;--p-fundo:#E5F0EA;--t:#1C2420;--s:#4D5550;--f:#6B736E;--b:#E4E7E4;--b2:#EEF0EE;
  --v:#B03A2E;--v-fundo:#FBEAE7;--am:#FFE680;--am-t:#3D3300;--am-fundo:#FFF3BF;--am-t2:#7A5D00;--bg:#ffffff;--bg2:#F6F7F6;--hero-t:#ffffff;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --p:#5FBF93;--p-claro:#3E8A68;--p-fundo:#17302A;--t:#E6EBE7;--s:#B7C0BA;--f:#8E9892;--b:#2A332E;--b2:#222B26;
  --v:#F2927F;--v-fundo:#3A201C;--am:#E3C04A;--am-t:#1C1A0E;--am-fundo:#3A3214;--am-t2:#E3C04A;--bg:#111714;--bg2:#161E1A;--hero-t:#0E1A15;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 24px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.top .marca,.gv-cab .marca{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em}.top .marca span,.gv-cab .marca span{color:#D9A400}
.top small{font-size:11.5px;color:var(--f);text-align:right}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.15;margin:4px 0 4px}
h1 b,.destaque{color:var(--p);font-weight:600}
.at{font-size:12px;color:var(--f);margin:0 0 16px}
h2{font-size:13px;font-weight:700;color:var(--s);margin:22px 0 10px;text-transform:none}
.hero{background:var(--p);color:var(--hero-t);border-radius:18px;padding:18px}
.hero small{opacity:.85;font-size:13px}.hero .n{display:block;font-family:var(--serif);font-weight:500;font-size:42px;line-height:1.1;margin:4px 0}
.hero .l{display:flex;justify-content:space-between;font-size:13px;opacity:.92;margin-top:10px;border-top:1px solid color-mix(in srgb,var(--hero-t) 30%,transparent);padding-top:10px}
.hero.neg{background:var(--v)}
.alerta{background:var(--v-fundo);color:var(--v);border-radius:14px;padding:12px 14px;font-size:14px;margin:14px 0;line-height:1.4}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin:10px 0}
.bar .tr{grid-column:1/3;height:9px;background:var(--b2);border-radius:5px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--p);border-radius:5px}
.num{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font-size:13px;border-radius:20px;padding:6px 12px;background:var(--b2);color:var(--t)}.chip.am{background:var(--am);color:var(--am-t)}.chip.p{background:var(--p-fundo);color:var(--p)}
.item{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:11px 0;border-bottom:1px solid var(--b)}
.item em{font-style:normal;color:var(--f);font-size:12px;display:block;margin-top:2px}.item b{white-space:nowrap}
.at3{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--b);align-items:flex-start}
.at3 .n{font-family:var(--serif);font-size:30px;line-height:1;color:var(--p);width:20px}.at3 b{font-size:15px}.at3 p{margin:3px 0 0;font-size:13px;color:var(--s);line-height:1.35}
.at3 .g{margin-left:auto;text-align:right;color:var(--p);font-weight:700;font-size:15px;white-space:nowrap}.at3 .g small{display:block;font-weight:400;font-size:11px;color:var(--f)}
.datas{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:8px}
.datas div{text-align:center;padding:12px 6px;border:1px solid var(--b);border-radius:14px}
.datas b{font-family:var(--serif);font-size:21px;font-weight:500;display:block}.datas span{font-size:12px;color:var(--s)}
.seg{display:flex;background:var(--b2);border-radius:12px;padding:3px;margin:10px 0 14px;overflow-x:auto;gap:2px}
.seg button{flex:1;min-width:max-content;border:0;background:none;font:inherit;font-size:13px;padding:8px 10px;border-radius:9px;color:var(--s);line-height:1.2}
.seg button.on{background:var(--bg);color:var(--t);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.comp{display:flex;gap:10px}.comp div{flex:1;border-radius:14px;padding:12px}.comp small{font-size:12px;color:var(--s)}
.comp b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;margin-top:2px}
.meta{margin:14px 0}.meta .h{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.meta .tr{height:11px;background:var(--b2);border-radius:6px;margin:8px 0 5px;overflow:hidden}.meta .tr i{display:block;height:100%;background:var(--p);border-radius:6px}
.meta em{font-style:normal;font-size:12.5px;color:var(--f);line-height:1.35;display:block}
.nota{font-size:12px;color:var(--f);margin-top:14px;line-height:1.45}
.card{border:1px solid var(--b);border-radius:16px;padding:14px;margin:14px 0}
.card .t{font-size:13px;font-weight:700;color:var(--s);margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{border:1px solid var(--b);border-radius:14px;padding:12px 12px 8px}.tile small{font-size:12px;color:var(--s)}
.tile b{display:block;font-family:var(--serif);font-size:24px;font-weight:500;margin:2px 0}.tile em{display:block;font-style:normal;font-size:11.5px;font-weight:600;margin-bottom:4px}
.up{color:var(--v)}.dn{color:var(--p)}.neu{color:var(--f)}
.seg.visu{margin:0 0 14px}.seg.visu button{font-size:12.5px;padding:8px 6px}
.chips-ev{display:flex;gap:10px;overflow-x:auto;margin:12px -18px 0;padding:0 18px 4px;scroll-snap-type:x mandatory}
.chips-ev div{flex:0 0 auto;max-width:230px;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.35;scroll-snap-align:start;color:var(--t)}
.chips-ev b{display:block;font-size:13.5px;margin-bottom:2px}
.cmp{display:grid;grid-template-columns:120px 1fr 48px;gap:8px;align-items:center;font-size:13.5px;margin:9px 0}
.cmp .z{position:relative;height:12px;background:var(--b2);border-radius:3px}.cmp .z:before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--f)}
.cmp .z i{position:absolute;top:0;bottom:0;border-radius:3px}.cmp b{text-align:right;font-size:12.5px}
.spark3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.spark3 div{border:1px solid var(--b);border-radius:12px;padding:10px 8px 6px}
.spark3 small{font-size:11.5px;color:var(--s)}.spark3 b{display:block;font-size:15px;margin:2px 0 4px}
.cat{padding:10px 0;border-bottom:1px solid var(--b)}.cat:last-of-type{border-bottom:0}
.cat-l{display:flex;justify-content:space-between;gap:10px;font-size:14px}.cat-l em{display:block;font-style:normal;font-size:12px;color:var(--f);margin-top:2px}
.cat-l b{white-space:nowrap}.cat-l small{font-size:12px;font-weight:700}
.cat .z{display:block;position:relative;height:8px;background:var(--b2);border-radius:3px;margin-top:7px}
.cat .z:before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--f)}
.cat .z i{position:absolute;top:0;bottom:0;border-radius:3px}
.score{display:flex;gap:14px;align-items:center}.score .sn{font-family:var(--serif);font-size:54px;line-height:1;color:var(--p)}.score .sn small{font-size:19px;color:var(--f)}
.pil{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.pil div{border-radius:12px;padding:10px;font-size:12.5px;line-height:1.35;color:var(--t)}.pil b{display:block;font-size:14px;margin-bottom:2px}
.ev{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--b);font-size:14px;line-height:1.35}.ev:last-of-type{border-bottom:0}
.ev i{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:700}
.ev small{display:block;color:var(--f);font-size:12px;margin-top:2px}
.ev.ok i{background:var(--p-fundo);color:var(--p)}.ev.al i{background:var(--v-fundo);color:var(--v)}.ev.at i{background:var(--am-fundo);color:var(--am-t2)}
svg text{font-family:var(--sans)}
nav[hidden]{display:none!important}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--b);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--f);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--p);font-weight:700}
.instalar{display:flex;gap:10px;align-items:center;background:var(--p-fundo);color:var(--t);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.instalar button{border:0;background:var(--p);color:var(--hero-t);font:inherit;font-weight:700;border-radius:9px;padding:7px 11px;white-space:nowrap}
.instalar .x{background:none;color:var(--f);padding:4px 6px;margin-left:auto}
.vazio{text-align:center;padding:60px 10px;color:var(--s)}.vazio h1{margin-bottom:10px}
#gaveta{position:fixed;left:0;top:0;bottom:0;width:276px;max-width:84vw;background:#0A0A0A;color:#E6E9E7;border-right:1px solid #222;padding:calc(16px + env(safe-area-inset-top)) 14px 18px;display:flex;flex-direction:column;z-index:60;transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto}
#gaveta.aberta{transform:none;box-shadow:10px 0 34px rgba(0,0,0,.22)}
#veu{position:fixed;inset:0;background:rgba(15,22,18,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}#veu.on{opacity:1;pointer-events:auto}
.gv-cab{display:flex;justify-content:space-between;align-items:center}
.gv-x{border:0;background:none;color:var(--f);font-size:22px;line-height:1;padding:4px 6px}
.gv-id{display:flex;gap:11px;align-items:center;margin:16px 4px 12px}.gv-id b{display:block;font-size:15.5px}.gv-id small{color:var(--f)}
.gv-foto{width:46px;height:46px;border-radius:50%;background:var(--p);color:var(--hero-t);display:grid;place-items:center;font-family:var(--serif);font-size:20px;flex:none}
.gv-it{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;font:inherit;font-weight:600;color:var(--s);padding:10px;border-radius:10px;text-align:left;text-decoration:none;font-size:14px}
.gv-it svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gv-it em{margin-left:auto;font-style:normal;font-size:11.5px;background:var(--b2);color:var(--s);border-radius:9px;padding:1px 8px;font-weight:600}
.gv-it.on{background:var(--p-fundo);color:var(--p)}
.gv-t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--f);margin:16px 10px 4px}
.gv-reuniao{background:var(--p-fundo);border-radius:12px;padding:10px 12px;margin:10px 4px 0;font-size:13px}.gv-reuniao b{display:block;font-size:15px;color:var(--t)}
.gv-zap{background:#25D366;color:#fff!important;justify-content:center;margin-top:4px}
.gv-pe{margin-top:auto;padding:14px 10px 0;color:var(--f);font-size:11.5px}
#gaveta .gv-x,#gaveta .gv-id small,#gaveta .gv-t,#gaveta .gv-pe{color:#9AA39E}
#gaveta .gv-id b,#gaveta .gv-cab .marca{color:#fff}
#gaveta .gv-foto{background:#1E7A55;color:#fff}
#gaveta .gv-it{color:#C9CFCB}#gaveta .gv-it:hover{background:#1A1D1B;color:#fff}
#gaveta .gv-it.on{background:#1A1D1B;color:#fff;box-shadow:inset 3px 0 0 #D9A400}#gaveta .gv-it.on:hover{background:#1A1D1B}
#gaveta .gv-it em{background:#262B28;color:#C9CFCB}
#gaveta .gv-reuniao{background:#1A1D1B;color:#C9CFCB}#gaveta .gv-reuniao b{color:#fff}
.cl-nav{display:flex;align-items:center;gap:10px;margin:8px 0 2px}.cl-nav b{font-size:16px;min-width:150px;text-align:center}
.cl-nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--b);background:none;color:var(--t);font-size:20px;line-height:1;cursor:pointer}.cl-nav button:disabled{opacity:.3}
.cl-alerta,.cl-ok{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;margin:6px 0 4px}.cl-alerta{background:var(--v-fundo);color:var(--t)}.cl-alerta b{color:var(--v)}.cl-alerta b.cl-nm{color:inherit}.cl-ok{background:var(--p-fundo)}.cl-ok b{color:var(--p)}
.cl-card{padding:12px 10px}.cl-sem,.cl-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cl-sem span{font-size:11px;color:var(--f);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px}
.cl-dia{aspect-ratio:1/1.05;border:0;border-radius:10px;background:none;color:var(--t);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;transition:background-color .18s,transform .18s}
.cl-dia .n{font-size:15px;font-weight:600}.cl-dia .pt{display:flex;gap:3px;height:6px}.cl-dia .pt i,.cl-leg i{width:6px;height:6px;border-radius:50%;display:inline-block}
i.en{background:var(--p)}i.sa{background:var(--v)}
.cl-dia.nu{background:var(--b2);color:var(--f)}.cl-dia.nu .n{font-weight:500}
.cl-dia.neg{background:var(--v-fundo)}.cl-dia.neg .n{color:var(--v)}
.cl-dia.hj{box-shadow:inset 0 0 0 2px var(--p)}.cl-dia.on{background:var(--p);color:#fff}.cl-dia.on .n{color:#fff}.cl-dia.on i{background:#fff}
.cl-dia.ps{opacity:.45}.cl-dia:active{transform:scale(.94)}
.cl-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--f);margin-top:10px;padding:0 4px}.cl-leg span{display:inline-flex;align-items:center;gap:5px}
.cl-leg i.q{width:11px;height:11px;border-radius:3px}.cl-leg i.q.nu{background:var(--b2);border:1px solid var(--b)}.cl-leg i.q.neg{background:var(--v-fundo)}
.cl-ev{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--b)}.cl-ev:last-child{border-bottom:0}
.cl-dt{width:42px;flex:none;text-align:center;line-height:1.1}.cl-dt b{display:block;font-size:14px}.cl-dt small{font-size:11px;color:var(--f)}
.cl-tx{flex:1;min-width:0;font-size:14px}.cl-tx b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cl-tx small{display:block;font-size:12px;color:var(--f);margin-top:1px}
.cl-v{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}.cl-v.en,.cl-v.en{color:var(--p)}.cl-neg{color:var(--v)}
.re-card{display:block}.re-card .re-t{font-size:13px;color:var(--s)}.re-card b{display:block;font-size:17px;margin-top:2px;text-transform:none}
.re-card b::first-letter{text-transform:uppercase}
.re-acoes{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.re-bt{display:inline-flex;align-items:center;gap:7px;background:var(--p);color:#fff;border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px;text-decoration:none;transition:transform .18s,filter .18s}
.re-bt:hover{transform:translateY(-1px);filter:brightness(1.08)}.re-bt svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.re-g{font-size:13px;color:var(--s);text-decoration:underline}
@media (prefers-color-scheme:dark){.re-bt{color:#0B1A13}}
#gaveta .re-bt{background:#fff;color:#111;font-size:13px;padding:8px 11px}#gaveta .re-g{color:#C9CFCB}
#gaveta div[style*="font-weight:600"]{color:#fff}
#gaveta .gv-zap{color:#fff!important}
.bt-menu{border:0;background:none;color:var(--t);padding:4px;margin-left:-4px;display:flex}
.bt-menu svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.top .esq{display:flex;align-items:center;gap:10px}
@media (min-width:900px){
  #gaveta{transform:none;width:260px;max-width:none}#veu,.bt-menu,.gv-x{display:none!important}
  body{padding-left:260px}#nav{display:none!important}main{max-width:760px}
  .tiles{grid-template-columns:repeat(4,1fr)!important}
  .card svg{max-width:560px;max-height:240px;display:block;margin:0 auto}.top .marca{visibility:hidden}
}

/* ═════ ANIMAÇÕES ═════ */
@keyframes dEntra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dCresceY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dCresceX{from{width:0}}
@keyframes dPulo{0%{transform:scale(1)}40%{transform:scale(1.18) translateY(-2px)}100%{transform:scale(1)}}
.anima>*:not(.top){animation:dEntra .45s cubic-bezier(.2,.7,.2,1) both}
.anima>*:nth-child(3){animation-delay:.04s}.anima>*:nth-child(4){animation-delay:.08s}.anima>*:nth-child(5){animation-delay:.12s}.anima>*:nth-child(6){animation-delay:.16s}.anima>*:nth-child(7){animation-delay:.2s}.anima>*:nth-child(n+8){animation-delay:.24s}
.anima .tiles>*{animation:dEntra .45s cubic-bezier(.2,.7,.2,1) both}.anima .tiles>*:nth-child(2){animation-delay:.06s}.anima .tiles>*:nth-child(3){animation-delay:.12s}.anima .tiles>*:nth-child(4){animation-delay:.18s}
.anima svg rect{transform-box:fill-box;transform-origin:bottom;animation:dCresceY .65s cubic-bezier(.2,.7,.2,1) .2s both}
.anima .tr i,.anima .meta .tr i,.anima .bar i{animation:dCresceX .9s cubic-bezier(.2,.7,.2,1) .25s both}
.tile,.card,.chips-ev>div,.item{transition:transform .2s,box-shadow .2s,background-color .2s}
.tile:hover,.chips-ev>div:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.08)}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.06)}
.item:hover{background:var(--bg2)}
nav button{transition:color .18s}nav button svg{transition:transform .2s}
nav button.on svg{animation:dPulo .38s ease}
nav button:active svg{transform:scale(.9)}
.gv-it{transition:background-color .18s,color .18s,transform .18s}.gv-it:hover{background:var(--bg2);transform:translateX(3px)}.gv-it.on:hover{background:var(--p-fundo)}
.gv-it svg{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}.gv-it:hover svg{transform:scale(1.15)}
.gv-zap:hover{filter:brightness(1.06);transform:translateY(-1px)!important}
#gaveta .gv-it{opacity:1}#gaveta.aberta .gv-it{animation:dEntra .3s ease both}
#gaveta.aberta .gv-it:nth-of-type(2){animation-delay:.03s}#gaveta.aberta .gv-it:nth-of-type(3){animation-delay:.06s}#gaveta.aberta .gv-it:nth-of-type(4){animation-delay:.09s}#gaveta.aberta .gv-it:nth-of-type(5){animation-delay:.12s}
button{transition:transform .12s}button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.gp-card{padding:12px 4px 10px!important;margin:12px 0 6px}
.gp-cal{display:flex;align-items:flex-end;gap:4px;padding:8px 8px 0}
.gp-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;border:0;background:none;padding:6px 0 4px;border-radius:10px;font:inherit;color:inherit;cursor:pointer;transition:background-color .15s}
.gp-col:hover,.gp-col.on{background:var(--bg2)}
.gp-col .gp-fim{font-size:12px;font-weight:800;color:var(--p);min-height:28px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.gp-col .gp-fim small{font-size:9.5px;font-weight:600}
.gp-col .gp-val{font-size:10.5px;letter-spacing:-.2px;font-weight:600;color:var(--s);font-variant-numeric:tabular-nums;white-space:nowrap}
.gp-barra{display:block;width:72%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--p);transition:transform .2s;transform-origin:bottom}
.gp-col:hover .gp-barra{transform:scaleY(1.03)}
.gp-col.atual .gp-barra{background:var(--b)}.gp-col.pico .gp-barra{background:#E3B600}.gp-col.on{background:var(--p-fundo)}.gp-col.on .gp-mes{color:var(--p);font-weight:800}
.gp-col .gp-mes{font-size:11.5px;color:var(--f);margin-top:4px;white-space:nowrap}.gp-col.pico .gp-mes,.gp-col.pico .gp-val{font-weight:800;color:var(--t)}
.gp-q{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.gp-q.cinza{background:var(--b)}.gp-q.am{background:#E3B600}
.anima .gp-barra{animation:dCresceY .6s cubic-bezier(.2,.7,.2,1) .15s both}

.gp-rolo{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.gp-rolo svg{display:block}
.gp-pt{cursor:pointer;outline:none}.gp-pt:focus-visible circle{stroke:var(--p);stroke-width:3}
.gp-val{font-size:11.5px;font-weight:600;fill:var(--t);font-variant-numeric:tabular-nums}.gp-val.pico{font-weight:800}
.gp-fim{font-size:10.5px;font-weight:600;fill:var(--p)}
.gp-mes{font-size:11.5px;fill:var(--f)}.gp-mes.pico{font-weight:800;fill:var(--t)}
.gp-leg{font-size:11.5px;color:var(--f);margin:6px 12px 0;line-height:1.5}.gp-bola{display:inline-block;width:9px;height:9px;border-radius:50%;background:#E3B600;margin-right:5px;vertical-align:-1px}
.gp-sel{margin:10px 8px 2px;border:1px solid var(--b);border-radius:12px;padding:10px 12px;background:var(--bg2)}
.gp-sel-c{display:flex;justify-content:space-between;align-items:center}.gp-sel small{color:var(--f);display:block;margin:2px 0 4px}
.gp-x{border:0;background:none;color:var(--f);font-size:16px;padding:2px 6px}
.carregando{padding:80px 0;text-align:center;color:var(--f)}
</style>
</head>
<body>
<div id="veu" data-acao="fechar-menu"></div><aside id="gaveta" aria-label="Menu" hidden></aside>
<main id="app"><div class="carregando">Carregando…</div></main>
<nav id="nav" hidden><div class="in">
  <button data-aba="hoje"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Hoje</button>
  <button data-aba="calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h2M14 14h2M8 17.5h2"/></svg>Calendário</button>
  <button data-aba="parcelas"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Parcelas</button>
  <button data-aba="plano"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Plano</button>
  <button data-aba="futuro"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Futuro</button>
</div></nav>
<script>
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESES_L = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl0 = n => (n < 0 ? '−' : '') + 'R$ ' + Math.round(Math.abs(n)).toLocaleString('pt-BR');
const brl = n => (n < 0 ? '−' : '') + 'R$ ' + Math.abs(Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mc = k => /^\d{4}-\d{2}/.test(k || '') ? MESES[+k.slice(5, 7) - 1] + '/' + k.slice(2, 4) : '—';
const mLongo = k => /^\d{4}-\d{2}/.test(k || '') ? MESES_L[+k.slice(5, 7) - 1] + ' de ' + k.slice(0, 4) : '';
const dataBR = iso => { try { return new Date(iso).toLocaleDateString('pt-BR'); } catch { return ''; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const ler = k => { try { return localStorage.getItem(k); } catch { return null; } };

const token = decodeURIComponent(location.pathname.split('/')[2] || '');
let F = null, aba = 'hoje', horizonte = 0, pedidoInstalar = null;

// ─── Hoje (v2): três visualizações à escolha (1 relatório · 2 cartões · 3 saúde) ──
// Tudo comparado com o MÊS PASSADO (mais fácil de ler que "média").
let modoGrafico = 'gastos';
const nomeCurto = k => mLongo(k).split(' ')[0];                    // "julho"
const deltaMes = (v, ant, mesAnt, maisEhBom) => {
  if (ant == null) return '<em class="neu">&nbsp;</em>';
  const d = v - ant;
  if (Math.abs(d) < 1) return `<em class="neu">= igual a ${nomeCurto(mesAnt)}</em>`;
  const bom = maisEhBom ? d > 0 : d < 0;
  return `<em class="${bom ? 'dn' : 'up'}">${d > 0 ? '▲' : '▼'} ${brl0(Math.abs(d))} a ${d > 0 ? 'mais' : 'menos'} que em ${nomeCurto(mesAnt)}</em>`;
};
function deltaSobra(at, pa) {
  if (!pa) return '<em class="neu">&nbsp;</em>';
  const n = nomeCurto(pa.mes);
  if (at.sobra >= 0 && pa.sobra >= 0) return deltaMes(at.sobra, pa.sobra, pa.mes, true);
  if (at.sobra < 0 && pa.sobra < 0) { const d = Math.abs(at.sobra) - Math.abs(pa.sobra); return Math.abs(d) < 1 ? `<em class="neu">= igual a ${n}</em>` : `<em class="${d < 0 ? 'dn' : 'up'}">${d < 0 ? '▼' : '▲'} faltou ${brl0(Math.abs(d))} a ${d < 0 ? 'menos' : 'mais'} que em ${n}</em>`; }
  return pa.sobra >= 0 ? `<em class="up">em ${n} sobrou ${brl0(pa.sobra)}</em>` : `<em class="dn">em ${n} faltou ${brl0(-pa.sobra)}</em>`;
}
function sparkSVG(vals, cor) {
  if (vals.length < 2) return '';
  const W = 100, H = 28, mx = Math.max(...vals), mn = Math.min(...vals), x = i => i * W / (vals.length - 1), y = v => H - 3 - (H - 6) * (v - mn) / ((mx - mn) || 1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="28" preserveAspectRatio="none" aria-hidden="true"><path d="M${vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' L')}" fill="none" stroke="${cor}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function graficoMeses(ms, modo) {
  const W = 340, H = 170, pt = 18, pb = 22, n = ms.length, slot = W / n, bw = Math.min(38, slot * 0.6), gx = i => i * slot + (slot - bw) / 2;
  const lbl = (i, txt, last) => `<text x="${gx(i) + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="${last ? 'var(--t)' : 'var(--f)'}" font-weight="${last ? 700 : 400}">${txt}</text>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${modo === 'gastos' ? 'Gastos por mês' : 'Sobra por mês'}">`;
  if (modo === 'gastos') {
    const renda = ms[ms.length - 1].semRenda ? 0 : ms[ms.length - 1].entrou, maxV = Math.max(renda, ...ms.map(m => m.gastou)) * 1.12 || 1, y = v => pt + (H - pt - pb) * (1 - v / maxV);
    ms.forEach((m, i) => { const last = i === n - 1, h = y(0) - y(m.gastou);
      s += `<g><title>${mLongo(m.mes)}: gastou ${brl0(m.gastou)}</title><rect x="${gx(i)}" y="${y(m.gastou)}" width="${bw}" height="${Math.max(0, h)}" rx="4" fill="${last ? 'var(--p)' : 'var(--p-claro)'}"/>
      ${h > 18 ? `<text x="${gx(i) + bw / 2}" y="${y(m.gastou) + 14}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${last ? 'var(--hero-t)' : 'var(--t)'}">${(m.gastou / 1000).toFixed(1).replace('.', ',')}</text>` : ''}</g>${lbl(i, mc(m.mes).split('/')[0], last)}`; });
    if (renda) s += `<line x1="0" x2="${W}" y1="${y(renda)}" y2="${y(renda)}" stroke="var(--p)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W - 2}" y="${y(renda) - 5}" text-anchor="end" font-size="10.5" fill="var(--p)">o que entrou ${brl0(renda)}</text>`;
  } else {
    const mx = Math.max(0, ...ms.map(m => m.sobra)), mn = Math.min(0, ...ms.map(m => m.sobra)), span = (mx - mn) * 1.15 || 1, y = v => pt + (H - pt - pb) * ((mx * 1.08) - v) / span;
    s += `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--f)"/>`;
    ms.forEach((m, i) => { const last = i === n - 1, neg = m.sobra < 0;
      s += `<g><title>${mLongo(m.mes)}: ${neg ? 'faltou' : 'sobrou'} ${brl0(Math.abs(m.sobra))}</title><rect x="${gx(i)}" y="${Math.min(y(m.sobra), y(0))}" width="${bw}" height="${Math.max(1, Math.abs(y(m.sobra) - y(0)))}" rx="3" fill="${neg ? 'var(--v)' : last ? 'var(--p)' : 'var(--p-claro)'}"/>
      <text x="${gx(i) + bw / 2}" y="${neg ? y(m.sobra) + 13 : y(m.sobra) - 4}" text-anchor="middle" font-size="10" fill="var(--s)">${brl0(Math.abs(m.sobra)).replace('R$ ', '')}</text></g>${lbl(i, mc(m.mes).split('/')[0], last)}`; });
  }
  return s + '</svg>';
}

// ── peças comuns
const ICONE_EV = { conquista: ['ok', '★'], alerta: ['al', '!'], atencao: ['at', '!'] };
function blocoEventos(lista) {
  return lista.map(e => `<div class="ev ${ICONE_EV[e.tipo][0]}"><i>${ICONE_EV[e.tipo][1]}</i><div><b>${esc(e.titulo)}</b><small>${mc(e.mes)} · ${esc(e.texto)}</small></div></div>`).join('');
}
function blocoMetas() {
  const pct = m => Math.max(0, Math.min(100, m.valor ? m.atual / m.valor * 100 : 0));
  return F.futuro.metas.map(m => `<div class="meta"><div class="h"><b>${esc(m.titulo)}</b><span class="num">${m.atual >= m.valor ? '✓ concluído' : brl0(m.valor)}</span></div>
    <div class="tr"><i style="width:${pct(m)}%"></i></div><em>${m.atual >= m.valor ? 'Objetivo alcançado.' : `${brl0(m.atual)} de ${brl0(m.valor)}${m.prazo ? ' · prazo ' + mc(m.prazo) : ''} · ${Math.round(pct(m))}%`}</em></div>`).join('');
}
function heroSobra(at, pa) {
  return `${at.semRenda ? `<div class="hero"><small>Gastou em ${nomeCurto(at.mes)}</small><span class="n num">${brl0(at.gastou)}</span><div class="l"><span>Só cartão de crédito</span><span>${at.juros > 0 ? 'Juros ' + brl0(at.juros) : 'Sem juros'}</span></div></div>`
    : `<div class="hero ${at.sobra < 0 ? 'neg' : ''}"><small>${at.sobra >= 0 ? 'Sobrou' : 'Faltou'} em ${nomeCurto(at.mes)}</small>
      <span class="n num">${brl0(Math.abs(at.sobra))}</span>
      <div class="l"><span>Entrou ${brl0(at.entrou)}${at.rendaEstimada ? '*' : ''}</span><span>Gastou ${brl0(at.gastou)}</span></div></div>`}
    ${pa && !at.semRenda ? `<p class="at" style="margin:8px 0 0">${at.sobra >= pa.sobra ? `<b class="dn">▲ ${brl0(at.sobra - pa.sobra)}</b> melhor` : `<b class="up">▼ ${brl0(pa.sobra - at.sobra)}</b> pior`} que ${nomeCurto(pa.mes)}.</p>` : ''}
    ${at.rendaEstimada ? '<p class="nota" style="margin-top:6px">* Renda informada na ficha; gastos só do cartão (sem extrato da conta).</p>' : ''}`;
}
/** Categorias só se comparam entre meses do mesmo tipo (os dois com fatura detalhada, ou nenhum). */
const mesComparavel = (at, pa) => pa && pa.comFatura === at.comFatura ? pa : null;

// ── Visualização 1: resumo em rolagem (relatório)
function visu1(ms, at, pa) {
  const pc = mesComparavel(at, pa), cats = Object.entries(at.categorias).slice(0, 7);
  const ev = F.eventos || [], recentes = ev.filter(e => e.mes >= at.mes);
  return `${heroSobra(at, pa)}
    ${ms.length > 1 ? `<h2>Seus gastos mês a mês</h2>${graficoMeses(ms, 'gastos')}
      <p class="nota" style="margin-top:2px">${pa.gastou > at.gastou ? `Em ${nomeCurto(at.mes)} você gastou ${brl0(pa.gastou - at.gastou)} a menos que em ${nomeCurto(pa.mes)}.` : `Em ${nomeCurto(at.mes)} você gastou ${brl0(at.gastou - pa.gastou)} a mais que em ${nomeCurto(pa.mes)}.`}</p>` : ''}
    ${(recentes.length ? recentes : ev).length ? `<h2>Neste mês</h2>${blocoEventos((recentes.length ? recentes : ev).slice(0, 4))}` : ''}
    ${cats.length && pc ? `<h2>Onde mudou em relação a ${nomeCurto(pc.mes)}</h2>
      ${listaMudancas(cats, pc)}` : ''}
    ${F.futuro.metas.length ? `<h2>Seus objetivos</h2>${blocoMetas()}` : ''}`;
}

/** Categorias do mês com o valor do mês comparado embaixo e a variação ao lado. */
function listaMudancas(cats, pc) {
  return cats.map(([c, v]) => { const r = pc.categorias[c] || 0, d = v - r, p = r ? Math.round(d / r * 100) : null;
    return `<div class="item"><span>${esc(c)}<em>${r ? brl0(r) + ' em ' + nomeCurto(pc.mes) : 'não teve em ' + nomeCurto(pc.mes)}</em></span><b class="num">${brl0(v)}${p == null ? '' : ` <small class="${d > 0 ? 'up' : d < 0 ? 'dn' : 'neu'}" style="font-size:12px">${Math.abs(p) < 1 ? '=' : (d > 0 ? '▲ ' : '▼ ') + Math.abs(p) + '%'}</small>`}</b></div>`; }).join('');
}

// ── Visualização 2: painel de cartões
function visu2(ms, at, pa) {
  const pc = mesComparavel(at, pa), cats = Object.entries(at.categorias).slice(0, 7);
  const ev = (F.eventos || []).slice(0, 6);
  const corChip = { conquista: 'var(--p-fundo)', alerta: 'var(--v-fundo)', atencao: 'var(--am-fundo)' }, simbChip = { conquista: '★', alerta: '!', atencao: '!' };
  return `<div class="tiles" style="margin-top:0">
      ${at.semRenda ? '' : `<div class="tile"><small>Entrou${at.rendaEstimada ? '*' : ''}</small><b class="num">${brl0(at.entrou)}</b>${deltaMes(at.entrou, pa?.entrou, pa?.mes, true)}</div>`}
      <div class="tile"><small>Gastou</small><b class="num">${brl0(at.gastou)}</b>${deltaMes(at.gastou, pa?.gastou, pa?.mes, false)}</div>
      ${at.semRenda ? '' : `<div class="tile"><small>${at.sobra >= 0 ? 'Sobrou' : 'Faltou'}</small><b class="num">${brl0(Math.abs(at.sobra))}</b>${deltaSobra(at, pa)}</div>`}
      <div class="tile"><small>Juros do cartão</small><b class="num">${brl0(at.juros)}</b>${deltaMes(at.juros, pa?.juros, pa?.mes, false)}</div>
    </div>
    ${ev.length ? `<div class="chips-ev">${ev.map(e => `<div style="background:${corChip[e.tipo]}"><b>${simbChip[e.tipo]} ${esc(e.titulo)}</b><span>${esc(e.texto)}</span></div>`).join('')}</div>` : ''}
    ${ms.length > 1 && !at.semRenda ? `<div class="card"><div class="t">Quanto sobrou em cada mês</div>${graficoMeses(ms, 'sobra')}
      <p class="nota" style="margin:0">Sobrou dinheiro em ${ms.filter(m => m.sobra > 0).length} de ${ms.length} meses.</p></div>` : ms.length > 1 ? `<div class="card"><div class="t">Quanto gastou em cada mês</div>${graficoMeses(ms, 'gastos')}</div>` : ''}
    ${cats.length && pc ? `<div class="card"><div class="t">Onde mudou em relação a ${nomeCurto(pc.mes)}</div>${listaMudancas(cats, pc)}</div>` : ''}
    ${F.futuro.metas.length ? `<div class="card"><div class="t">Seus objetivos</div>${blocoMetas()}</div>` : ''}`;
}

// ── Visualização 3: saúde financeira
function visu3(ms, at, pa) {
  const nt = F.nota, ev = F.eventos || [];
  const corPilar = { ok: 'var(--p-fundo)', atencao: 'var(--am-fundo)', ruim: 'var(--v-fundo)' }, simb = { ok: '✓', atencao: '!', ruim: '✕' };
  return `${nt ? `<div class="card" style="margin-top:0"><div class="score"><span class="sn">${nt.valor}<small>/100</small></span><div><b style="font-size:16px">${esc(nt.rotulo)}${nt.anterior != null && nt.valor > nt.anterior ? ', e melhorando' : ''}</b>
      <p class="at" style="margin:4px 0 0">${nt.anterior == null ? 'Primeira avaliação. Vamos acompanhar a cada mês.' : nt.valor > nt.anterior ? `Era ${nt.anterior}. Subiu ${nt.valor - nt.anterior} pontos desde a última atualização.` : nt.valor < nt.anterior ? `Era ${nt.anterior}. Caiu ${nt.anterior - nt.valor} pontos desde a última atualização.` : 'Igual à última atualização.'}</p></div></div>
      <div class="pil">${nt.pilares.map(p => `<div style="background:${corPilar[p.status]}"><b>${esc(p.nome)} ${p.faixa ? '· ' + esc(p.faixa) : simb[p.status]}</b>${p.valor ? `<span style="font-weight:700">${esc(p.valor)}</span> · ` : ''}${esc(p.texto)}</div>`).join('')}</div>
      ${nt.passo ? `<p class="at" style="margin:10px 0 0">Para chegar à faixa <b>${esc(nt.passo.faixa)}</b>: ${esc(nt.passo.texto)}.</p>` : ''}</div>` : ''}
    ${ms.length > 1 ? `<h2>Mês a mês</h2><div class="spark3">
      ${at.semRenda ? '' : `<div><small>Entrou</small><b class="num">${brl0(at.entrou)}</b>${sparkSVG(ms.map(m => m.entrou), 'var(--s)')}</div>`}
      <div><small>Gastou</small><b class="num">${brl0(at.gastou)}</b>${sparkSVG(ms.map(m => m.gastou), 'var(--v)')}</div>
      ${at.semRenda ? `<div><small>Juros</small><b class="num">${brl0(at.juros)}</b>${sparkSVG(ms.map(m => m.juros), 'var(--v)')}</div>` : `<div><small>${at.sobra >= 0 ? 'Sobrou' : 'Faltou'}</small><b class="num">${brl0(Math.abs(at.sobra))}</b>${sparkSVG(ms.map(m => m.sobra), 'var(--p)')}</div>`}
    </div>` : ''}
    ${ev.length ? `<h2>Linha do tempo</h2>${blocoEventos(ev)}` : ''}
    ${F.futuro.metas.length ? `<h2>Seus objetivos</h2>${blocoMetas()}` : ''}
    ${nt ? '<p class="nota">A nota soma 4 pontos de até 25 cada: sobra do mês, juros do cartão, parcelas sobre a renda e reserva de emergência.</p>' : ''}`;
}

// ── Próxima conversa: botão para salvar na agenda do celular (.ics: iPhone, Outlook,
// Samsung) e link para o Google Agenda. Horário de Brasília.
function linkGoogle(pr) {
  const quem = F.consultora || 'sua consultora', z = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  let datas;
  if (pr.hora) { const ini = new Date(`${pr.data}T${pr.hora}:00-03:00`); datas = z(ini) + '/' + z(new Date(ini.getTime() + (pr.duracao || 60) * 60000)); }
  else { const f = new Date(pr.data + 'T12:00:00Z'); f.setUTCDate(f.getUTCDate() + 1); datas = pr.data.replace(/-/g, '') + '/' + f.toISOString().slice(0, 10).replace(/-/g, ''); }
  return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({ action: 'TEMPLATE', text: `Conversa com ${quem} (Dees)`, dates: datas, details: `Conversa de acompanhamento financeiro com ${quem}.` });

// ── Calendário: o mês dia a dia, só dias úteis (fim de semana e feriado em cinza;
// conta que cairia neles vai para o próximo dia útil, entrada vem no anterior).
let calMes = 0, calDia = null;
const SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const dSem = d => SEM[new Date(d + 'T12:00:00').getDay()];
const dCurto = d => d.slice(8, 10) + '/' + d.slice(5, 7);
const vCal = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function telaCalendario() {
  const C = F.calendario;
  if (!C || !C.meses?.length) return `<h1>Calendário</h1><div class="vazio"><p>A sua consultora ainda vai montar o seu calendário.</p></div>`;
  const M = C.meses[Math.min(calMes, C.meses.length - 1)], comSaldo = C.saldoInformado;
  const hoje = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const prim = new Date(M.mes + '-01T12:00:00').getDay();
  const evs = M.dias.flatMap(d => (d.e || []).map(e => ({ ...e, d: d.d })));
  const proxEntrada = (data) => { for (const m of C.meses) for (const d of m.dias) if (d.d > data && (d.e || []).some(e => e.k)) return d; return null; };
  let destaque = '';
  if (comSaldo && M.menor) {
    if (M.menor.saldo < 0) { const pe = proxEntrada(M.menor.data);
      destaque = `<div class="cl-alerta"><b>Dia ${dCurto(M.menor.data)} o saldo fica em ${brl(M.menor.saldo)}.</b>${pe ? ` Segure as compras até ${dSem(pe.d)}, ${dCurto(pe.d)}, quando entra <b class="cl-nm">${esc(pe.e.find(e => e.k).t)}</b>.` : ''}</div>`; }
    else destaque = `<div class="cl-ok"><b>Seu saldo não fica negativo em ${nomeCurto(M.mes)}.</b> O dia mais justo é ${dSem(M.menor.data)}, ${dCurto(M.menor.data)}: ${brl(M.menor.saldo)}.</div>`;
  }
  const cel = d => {
    const ent = (d.e || []).some(e => e.k), sai = (d.e || []).some(e => !e.k), neg = comSaldo && d.s < 0 && d.d >= hoje;
    return `<button class="cl-dia ${d.u ? '' : 'nu'} ${neg ? 'neg' : ''} ${d.d === hoje ? 'hj' : ''} ${d.d === calDia ? 'on' : ''} ${d.d < hoje ? 'ps' : ''}" data-d="${d.d}" aria-label="${dSem(d.d)} ${dCurto(d.d)}${d.f ? ', ' + esc(d.f) : ''}${(d.e || []).length ? ', ' + d.e.length + ' movimentos' : ''}">
      <span class="n">${+d.d.slice(8)}</span><span class="pt">${ent ? '<i class="en"></i>' : ''}${sai ? '<i class="sa"></i>' : ''}</span></button>`;
  };
  const sel = calDia && M.dias.find(d => d.d === calDia);
  const linha = e => `<div class="cl-ev"><span class="cl-dt"><b>${dCurto(e.d)}</b><small>${dSem(e.d)}</small></span><span class="cl-tx"><b>${esc(e.t)}</b>${e.o ? `<small>era ${dSem(e.o)}, ${dCurto(e.o)} · ${e.k ? 'adiantado' : 'passa'} para o dia útil</small>` : e.x ? '<small>valor previsto</small>' : ''}</span><span class="cl-v ${e.k ? 'en' : ''}">${e.k ? '+' : '−'} ${vCal(e.v)}</span></div>`;
  const feriados = M.dias.filter(d => d.f);
  return `<h1>Seu mês, <b>dia a dia</b></h1>
    <div class="cl-nav"><button data-cm="-1" ${calMes ? '' : 'disabled'} aria-label="Mês anterior">‹</button><b>${mLongo(M.mes).replace(/^./, c => c.toUpperCase())}</b><button data-cm="1" ${calMes < C.meses.length - 1 ? '' : 'disabled'} aria-label="Próximo mês">›</button></div>
    <div class="chips"><span class="chip p">Entra ${brl(M.entra)}</span><span class="chip">Contas ${brl(M.sai)}</span></div>
    ${destaque}
    <div class="card cl-card"><div class="cl-sem">${SEM.map(x => `<span>${x}</span>`).join('')}</div>
      <div class="cl-grade">${'<span></span>'.repeat(prim)}${M.dias.map(cel).join('')}</div>
      <div class="cl-leg"><span><i class="en"></i>entra</span><span><i class="sa"></i>sai</span><span><i class="q nu"></i>fim de semana / feriado</span>${comSaldo ? '<span><i class="q neg"></i>saldo negativo</span>' : ''}</div></div>
    ${sel ? `<div class="card gp-sel"><div class="gp-sel-c"><b>${dSem(sel.d).replace(/^./, c => c.toUpperCase())}, ${dCurto(sel.d)}${sel.f ? ' · ' + esc(sel.f) : !sel.u ? ' · fim de semana' : ''}</b><button class="gp-x" data-acao="cal-fechar" aria-label="Fechar">✕</button></div>
      ${(sel.e || []).length ? sel.e.map(e => linha({ ...e, d: sel.d })).join('') : `<p class="at" style="margin:6px 0 0">${sel.u ? 'Nenhuma conta neste dia.' : 'Sem banco neste dia: contas que venceriam aqui passam para o próximo dia útil.'}</p>`}
      ${comSaldo ? `<div class="item" style="border:0"><span>Saldo previsto no fim do dia</span><b class="${sel.s < 0 ? 'cl-neg' : ''}">${brl(sel.s)}</b></div>` : ''}</div>` : ''}
    <h2>Contas e entradas de ${nomeCurto(M.mes)}</h2>
    <div class="card">${evs.length ? evs.map(linha).join('') : '<p class="at">Nada marcado neste mês.</p>'}</div>
    ${feriados.length ? `<p class="at">Sem banco: ${feriados.map(d => `${dCurto(d.d)} (${esc(d.f)})`).join(' · ')}.</p>` : ''}
    <p class="at">Só dias úteis: conta que vence em sábado, domingo ou feriado é paga no próximo dia útil${comSaldo ? `; o saldo já desconta cerca de ${brl0(C.diaADia)} por dia de gastos do dia a dia` : ''}.</p>`;
}

let mesParc = null;   // mês tocado no gráfico de parcelas
/** Calendário de parcelas: uma barra por fatura (cinza = atual, amarela = mais apertada), valor em cima e quantas acabam. */
function graficoParcelas(p) {
  const pm = p.porMes; if (!pm.length) return '';
  const max = Math.max(...pm.map(m => m.valor)) || 1;
  const vTxt = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `<div class="gp-rolo"><div class="gp-cal" style="min-width:${pm.length * (innerWidth >= 900 ? 52 : 64)}px">${pm.map((m, i) => {
    const pico = m.mes === p.pico?.mes, sel = m.mes === mesParc;
    return `<button class="gp-col ${i === 0 ? 'atual' : ''} ${pico ? 'pico' : ''} ${sel ? 'on' : ''}" data-mes="${m.mes}" aria-label="${i === 0 ? 'Fatura atual' : mc(m.mes)}: ${brl(m.valor)}${m.terminam && i > 0 ? ', ' + m.terminam + ' parcelas acabam' : ''}">
      <span class="gp-fim">${m.terminam && i > 0 ? `−${m.terminam}<small>${m.terminam > 1 ? 'acabam' : 'acaba'}</small>` : ''}</span>
      <span class="gp-val">${vTxt(m.valor)}</span>
      <span class="gp-barra" style="height:${Math.max(3, Math.round(m.valor / max * 150))}px"></span>
      <span class="gp-mes">${i === 0 ? 'atual' : mc(m.mes)}</span></button>`; }).join('')}</div></div>`;
}

function telaParcelas() {
  const p = F.parcelas;

  const renda = F.hoje?.renda || 0, pctR = v => renda ? ` · ${Math.round(v / renda * 100)}% da renda` : '';
  const sel = p.porMes.find(m => m.mes === mesParc);

  return `<h1>${p.proxima ? `A próxima fatura já começa com <b>${brl0(p.proxima.valor)}</b> de parcelas.` : `Faltam <b>${brl0(p.totalRestante)}</b> em parcelas.`}</h1>
    <div class="chips">
      ${p.pico ? `<span class="chip am">Mais apertado: ${mc(p.pico.mes)} · ${brl(p.pico.valor)}</span>` : ''}
      ${p.alivio ? `<span class="chip p">Alívio a partir de ${mc(p.alivio.mes)} (cai para ${brl(p.alivio.valor)})</span>` : ''}

      ${sel ? `<div class="gp-sel"><div class="gp-sel-c"><b>${mLongo(sel.mes).replace(/^./, c => c.toUpperCase())}: ${brl(sel.valor)}</b><button class="gp-x" data-acao="parc-fechar" aria-label="Fechar">✕</button></div>
        <small>${doMes.length} ${doMes.length === 1 ? 'parcela' : 'parcelas'}${pctR(sel.valor)}${sel.terminam ? ` · ${sel.terminam} ${sel.terminam > 1 ? 'acabam' : 'acaba'} neste mês` : ''}</small>
        ${doMes.slice().sort((a, b) => (a.fim === sel.mes ? -1 : 0) - (b.fim === sel.mes ? -1 : 0) || b.valor - a.valor).slice(0, 6).map(i => `<div class="item"><span>${esc(i.descricao)}<em>${i.fim === sel.mes ? 'última parcela' : 'termina em ' + mc(i.fim)}</em></span><b class="num">${brl(i.valor)}</b></div>`).join('')}
        ${doMes.length > 6 ? `<small style="margin-top:6px">e mais ${doMes.length - 6} ${doMes.length - 6 === 1 ? 'parcela' : 'parcelas'} — a lista completa está logo abaixo</small>` : ''}</div>` : ''}
    </div>
    <h2>Ainda faltam ${brl0(p.totalRestante)} em parcelas</h2>
    ${p.itens.map(i => `<div class="item"><span>${esc(i.descricao)}<em>parcela ${esc(i.parcela)} · termina em ${mc(i.fim)}</em></span><b class="num">${brl(i.valor)}</b></div>`).join('')}
    <p class="nota">Considera só as compras já feitas. Compras novas parceladas aumentam esses valores.</p>`;
}

    <h2>Suas datas de liberdade</h2>

function telaFuturo() {

    <div class="seg" role="tablist">${hs.map((x, i) => `<button class="${i === horizonte ? 'on' : ''}" data-h="${i}">${mc(x.mes)}<br><span style="font-size:11px;font-weight:400">${esc(x.rotulo)}</span></button>`).join('')}</div>
    <div class="comp">

      <em>${m.atual ? brl0(m.atual) + ' hoje · ' : ''}${m.prazo ? 'prazo ' + mc(m.prazo) + ' · ' : ''}${m.previsao ? 'no ritmo do plano, ' + (m.atual >= m.valor ? 'já alcançado' : 'chega em ' + mc(m.previsao)) : 'acima de 30 anos no ritmo atual'}</em></div>`).join('')}` : ''}

  return '';
}

function desenhar() {
  const telas = { hoje: telaHoje, calendario: telaCalendario, parcelas: telaParcelas, plano: telaPlano, futuro: telaFuturo, objetivos: telaObjetivos };
  $('#app').innerHTML = `<div class="top"><span class="esq"><button class="bt-menu" data-acao="abrir-menu" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="marca">De<span>es</span></span></span><small>${F.consultora ? 'Sua consultora: ' + esc(F.consultora) : ''}</small></div>${barraInstalar()}${telas[aba]()}`;
  const g = $('#gaveta'); g.hidden = false; g.innerHTML = gaveta();
  if (animarProx) { const a = $('#app'); a.classList.remove('anima'); void a.offsetWidth; a.classList.add('anima'); animarProx = false; clearTimeout(window._tA); window._tA = setTimeout(() => a.classList.remove('anima'), 1500); }
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.aba === aba));
  document.title = { hoje: 'Hoje', calendario: 'Calendário', parcelas: 'Parcelas', plano: 'Plano', futuro: 'Futuro', objetivos: 'Objetivos' }[aba] + ' — Dees';
}

document.addEventListener('click', ev => {
  const pt = ev.target.closest('.gp-col');
  if (pt) { mesParc = mesParc === pt.dataset.mes ? null : pt.dataset.mes; const rolo = $('.gp-rolo')?.scrollLeft || 0; desenhar(); const r = $('.gp-rolo'); if (r) r.scrollLeft = rolo; return; }
  const cd = ev.target.closest('.cl-dia[data-d]');
  if (cd) { calDia = calDia === cd.dataset.d ? null : cd.dataset.d; return desenhar(); }
  const b = ev.target.closest('button,[data-acao]'); if (!b) return;
  if (b.dataset.cm) { calMes = Math.max(0, Math.min((F.calendario?.meses.length || 1) - 1, calMes + +b.dataset.cm)); calDia = null; return desenhar(); }
  if (b.dataset.acao === 'parc-fechar') { mesParc = null; return desenhar(); }
  if (b.dataset.acao === 'cal-fechar') { calDia = null; return desenhar(); }
  if (b.dataset.acao === 'abrir-menu') return abrirMenu(true);
  if (b.dataset.acao === 'fechar-menu') return abrirMenu(false);
  if (b.dataset.aba) { abrirMenu(false); animarProx = true; aba = b.dataset.aba; history.replaceState(null, '', '#' + aba); desenhar(); window.scrollTo({ top: 0 }); }
  else if (b.dataset.h) { horizonte = +b.dataset.h; desenhar(); }
  else if (b.dataset.g) { modoGrafico = b.dataset.g; desenhar(); }
  else if (b.dataset.acao === 'fechar-instalar') { guardar('dees.instalar.fechado', '1'); desenhar(); }
  else if (b.dataset.acao === 'instalar' && pedidoInstalar) { pedidoInstalar.prompt(); pedidoInstalar = null; desenhar(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuAberto) abrirMenu(false); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; if (F) desenhar(); });

(async function iniciar() {
  const h = location.hash.slice(1); if (['hoje', 'calendario', 'parcelas', 'plano', 'futuro', 'objetivos'].includes(h)) aba = h;
  try {
    const r = await fetch('/api/publico/app/' + encodeURIComponent(token), { cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.foto) throw new Error(j.error || 'Não foi possível abrir.');
    F = j.foto;
    { const mh = new Date().toISOString().slice(0, 7), mi = (F.calendario?.meses || []).findIndex(m => m.mes === mh); if (mi > 0) calMes = mi; }
    // horizonte inicial: o "fim das parcelas", se houver
    const i = F.futuro.horizontes.findIndex(x => x.rotulo === 'fim das parcelas'); horizonte = i >= 0 ? i : 0;
    $('#nav').hidden = false;
    desenhar();
  } catch (e) {
    $('#app').innerHTML = `<div class="top"><span class="marca">De<span>es</span></span></div><div class="vazio"><h1>Link indisponível</h1><p>${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
